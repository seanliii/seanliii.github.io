<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0b1020"/><text x="72" y="95" fill="#f8fafc" font-family="sans-serif" font-size="44" font-weight="700">Auditable cloud-computer delivery</text><text x="72" y="140" fill="#94a3b8" font-family="sans-serif" font-size="22">Research → Build → Office → Design → Verify</text><g font-family="sans-serif"><rect x="70" y="220" width="230" height="260" rx="24" fill="#172554"/><text x="100" y="275" fill="#93c5fd" font-size="24" font-weight="700">1  Research</text><text x="100" y="330" fill="#e2e8f0" font-size="18">Named work + URL</text><text x="100" y="370" fill="#e2e8f0" font-size="18">Chromium evidence</text><rect x="350" y="220" width="230" height="260" rx="24" fill="#164e63"/><text x="380" y="275" fill="#67e8f9" font-size="24" font-weight="700">2  Build</text><text x="380" y="330" fill="#e2e8f0" font-size="18">Tested source</text><text x="380" y="370" fill="#e2e8f0" font-size="18">1 test passed</text><rect x="630" y="220" width="230" height="260" rx="24" fill="#3f3f46"/><text x="660" y="275" fill="#f4f4f5" font-size="24" font-weight="700">3  Deliver</text><text x="660" y="330" fill="#e2e8f0" font-size="18">ODT + PDF</text><text x="660" y="370" fill="#e2e8f0" font-size="18">Openable output</text><rect x="910" y="220" width="230" height="260" rx="24" fill="#4c1d95"/><text x="940" y="275" fill="#d8b4fe" font-size="24" font-weight="700">4  Verify</text><text x="940" y="330" fill="#e2e8f0" font-size="18">Hashes + screenshots</text><text x="940" y="370" fill="#e2e8f0" font-size="18">Honest verdict</text></g><path d="M300 350h50m230 0h50m230 0h50" stroke="#38bdf8" stroke-width="8" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#38bdf8"/></marker></defs><rect x="70" y="560" width="1070" height="130" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/><text x="100" y="615" fill="#22c55e" font-family="sans-serif" font-size="24" font-weight="700">Evidence over claims</text><text x="100" y="660" fill="#cbd5e1" font-family="sans-serif" font-size="19">No named reference, machine proof, same-task comparison, and independent review → no win claim.</text></svg>