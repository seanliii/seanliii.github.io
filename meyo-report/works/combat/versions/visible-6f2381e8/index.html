<script>


"use strict";
/* =========================================================================
   RIFT LAB — a from-scratch 5v5 MOBA with an experimental three-lane map.
   Single file, vanilla Canvas 2D. Every piece of UI is drawn by the renderer
   (no DOM overlay). Zero external dependencies -> runs offline via file://.
   ========================================================================= */

/* ----------------------------- math / helpers ---------------------------- */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const angleTo=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
function normAngle(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;}

/* ------------------------------ canvas setup ----------------------------- */
const canvas=document.createElement('canvas'); /*2D unused*/
const ctx2dLegacy=canvas.getContext&&null; /*unused*/
let W=0,H=0,DPR=1;
/* old 2D resize removed */

/* ------------------------------ world constants -------------------------- */
const MAP=14820;                    // LoL's actual map size in units
const HALF=MAP/2;
const BLUE=0, RED=1;                // teams
const T_BLUE='#0aa8ff', T_RED='#ff4a3d';

const STATES={MENU:0,PLAYING:1,END:2};
let state=STATES.MENU;

/* ------------------------------ camera ----------------------------------- */
const cam={x:HALF,y:HALF,zoom:0.52,minZoom:0.32,maxZoom:1.4,targetZoom:0.52};
function worldToScreen(wx,wy){return {x:(wx-cam.x)*cam.zoom+W/2,y:(wy-cam.y)*cam.zoom+H/2};}
function screenToWorld(sx,sy){return {x:(sx-W/2)/cam.zoom+cam.x,y:(sy-H/2)/cam.zoom+cam.y};}

/* ------------------------------ helpers ---------------------------------- */
function teamOf(u){return u.team;}
function enemyTeam(t){return t===BLUE?RED:BLUE;}

/* fog of war: what the PLAYER can currently see (render-only; bots keep full awareness) */
function inPlayerVision(u){
  if(!player||!u)return true;
  if(u.team===player.team)return true;
  // fixed enemy structures are always on the map (like LoL)
  if(u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus)return true;
  // temporary reveal zones (Hawkshot)
  for(const z of revealZones){
    if(z.t>0&&dist(u.x,u.y,z.x,z.y)<z.r+u.r)return true;
  }
  // ally units grant vision around themselves
  for(const a of units){
    if(!a.alive||a.team!==player.team)continue;
    let vr=0;
    if(a instanceof Champion)vr=(a===player?1400:1200);
    else if(a instanceof Minion)vr=900;
    else if(a instanceof Tower)vr=1050;
    else continue;
    if(dist(u.x,u.y,a.x,a.y)<vr+u.r)return true;
  }
  return false;
}

/* ------------------------------ game state ------------------------------- */
let player=null;
let units=[];        // all live units (champions/minions/towers/etc)
let projectiles=[];
let particles=[];
let announcements=[];
let revealZones=[];   // {x,y,r,t} temporary vision (Hawkshot)
let gameTime=0;
let waveTimer=12;    // first wave soon after start
let waveIndex=0;
const kills=[0,0];
const towers=[0,0];  // tower kills per team
let firstBlood=false;
let goldDelta=0;
const gold={};
let nexusAlive=[true,true];

const GAME={id:0,
  started:false, ended:false, winner:-1,
  announce(text,color,big){announcements.push({text,color,big:!!big,t:0,dur:big?4:3});}
};

/* =========================================================================
   TERRAIN / MAP  (pre-rendered to an offscreen canvas once)
   ========================================================================= */
let terrainCanvas=null;
const LANES={top:{path:[],width:260},mid:{path:[],width:260},bot:{path:[],width:260}};

// Build a smooth lane path via control points -> cubic sampling
function buildLane(pts,seg=14){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let j=0;j<seg;j++){
      const t=j/seg;
      const a=2*t*t*t-3*t*t+1,b=t*t*t-2*t*t+t,c=t*t*t-t*t,d=-2*t*t*t+3*t*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t*t+(-p0.x+3*p1.x-3*p2.x+p3.x)*t*t*t);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t*t+(-p0.y+3*p1.y-3*p2.y+p3.y)*t*t*t);
      out.push({x,y});
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
// re-sampled equidistant polyline (for smooth minion marching)
function resample(pts,step){
  const out=[{x:pts[0].x,y:pts[0].y}];
  let acc=0;
  for(let i=1;i<pts.length;i++){
    const d=dist(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y);
    acc+=d;
    if(acc>=step){out.push({x:pts[i].x,y:pts[i].y});acc=0;}
  }
  if(out.length<2)out.push(pts[pts.length-1]);
  return out;
}

function paintTerrain(tctx,S,sc){
  // layered forest floor
  const g=tctx.createLinearGradient(0,0,S,S);
  g.addColorStop(0,'#0a1a12'); g.addColorStop(0.35,'#0d2015');
  g.addColorStop(0.55,'#0e2316'); g.addColorStop(0.8,'#0c1e13'); g.addColorStop(1,'#091710');
  tctx.fillStyle=g; tctx.fillRect(0,0,S,S);

  // organic moss / earth blotches
  const rng=seed(7);
  for(let i=0;i<520;i++){
    const x=rng()*S, y=rng()*S;
    const hue=rng();
    tctx.fillStyle=hue<0.5?'rgba(34,78,46,'+(rng()*0.16)+')':(hue<0.8?'rgba(88,72,40,'+(rng()*0.10)+')':'rgba(16,44,60,'+(rng()*0.10)+')');
    tctx.beginPath(); tctx.arc(x,y,rng()*26*sc+6,0,TAU); tctx.fill();
  }

  // diagonal river (layered banks -> deep center)
  const riverPts=[[S*0.18,S*0.90],[S*0.30,S*0.78],[S*0.44,S*0.64],[S*0.56,S*0.50],[S*0.70,S*0.34],[S*0.82,S*0.18]];
  const drawRiver=(w,col)=>{
    tctx.strokeStyle=col;tctx.lineWidth=w;tctx.lineCap='round';tctx.lineJoin='round';
    tctx.beginPath();tctx.moveTo(riverPts[0][0],riverPts[0][1]);
    for(let i=1;i<riverPts.length;i++)tctx.lineTo(riverPts[i][0],riverPts[i][1]);
    tctx.stroke();
  };
  drawRiver(Math.max(30,210*sc),'rgba(24,58,74,0.35)');   // bank
  drawRiver(Math.max(22,160*sc),'#12374a');
  drawRiver(Math.max(14,100*sc),'#164a63');
  drawRiver(Math.max(7,52*sc),'#1d5f7f');
  // river light speckles
  for(let i=0;i<140;i++){
    const t=rng(), off=(rng()-0.5)*110*sc;
    const x=S*(0.18+0.64*t)+off*Math.cos(Math.PI/4);
    const y=S*(0.90-0.72*t)+off*Math.sin(Math.PI/4);
    tctx.fillStyle='rgba(140,220,255,'+(rng()*0.08+0.02)+')';
    tctx.beginPath();tctx.arc(x,y,rng()*5*sc+1,0,TAU);tctx.fill();
  }

  // lane roads (dark edge, light path, dashed centre line)
  for(const k in LANES){
    const path=LANES[k].path;
    const trace=(w,col)=>{tctx.strokeStyle=col;tctx.lineWidth=w;tctx.lineCap='round';tctx.lineJoin='round';
      tctx.beginPath();path.forEach((p,i)=>{const x=p.x*sc,y=p.y*sc;i?tctx.lineTo(x,y):tctx.moveTo(x,y);});tctx.stroke();};
    trace(Math.max(14,170*sc),'rgba(12,24,15,0.75)');
    trace(Math.max(10,124*sc),'rgba(42,78,48,0.75)');
    trace(Math.max(6,84*sc),'rgba(58,96,60,0.75)');
    tctx.strokeStyle='rgba(210,220,190,0.10)';tctx.lineWidth=Math.max(1.2,4*sc);tctx.setLineDash([10*sc,14*sc]);
    trace(0);
    tctx.setLineDash([]);
  }

  // base platforms (fountain + stone rings)
  const bases=[[S*0.135,S*0.865,'rgba(20,120,220,0.20)','rgba(150,200,255,0.10)'],[S*0.865,S*0.135,'rgba(220,60,40,0.20)','rgba(255,180,160,0.10)']];
  bases.forEach(b=>{
    const gb=tctx.createRadialGradient(b[0],b[1],8,b[0],b[1],S*0.17);
    gb.addColorStop(0,b[2]);gb.addColorStop(1,'rgba(0,0,0,0)');
    tctx.fillStyle=gb;tctx.beginPath();tctx.arc(b[0],b[1],S*0.17,0,TAU);tctx.fill();
    tctx.strokeStyle=b[3];tctx.lineWidth=Math.max(1.5,3*sc);
    tctx.beginPath();tctx.arc(b[0],b[1],S*0.075,0,TAU);tctx.stroke();
    tctx.beginPath();tctx.arc(b[0],b[1],S*0.055,0,TAU);tctx.stroke();
  });

  // jungle camp clearings
  jungleCamps.forEach(c=>{
    const gb=tctx.createRadialGradient(c.x*sc,c.y*sc,4,c.x*sc,c.y*sc,80*sc);
    gb.addColorStop(0,'rgba(30,52,34,0.55)');gb.addColorStop(1,'rgba(0,0,0,0)');
    tctx.fillStyle=gb;tctx.beginPath();tctx.arc(c.x*sc,c.y*sc,80*sc,0,TAU);tctx.fill();
  });

  // bushes: clustered, lit from top-left
  for(let i=0;i<420;i++){
    const x=rng()*S, y=rng()*S;
    const wx=x/sc, wy=y/sc;
    if(Math.min(distToLanes(wx,wy),200)<160)continue;
    const r=rng()*16*sc+4;
    tctx.fillStyle='rgba(12,32,18,'+(rng()*0.5+0.25)+')';
    tctx.beginPath();tctx.arc(x,y,r,0,TAU);tctx.fill();
    tctx.fillStyle='rgba(46,92,56,'+(rng()*0.35+0.05)+')';
    tctx.beginPath();tctx.arc(x-r*0.2,y-r*0.25,r*0.5,0,TAU);tctx.fill();
  }

  // vignette edges
  const vg=tctx.createRadialGradient(S/2,S/2,S*0.42,S/2,S/2,S*0.74);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  tctx.fillStyle=vg;tctx.fillRect(0,0,S,S);
}
function seed(n){let s=n;return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function distToLanes(x,y){
  let m=1e9;
  for(const k in LANES)for(const p of LANES[k].path)m=Math.min(m,dist(x,y,p.x,p.y));
  return m;
}

let UID=1;
class Unit{
  constructor(x,y,team){
    this.id=UID++;
    this.x=x;this.y=y;this.team=team;
    this.r=20;this.hp=100;this.maxhp=100;
    this.alive=true;this.target=null;this.dead=false;
    this.facing=0;
    this.slowPct=0;this.slowT=0;
    this.stunT=0;this.rootT=0;this.silenceT=0;
    this.effects=[]; // {type,t,max,data}
  }
  get isStunned(){return this.stunT>0||this.rootT>0;}
  get speedMul(){return (this.slowPct>0?1-this.slowPct:1);}
  get totalAS(){return this.as*(this.asBoostT>0?1.5:1);}              // used by minions/monsters too
  get effMS(){return this.ms*this.speedMul*(this.msBoostT>0?this.msBoost:1);}
  takeDamage(dmg,src,type){
    if(!this.alive)return;
    if(!isFinite(dmg))return;                                    // NaN damage must never corrupt HP
    if(!isFinite(this.hp)||!isFinite(this.maxhp))this.hp=this.maxhp;  // self-heal legacy corruption
    const effArmor=this.armor+(this.armorBonusT>0?(this.armorBonus||0):0);
    let m=effArmor?100/(100+effArmor):1;
    if(type==='true')m=1;
    if(type==='magic')m=this.mr?100/(100+this.mr):1;
    let final=Math.max(1,Math.round(dmg*m));
    if(this.shield>0){                       // shields absorb before HP
      const absorbed=Math.min(this.shield,final);
      this.shield-=absorbed;final-=absorbed;
    }
    this.hp-=final;
    if(this instanceof Champion&&this.recalling&&final>0){this.recalling=false;this.recallT=0;}  // damage cancels recall
    if(this.hp<=0)this.die(src);
    return final;
  }
  die(killer){this.alive=false;this.dead=true;}
}

class Champion extends Unit{
  constructor(key,team,x,y,isPlayer){
    super(x,y,team);
    const c=CHAMPIONS[key];
    this.key=key;this.name=c.name;this.role=c.role;this.champColor=c.color;this.isPlayer=isPlayer;
    this.level=1;this.xp=0;this.gold=500;
    this.ad=c.base.ad;this.ap=c.base.ap;this.armor=c.base.armor;this.mr=c.base.mr;
    this.ms=c.base.ms;this.range=c.base.range;this.baseAS=c.base.as;this.as=c.base.as;
    this.hpr=c.base.hpr;this.mpr=c.base.mpr;
    this.maxhp=c.base.hp;this.hp=c.base.hp;
    this.maxmana=c.base.mana;this.mana=c.base.mana;
    this.growth=c.growth;
    this.r=26;
    this.attackCd=0;this.castT=0;
    this.abilities={};
    this.spellRanks={Q:1,W:0,E:0,R:0};
    this.unspentPoints=1;   // level 1 grants a point (Q is pre-learned, so bank it)
    this.summoner={D:{cd:0,max:240},F:{cd:0,max:210}};
    this.items=[];
    this.cs=0;this.k=0;this.d=0;this.a=0;this.goldAcc=0;
    this.shield=0;this.shieldT=0;
    this.trueDmgT=0;this.trueDmg=0;
    this.asBoostT=0;this.msBoostT=0;this.msBoost=1;
    this.spinT=0;this.spinDmg=0;
    this.meditateT=0;
    this.recallT=0;this.recalling=false;
    this.respawnT=0;
    this.aaCount=0;
    this.tibbers=null;
    this.lastCombat=0;
    this.aggroT=0;
    // instantiate ability cooldowns
    for(const slot in c.abilities){this.abilities[slot]={...c.abilities[slot],cdT:0};}
    this.updateStats();
  }
  updateStats(){
    // recompute from level + items (kept simple, faithful ratios)
    const c=CHAMPIONS[this.key],lvl=this.level-1;
    this.maxhp=Math.round(c.base.hp+c.growth.hp*lvl);
    this.maxmana=Math.round(c.base.mana+c.growth.mana*lvl);
    this.ad=c.base.ad+c.growth.ad*lvl;
    this.armor=c.base.armor+c.growth.armor*lvl;
    this.mr=c.base.mr+c.growth.mr*lvl;
    this.baseAS=this.as=c.base.as+c.growth.as*lvl;
    // items add stats (AD/AP/HP/MS/armor/MR)
    let itemAD=0,itemAP=0,itemHP=0,itemMS=0,itemArmor=0,itemMR=0;
    for(const it of this.items){
      itemAD+=it.ad||0;itemAP+=it.ap||0;itemHP+=it.hp||0;
      itemMS+=it.ms||0;itemArmor+=it.armor||0;itemMR+=it.mr||0;
    }
    this.ad+=itemAD;this.ap+=itemAP;this.maxhp+=itemHP;
    this.ms=c.base.ms+itemMS;
    this.armor+=itemArmor;this.mr+=itemMR;
    this.hp=clamp(this.hp,0,this.maxhp);this.mana=clamp(this.mana,0,this.maxmana);
  }
  grantXP(v){
    this.xp+=v;
    while(this.xp>=xpForLevel(this.level)&&this.level<18){this.xp-=xpForLevel(this.level);this.levelUp();}
  }
  levelUp(){
    this.level++;
    const was=this.hp/this.maxhp, wasM=this.mana/this.maxmana;
    this.updateStats();
    this.hp=Math.round(this.maxhp*was);this.mana=Math.round(this.maxmana*wasM);
    this.unspentPoints++;
    if(this.isPlayer)GAME.announce('Level '+this.level+' — Ctrl+Q/W/E/R to learn','#ffd76b');
    spawnParticles(this.x,this.y,this.champColor,18,'level');
  }
  learn(slot){
    const maxRank=slot==='R'?3:5;
    const needLvl=slot==='R'?(this.spellRanks.R===0?6:this.spellRanks.R===1?11:16):1;
    if(this.unspentPoints>0&&(this.spellRanks[slot]||0)<maxRank&&this.level>=needLvl){
      this.spellRanks[slot]=(this.spellRanks[slot]||0)+1;this.unspentPoints--;
      if(this.isPlayer)spawnFloatingText(this.x,this.y,slot+' → '+this.spellRanks[slot],'#ffd76b');
    }
  }
  recall(){
    if(this.recalling)return;
    this.recalling=true;this.recallT=8;
  }
  die(killer){
    if(!this.alive)return;
    this.alive=false;this.dead=true;
    this.respawnT=this.level*2.5+5;
    this.d=(this.d||0)+1;
    if(killer&&killer.team!==this.team){
      awardKill(killer,this);
    }
    spawnParticles(this.x,this.y,'#ff5555',30,'death');
    if(this.isPlayer)GAME.announce('You have been slain!','#ff6a5a',true);
  }
  respawnTick(dt){
    if(!this.alive){
      this.respawnT-=dt;
      if(this.respawnT<=0)this.respawn();
    }
  }
  respawn(){
    this.alive=true;this.dead=false;
    this.hp=this.maxhp;this.mana=this.maxmana;
    const b=this.team===BLUE?{x:2000,y:12820}:{x:12820,y:2000};
    this.x=b.x+rand(-80,80);this.y=b.y+rand(-80,80);
    spawnParticles(this.x,this.y,this.team===BLUE?T_BLUE:T_RED,20,'spawn');
  }
}
function xpForLevel(l){return 90+10*l;}

class Tower extends Unit{
  constructor(x,y,team,rank){
    super(x,y,team);
    this.rank=rank; // 0 outer 1 inner 2 inhib 3 nexus
    this.r=58;
    this.range=rank===3?920:800;this.attackCd=0;   // nexus turrets cover the base approach
    const hp=[3500,4000,4500,2600][rank];
    this.maxhp=hp;this.hp=hp;
    this.ad=[180,200,220,260][rank];
    this.armor=60;this.mr=100;
    this.dmgStack=1;
    this.lastTarget=null;
  }
  die(killer){
    if(!this.alive)return;
    this.alive=false;this.dead=true;
    towers[this.team===BLUE?1:0]++;   // credit the ENEMY team with a structure
    GAME.announce((this.team===BLUE?'Blue':'Red')+' tower destroyed!',this.team===BLUE?T_RED:T_BLUE,true);
    spawnParticles(this.x,this.y,'#ffd76b',36,'death');
    // tower gold to nearby enemy champions (LoL: shared local gold)
    if(killer&&killer.team!==this.team){
      for(const u of units){
        if(u instanceof Champion&&u.alive&&u.team!==this.team&&dist(u.x,u.y,this.x,this.y)<1400){u.gold+=150;goldDelta+=150;}
      }
    }
  }
}
function makeTower(x,y,team,rank){const t=new Tower(x,y,team,rank);return t;}

class Minion extends Unit{

    this.gold=type==='melee'?21:(type==='caster'?14:60);
    this.xp=type==='melee'?58:(type==='caster'?29:92);

  }

    if(!this.alive)return;

      killer.grantXP(this.xp);
      killer.cs=(killer.cs||0)+1;
      if(killer.isPlayer)spawnFloatingText(this.x,this.y,'+'+this.gold+'g','#ffd76b',0);
    }
    spawnParticles(this.x,this.y,'#cccccc',6,'death');
  }
}

class Projectile{
  constructor(x,y,team,opts){
    this.x=x;this.y=y;this.team=team;
    this.speed=opts.speed||1200;this.range=opts.range||900;
    this.damage=opts.damage||0;this.ap=opts.ap||0;this.ratio=opts.ratio||0;
    this.kind=opts.kind||'aa';       // aa | skillshot | aoe
    this.target=opts.target||null;
    this.sx=x;this.sy=y;this.color=opts.color||'#fff';
    this.r=opts.r||6;
    this.dx=0;this.dy=0;this.dead=false;
    this.hitSet=new Set();
    this.src=opts.src||null;
    this.stun=opts.stun||0;this.slow=opts.slow||0;this.root=opts.root||0;
    this.width=opts.width||40;
    this.aoeR=opts.aoeR||0;this.aoeDmg=opts.aoeDmg||0;
    this.execute=opts.execute||false;this.base=opts.base||0;
    this.trueDmg=opts.trueDmg||0;
    // set direction
    if(this.target){const a=angleTo(x,y,this.target.x,this.target.y);this.dx=Math.cos(a);this.dy=Math.sin(a);}
    else{this.dx=opts.dx||0;this.dy=opts.dy||0;}
    this.dirAngle=Math.atan2(this.dy,this.dx);
    this.traveled=0;
  }
  update(dt){
    const step=this.speed*dt;
    this.x+=this.dx*step;this.y+=this.dy*step;this.traveled+=step;
    if(this.traveled>=this.range){this.dead=true;return;}
    // homing for basic attacks
    if(this.kind==='aa'&&this.target&&this.target.alive){
      const a=angleTo(this.x,this.y,this.target.x,this.target.y);
      this.dx=Math.cos(a);this.dy=Math.sin(a);
    }
    // collision
    if(this.kind==='aa'){
      if(this.target&&this.target.alive&&dist(this.x,this.y,this.target.x,this.target.y)<this.target.r+this.r){
        this.dead=true;
        const dmg=this.damage+(this.src?(this.src.ap||0)*this.ap:0);
        const type=this.trueDmg>0?'true':(this.src&&this.src.ap>0?'magic':'physical');
        this.target.takeDamage(dmg,this.src,type);
        if(this.stun)applyCC(this.target,'stun',this.stun);
        if(this.slow)applyCC(this.target,'slow',this.slow);
        if(this.root)applyCC(this.target,'root',this.root);
        if(this.trueDmg>0)this.target.takeDamage(this.trueDmg,this.src,'true');
        if(this.target instanceof Champion&&this.src)this.src.onHit?.(this.target);
      }
    } else if(this.kind==='skillshot'||this.kind==='aoe'){
      for(const u of units){
        if(u.team===this.team||!u.alive||this.hitSet.has(u.id))continue;
        if(u instanceof Minion||u instanceof Champion||u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus){
          if(dist(this.x,this.y,u.x,u.y)<u.r+this.width/2){
            this.hitSet.add(u.id);
            const dmg=this.damage+(this.src?(this.src.ad||0)*this.ratio:0)+(this.src?(this.src.ap||0)*this.ap:0);
            u.takeDamage(dmg,this.src,this.src&&this.src.ap>0?'magic':'physical');
            if(this.stun)applyCC(u,'stun',this.stun);
            if(this.slow)applyCC(u,'slow',this.slow);
            if(this.root)applyCC(u,'root',this.root);
            if(this.kind==='skillshot'&&!this.passThrough)this.dead=true;
          }
        }
      }
      // AOE landing
      if(this.kind==='aoe'&&this.aoeR>0){
        // handled via aoeDamage call at cast; projectile is visual only
      }
    }
    if(this.x<0||this.y<0||this.x>MAP||this.y>MAP)this.dead=true;
  }
}

/* ------------------------------ CC / effects ----------------------------- */
function applyCC(u,type,dur,data){
  if(type==='slow'){u.slowPct=Math.max(u.slowPct,data||0.3);u.slowT=Math.max(u.slowT,dur);}
  else if(type==='stun'){u.stunT=Math.max(u.stunT,dur);}
  else if(type==='root'){u.rootT=Math.max(u.rootT,dur);}
  else if(type==='silence'){u.silenceT=Math.max(u.silenceT,dur);}
}
function tickCC(u,dt){
  if(u.slowT>0){u.slowT-=dt;if(u.slowT<=0)u.slowPct=0;}
  if(u.stunT>0)u.stunT-=dt;
  if(u.rootT>0)u.rootT-=dt;
  if(u.silenceT>0)u.silenceT-=dt;
  if(u.shieldT>0){u.shieldT-=dt;if(u.shieldT<=0)u.shield=0;}
  if(u.trueDmgT>0){u.trueDmgT-=dt;if(u.trueDmgT<=0)u.trueDmg=0;}
  if(u.asBoostT>0)u.asBoostT-=dt;
  if(u.msBoostT>0)u.msBoostT-=dt;
  if(u.spinT>0)u.spinT-=dt;
  if(u.meditateT>0)u.meditateT-=dt;
  if(u.armorBonusT>0){u.armorBonusT-=dt;if(u.armorBonusT<=0)u.armorBonus=0;}
}

/* ------------------------------ combat / economy ------------------------- */
function awardKill(killer,victim){
  if(!(killer.team===BLUE||killer.team===RED))return;   // neutral monster executions don't count toward team kills
  kills[killer.team]++;
  const isFB=!firstBlood;if(isFB)firstBlood=true;
  const bounty=300+(isFB?100:0);
  const msg=(isFB?'FIRST BLOOD — ':'')+(killer.name||'A tower')+' killed '+victim.name;
  GAME.announce(msg,killer.team===BLUE?T_BLUE:T_RED,true);
  if(killer instanceof Champion){
    killer.gold+=bounty;goldDelta+=bounty;
    killer.k=(killer.k||0)+1;
    killer.grantXP(250+20*victim.level);
    spawnFloatingText(victim.x,victim.y,'+'+bounty+'g','#ffd76b');
  } else {
    // executed by a tower/minion/monster: gold pool goes to the nearest enemy champion (LoL-style assist for proximity)
    let heir=null,hd=1400;
    for(const u of units){
      if(u instanceof Champion&&u.alive&&u.team===killer.team){const d=dist(u.x,u.y,victim.x,victim.y);if(d<hd){hd=d;heir=u;}}
    }
    if(heir){heir.gold+=Math.round(bounty*0.5);heir.grantXP(150+15*victim.level);}
  }
  spawnParticles(victim.x,victim.y,'#ffe08a',40,'death');
}

/* ------------------------------ AI (bots) -------------------------------- */
function botThink(bot,dt){
  if(!bot.alive||bot===player)return;
  bot.lastCombat-=dt;
  // late game: group mid with the frontmost allied wave (real 'group mid' call)
  if(gameTime>360&&bot.hp>bot.maxhp*0.5){
    let front=null,fp=-1;
    const path=LANES.mid.path;
    for(const a of units){
      if(a.alive&&a.team===bot.team&&a instanceof Minion&&a.lane==='mid'&&!a.tibbers){
        const prog=bot.team===BLUE?a.pathIndex:(path.length-1-a.pathIndex);
        if(prog>fp){fp=prog;front=a;}
      }
    }
    if(front){
      const d=dist(bot.x,bot.y,front.x,front.y);
      if(d>600){bot.moveTarget={x:front.x,y:front.y};bot.target=null;bot.attacking=false;return;}
    }
  }
  // shop like a real player: buy the best affordable item when in base or rich
  if(bot.items.length<6&&bot.gold>=875&&(!bot.recalling)){
    const affordable=ITEMS.filter(i=>i.cost<=bot.gold&&i.cat!=='defense'||i.id==='boots'&&bot.gold>=i.cost);
    const pick=ITEMS.filter(i=>i.cost<=bot.gold).sort((a,b)=>b.cost-a.cost)[0];
    if(pick){bot.gold-=pick.cost;bot.items.push(pick);bot.updateStats();}
  }
  // spend skill points automatically (R > Q > W > E priority, like real players)
  if(bot.unspentPoints>0){
    for(const slot of ['R','Q','W','E']){
      const before=bot.spellRanks[slot]||0;
      bot.learn(slot);
      if((bot.spellRanks[slot]||0)>before)break;
    }
  }
  // target selection: prioritize structures when healthy and minions tanking (real push behavior)
  let nearest=null,nearD=1e9;
  const aggro=(u)=>u.alive&&u.team!==bot.team&&(u instanceof Champion||u instanceof Minion||u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus||u.isMonster);
  for(const u of units){
    if(!aggro(u))continue;
    const d=dist(bot.x,bot.y,u.x,u.y);
    let reach=bot.range+u.r+120;
    if(u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus){
      const allIn=gameTime>900;   // endgame: commit to the push (real players group and end)
      if(!allIn&&bot.hp<bot.maxhp*0.45)continue;
      const tank=units.some(a=>a.alive&&a.team===bot.team&&a instanceof Minion&&dist(a.x,a.y,u.x,u.y)<900);
      if(tank||allIn)reach+=520;
    }
    if(d<reach&&d<nearD){nearD=d;nearest=u;}
  }  // press lane if nothing nearby
  if(!nearest){
    // walk toward enemy base
    const goal=bot.team===BLUE?{x:12820,y:2000}:{x:2000,y:12820};
    bot.moveTarget={x:goal.x+rand(-400,400),y:goal.y+rand(-400,400)};
    bot.attacking=false;bot.target=null;
  } else {
    if(dist(bot.x,bot.y,nearest.x,nearest.y)>bot.range+nearest.r-10){
      bot.moveTarget={x:nearest.x,y:nearest.y};
      bot.target=nearest;bot.attacking=true;
    } else {
      bot.attacking=true;bot.target=nearest;bot.moveTarget=null;
    }
  }
  // use abilities naively
  for(const slot of ['Q','W','E','R']){
    const ab=bot.abilities[slot];
    if(ab.cdT<=0&&bot.spellRanks[slot]>0&&bot.mana>=ab.cost&&!bot.isStunned&&bot.silenceT<=0){
      if(nearest&&dist(bot.x,bot.y,nearest.x,nearest.y)<(ab.range||bot.range+300)){
        castAbility(bot,slot,nearest);
      }
    }
  }
  // recall if low
  if(bot.hp<bot.maxhp*0.35&&!bot.recalling){bot.recalling=true;bot.recallT=8;}
}


/* interactive surrender: HUD buttons / Enter / Escape */
function acceptSurrender(){
  if(!GAME.surrenderOffer)return;
  GAME.ended=true;GAME.winner=GAME.surrenderOffer.by===RED?BLUE:RED;
  GAME.announce((GAME.winner===BLUE?'Red':'Blue')+' team surrendered — victory!',GAME.winner===BLUE?T_BLUE:T_RED,true);
  GAME.surrenderOffer=null;
}
function declineSurrender(){GAME.surrenderOffer=null;GAME.announce('Surrender declined — play it out!',T_BLUE,true);}

/* ------------------------------ ability casting -------------------------- */
function castAbility(src,slot,targetPos){
  const ab=src.abilities[slot];
  if(!ab||ab.cdT>0)return false;
  if(src.mana<ab.cost)return false;
  if(src.isStunned||src.silenceT>0)return false;
  if(src.spellRanks[slot]<=0)return false;
  src.mana-=ab.cost;
  ab.cdT=ab.cd;
  const tx=targetPos?.x??src.x, ty=targetPos?.y??src.y;
  const ang=angleTo(src.x,src.y,tx,ty);
  src.facing=ang;
  const rank=src.spellRanks[slot];

  switch(ab.type){
    case 'targeted':{
      // find target unit
      let t=targetPos&&targetPos.x!==undefined&&targetPos._unit?targetPos._unit:null;
      if(!t){for(const u of units){if(u.alive&&u.team!==src.team&&dist(src.x,src.y,u.x,u.y)<ab.range&&(u instanceof Champion||u instanceof Minion)){t=u;break;}}}
      if(t){
        const dmg=ab.damage+src.ad*ab.ratio+src.ap*(ab.ap||0);
        if(ab.execute){
          const missing=t.maxhp-t.hp;
          t.takeDamage(dmg+missing*(0.2+0.05*rank),src,'true');
        } else {
          t.takeDamage(dmg,src,ab.ap>0?'magic':'physical');
          if(ab.silence)applyCC(t,'silence',ab.silence);
        }
        spawnParticles(t.x,t.y,src.champColor,12,'hit');
      }
      break;
    }
    case 'cone':{
      const count=ab.count||1;
      for(let i=0;i<count;i++){
        const a=ang+(i-(count-1)/2)*(ab.arc/count)*0.6;
        projectiles.push(new Projectile(src.x,src.y,src.team,{kind:'skillshot',speed:ab.speed||1000,range:ab.range,damage:ab.damage,ratio:ab.ratio,ap:ab.ap||0,dx:Math.cos(a),dy:Math.sin(a),color:src.champColor,r:7,width:60,src,slow:ab.slow||0,passThrough:true}));
      }
      break;
    }
    case 'skillshot':{
      projectiles.push(new Projectile(src.x,src.y,src.team,{kind:'skillshot',speed:ab.speed||1400,range:ab.range,damage:ab.damage,ratio:ab.ratio,ap:ab.ap||0,dx:Math.cos(ang),dy:Math.sin(ang),color:src.champColor,r:ab.r||10,width:ab.width||60,src,stun:ab.stun||0,root:ab.root||0,slow:ab.slow||0,passThrough:ab.passThrough??false,trueDmg:0}));
      break;
    }
    case 'aoe':{
      if(ab.delay){
        // delayed AoE (Lux E): schedule explosion
        const gid=GAME.id;setTimeout(()=>{if(GAME.id===gid&&state===STATES.PLAYING){aoeDamage(src,tx,ty,ab.r,ab.damage,ab.ratio,ab.ap,ab.slow);spawnParticles(tx,ty,'#f4d9ff',20,'hit');}},ab.delay*1000);
        spawnParticles(tx,ty,src.champColor,8,'marker');
      } else {
        aoeDamage(src,tx,ty,ab.r,ab.damage,ab.ratio,ab.ap,ab.slow);
        spawnParticles(tx,ty,src.champColor,24,'aoe');
        if(ab.summon==='tibbers')summonTibbers(src,tx,ty,ab);
      }
      break;
    }
    case 'dash':{
      // Alpha Strike: blink to target, hit N nearby
      const d=Math.max(1,dist(src.x,src.y,tx,ty));
      src.x=tx;src.y=ty;
      let hits=0;
      for(const u of units){
        if(u.alive&&u.team!==src.team&&hits<ab.hits&&dist(src.x,src.y,u.x,u.y)<400){
          u.takeDamage(ab.damage+src.ad*ab.ratio,src,'physical');hits++;
        }
      }
      spawnParticles(src.x,src.y,src.champColor,18,'dash');
      break;
    }
    case 'vision':{
      // reveal: mark an area and grant real temporary vision
      revealZones.push({x:tx,y:ty,r:1400,t:5});
      spawnParticles(tx,ty,'#dff6ff',26,'vision');
      break;
    }
    case 'self':{
      if(ab.speed)applyCC(src,'speed',0); // handled via msBoost
      if(ab.speed){src.msBoost=ab.speed;src.msBoostT=ab.silence||2;}
      if(ab.shield){src.shield=ab.shield+src.ap*(ab.ap||0);src.shieldT=3;}
      if(ab.armor){src.armorBonus=(src.armorBonus||0)+ab.armor;src.armorBonusT=3;}
      if(ab.trueDmg){src.trueDmg=ab.trueDmg+src.ad*(ab.ratio||0);src.trueDmgT=ab.dur||5;}
      if(ab.ms){src.msBoost=ab.ms;src.msBoostT=ab.dur||7;}
      if(ab.as){src.asBoostT=ab.dur||7;}
      if(ab.heal){src.hp=Math.min(src.maxhp,src.hp+ab.heal+src.ap*(ab.ap||0));}
      if(ab.dr){src.meditateT=ab.dur;src.meditateDR=ab.dr;}
      if(ab.reflect){src.reflect=ab.reflect;src.reflectT=3;}
      if(ab.damage){/* Garen Q strike on next attack via spin flag */}
      if(ab.allyShield){for(const u of units){if(u.team===src.team&&u instanceof Champion&&u!==src&&dist(src.x,src.y,u.x,u.y)<900){u.shield=ab.shield+src.ap*(ab.ap||0);u.shieldT=3;}}}
      if(ab.silence){src.nextQBonus=ab;}
      if(ab.damage&&slot==='Q'){/* Garen: bonus on next attack */}
      spawnParticles(src.x,src.y,src.champColor,14,'buff');
      break;
    }
  }
  return true;
}
function aoeDamage(src,x,y,r,dmg,ratio,ap,slow){
  for(const u of units){
    if(!u.alive||u.team===src.team)continue;
    if(dist(x,y,u.x,u.y)<r+u.r){
      u.takeDamage(dmg+src.ad*ratio+src.ap*(ap||0),src,ap>0?'magic':'physical');
      if(slow)applyCC(u,'slow',slow/100,2);
    }
  }
}
function summonTibbers(src,x,y,ab){
  const t=new Minion(x,y,src.team,'melee',null);
  t.r=30;t.maxhp=t.hp=1200+src.ap*0.5;t.ad=50+src.ap*0.15;t.ms=350;t.tibbers=true;t.name='Ember Warden';
  units.push(t);src.tibbers=t;
  spawnParticles(x,y,'#ff7a3d',30,'summon');
}

/* ------------------------------ minions / waves -------------------------- */
function spawnWave(){
  waveIndex++;
  const scale=(1+Math.floor(gameTime/90)*0.22)*(gameTime>1080?2.2:1);   // LoL: minions grow; super-late waves end stalemates
  const siege=waveIndex%3===0;
  for(const lane of ['top','mid','bot']){
    const path=LANES[lane].path;
    for(const team of [BLUE,RED]){
      const base=team===BLUE?{x:path[0].x,y:path[0].y}:{x:path[path.length-1].x,y:path[path.length-1].y};
      // super minions while the ENEMY inhibitor on this lane is down
      const enemyInhib=inhibitors.find(i=>i.lane===lane&&i.team===enemyTeam(team));
      const inhibsDown=inhibitors.filter(i2=>i2.team===enemyTeam(team)&&!i2.alive).length;
      const supers=enemyInhib&&!enemyInhib.alive?(1+Math.floor(inhibsDown/2)):0;   // scales: 1..3 supers/wave
      for(let i=0;i<3;i++){
        const m=new Minion(base.x+rand(-40,40),base.y+rand(-40,40),team,'melee',lane);
        m.pathIndex=team===BLUE?0:path.length-1;m.forward=team===BLUE?1:-1;
        m.maxhp=m.hp=Math.round(m.maxhp*scale);m.ad=Math.round(m.ad*scale);
        units.push(m);
      }
      for(let i=0;i<3;i++){
        const m=new Minion(base.x+rand(-40,40),base.y+rand(-40,40),team,'caster',lane);
        m.pathIndex=team===BLUE?0:path.length-1;m.forward=team===BLUE?1:-1;
        m.maxhp=m.hp=Math.round(m.maxhp*scale);m.ad=Math.round(m.ad*scale);
        units.push(m);
      }
      if(siege){
        const m=new Minion(base.x+rand(-40,40),base.y+rand(-40,40),team,'siege',lane);
        m.pathIndex=team===BLUE?0:path.length-1;m.forward=team===BLUE?1:-1;
        units.push(m);
      }
      for(let s2=0;s2<supers;s2++){
        const m=new Minion(base.x+rand(-40,40),base.y+rand(-40,40),team,'melee',lane);
        m.pathIndex=team===BLUE?0:path.length-1;m.forward=team===BLUE?1:-1;
        m.superMinion=true;m.r=17;m.maxhp=m.hp=1600;m.ad=190;m.armor=30;m.mr=30;m.ms=325;
        m.gold=60;m.xp=97;m.range=110;
        units.push(m);
      }
    }
  }
}

function minionThink(m,dt){
  if(!m.alive)return;
  if(m.tibbers){
    // follow & fight near summoner
    const owner=m.owner||null;
    let t=null;let bd=400;
    for(const u of units){if(u.alive&&u.team!==m.team&&dist(m.x,m.y,u.x,u.y)<bd&&(u instanceof Champion||u instanceof Minion)){bd=dist(m.x,m.y,u.x,u.y);t=u;}}
    if(t){if(dist(m.x,m.y,t.x,t.y)>m.range+t.r){moveToward(m,t.x,t.y,dt);}else{attack(m,t,dt);}}
    return;
  }
  // march along lane
  const path=LANES[m.lane].path;
  const idx=m.pathIndex;
  const cur=path[idx];
  // check for enemies in range (structures acquired from further so waves siege)
  let t=null;let bd=400;
  for(const u of units){
    if(u.alive&&u.team!==m.team&&!u.isMonster&&(u instanceof Minion||u instanceof Champion||u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus)){
      const d=dist(m.x,m.y,u.x,u.y);
      const acquire=(u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus)?560:400;
      if(d<acquire&&d<bd+160){bd=d;t=u;}
    }
  }
  if(t){if(bd>m.range+t.r){moveToward(m,t.x,t.y,dt);}else{attack(m,t,dt);}return;}
  // else continue along path
  const next=idx+m.forward;
  if(next>=0&&next<path.length){
    const p=path[next];
    moveToward(m,p.x,p.y,dt);
    if(dist(m.x,m.y,p.x,p.y)<20){m.pathIndex=next;}
  }else{
    // F1: end of lane -> assault the enemy nexus (LoL behavior; no more parking)
    const en=units.find(u=>u instanceof Nexus&&u.alive&&u.team!==m.team);
    if(en){
      if(dist(m.x,m.y,en.x,en.y)>m.range+en.r){moveToward(m,en.x,en.y,dt);}
      else{attack(m,en,dt);}
    }
  }
}
function moveToward(u,tx,ty,dt){
  const a=angleTo(u.x,u.y,tx,ty);
  const sp=u.effMS*dt;
  let nx=u.x+Math.cos(a)*sp, ny=u.y+Math.sin(a)*sp;
  const B=120;                       // playable margin inside the map wall
  nx=Math.max(B,Math.min(MAP-B,nx)); // clamp inside the field (fixes walking off the edge)
  ny=Math.max(B,Math.min(MAP-B,ny));
  u.x=nx;u.y=ny;u.facing=a;
}
function attack(u,target,dt){
  u.attackCd-=dt;
  if(u.attackCd<=0){
    u.attackCd=1/u.totalAS;
    // basic attack
    if(u.range>160){
      projectiles.push(new Projectile(u.x,u.y,u.team,{kind:'aa',speed:1600,range:u.range+100,damage:u.ad,target,color:'#ffe9a8',r:5,src:u}));
    } else {
      let dmg=u.ad;
      if(target instanceof Tower||target instanceof Inhibitor||target instanceof Nexus){if(u.type==='siege')dmg*=2;if(gameTime>900)dmg*=3;}   // siege bonus + late-game wave pressure (LoL endgame)
      if(u.trueDmg>0){target.takeDamage(dmg,u,'physical');target.takeDamage(u.trueDmg,u,'true');}
      else target.takeDamage(dmg,u,u.ap>0?'magic':'physical');
      if(u.aaCount!==undefined){u.aaCount++;if(u.key==='yi'&&u.aaCount%3===0){target.takeDamage(dmg,u,'physical');}}
      if(u.key==='ashe')applyCC(target,'slow',0.15,1.5);
      spawnParticles(target.x,target.y,'#ffd76b',4,'hit');
    }
  }
}

/* ------------------------------ towers think ----------------------------- */
function towerThink(t,dt){
  if(!t.alive)return;
  t.attackCd-=dt;
  // acquire target: nearest enemy minion, else champion if aggroed
  let target=null;let bd=1e9;let targetPrio=-1;
  for(const u of units){
    if(!u.alive||u.team===t.team)continue;
    if(!(u instanceof Minion||u instanceof Champion))continue;
    const d=dist(t.x,t.y,u.x,u.y);
    if(d<t.range+u.r){
      const prio=u instanceof Minion?0:1;
      if(target===null||prio<targetPrio||(prio===targetPrio&&d<bd)){
        // champion only targeted if it recently attacked or no minions
        if(u instanceof Minion){target=u;bd=d;targetPrio=0;}
        else if(findMinionNear(t)===null){target=u;bd=d;targetPrio=1;}
      }
    }
  }
  if(target){
    if(t.lastTarget!==target){t.dmgStack=1;t.lastTarget=target;}else{t.dmgStack=Math.min(4,t.dmgStack+0.1);}
    if(t.attackCd<=0){
      t.attackCd=1.0;
      const dmg=t.ad*(0.4+0.6*t.dmgStack);
      target.takeDamage(dmg,t,'physical');
      spawnParticles(target.x,target.y,'#ffb14d',5,'hit');
    }
  }
}
function findMinionNear(t){
  for(const u of units){if(u.alive&&u.team!==t.team&&u instanceof Minion&&dist(t.x,t.y,u.x,u.y)<t.range+u.r)return u;}
  return null;
}

  }
  if(state===STATES.END){
    if(e.key==='r'||e.key==='R'){     // rematch: back to champion select
      shopOpen=false;scoreboardOpen=false;
      state=STATES.MENU;
      player=null;units=[];projectiles=[];particles=[];announcements=[];
      GAME.ended=false;GAME.winner=-1;
    }
    return;
  }
  if(state===STATES.PLAYING&&player&&player.alive){
    if(e.key==='p'){shopOpen=!shopOpen;}
    if(e.key==='b'){player.recall();}
    if(e.key==='q'){tryCast('Q');}
    if(e.key==='w'){tryCast('W');}
    if(e.key==='e'){tryCast('E');}
    if(e.key==='r'){tryCast('R');}
    if(e.key==='d'){trySummoner('D');}
    if(e.key==='f'){trySummoner('F');}
    // learn abilities
    if(e.ctrlKey||e.metaKey){
      if(e.key==='q'){player.learn('Q');}
      if(e.key==='w'){player.learn('W');}
      if(e.key==='e'){player.learn('E');}
      if(e.key==='r'){player.learn('R');}
    }
  } else if(state===STATES.MENU){
    // handled by click
  }
});
function tryCast(slot){
  if(!player||!player.alive)return;
  const w=screenToWorld(mouse.x,mouse.y);
  const ab=player.abilities[slot];
  if(ab&&(ab.type==='skillshot'||ab.type==='cone'||ab.type==='aoe'||ab.type==='dash')){
    castAbility(player,slot,{x:w.x,y:w.y});
  } else if(ab&&ab.type==='self'){
    castAbility(player,slot,{x:player.x,y:player.y});
  } else if(ab&&ab.type==='targeted'){
    // find nearest enemy champion/minion near cursor
    let t=null;let bd=1e9;
    for(const u of units){if(u.alive&&u.team!==player.team&&(u instanceof Champion||u instanceof Minion)){const d=dist(w.x,w.y,u.x,u.y);if(d<120&&d<bd){bd=d;t=u;}}}
    if(!t){for(const u of units){if(u.alive&&u.team!==player.team&&(u instanceof Champion||u instanceof Minion)){const d=dist(player.x,player.y,u.x,u.y);if(d<ab.range&&d<bd){bd=d;t=u;}}}}
    if(t){t._unit=true;castAbility(player,slot,{x:t.x,y:t.y,_unit:t});}
  }
}
function trySummoner(slot){
  if(!player||!player.alive)return;
  const s=player.summoner[slot];
  if(s.cd>0)return;
  s.cd=s.max;
  if(slot==='D'){ // Flash
    const w=screenToWorld(mouse.x,mouse.y);
    const d=dist(player.x,player.y,w.x,w.y);
    if(d>1){
      const dd=Math.min(400,d);
      player.x+=(w.x-player.x)/d*dd;player.y+=(w.y-player.y)/d*dd;
      spawnParticles(player.x,player.y,'#dff6ff',14,'dash');
    }
  } else { // Heal
    player.hp=Math.min(player.maxhp,player.hp+150+10*player.level);
    spawnParticles(player.x,player.y,'#7dff9a',16,'heal');
  }
}
function handleRightClick(sx,sy){
  if(state!==STATES.PLAYING||!player||!player.alive)return;
  if(player.recalling){player.recalling=false;player.recallT=0;}   // moving cancels recall (LoL rule)
  const w=screenToWorld(sx,sy);
  // attack if clicked on enemy
  let clickedEnemy=null;
  for(const u of units){
    if(u.alive&&u.team!==player.team&&(u instanceof Champion||u instanceof Minion||u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus||u.isMonster)){
      if(dist(w.x,w.y,u.x,u.y)<u.r+14){clickedEnemy=u;break;}
    }
  }
  if(clickedEnemy){
    player.target=clickedEnemy;player.attacking=true;player.moveTarget=null;
  } else {
    {const B=140;player.moveTarget={x:Math.max(B,Math.min(MAP-B,w.x)),y:Math.max(B,Math.min(MAP-B,w.y))};player.target=null;player.attacking=false;}
  }
  player.moveOrder=w;
}
function handleLeftClick(sx,sy){
  if(state===STATES.MENU){
    selectChampionAt(sx,sy);
  } else if(state===STATES.PLAYING&&GAME&&GAME.surrenderOffer){
    const ph=170,py=H*0.30-ph/2,bw=190,bh=40,by2=py+84;
    const bx1=W/2-bw-12,bx2=W/2+12;
    if(sx>bx1&&sx<bx1+bw&&sy>by2&&sy<by2+bh){acceptSurrender();return;}
    if(sx>bx2&&sx<bx2+bw&&sy>by2&&sy<by2+bh){declineSurrender();return;}
  } else if(state===STATES.PLAYING&&shopOpen){
    buyAt(sx,sy);
  }
}

const champSlots=[];
let selectedChamp='ashe';
function layoutChampSlots(){
  champSlots.length=0;
  const n=CHAMP_KEYS.length;
  const cw=Math.min(220,W*0.16),gap=30,total=n*cw+(n-1)*gap;
  let x=(W-total)/2,y=H*0.40;
  CHAMP_KEYS.forEach((k,i)=>{
    champSlots.push({key:k,x:x+i*(cw+gap),y,cw,ch:cw*1.5});
  });
}
function selectChampionAt(sx,sy){
  for(const s of champSlots){
    if(sx>s.x&&sx<s.x+s.cw&&sy>s.y&&sy<s.y+s.ch){selectedChamp=s.key;startGame();return;}
  }
}
function startGame(){
  state=STATES.PLAYING;shopOpen=false;
  buildGame(selectedChamp);
}

/* ------------------------------ game build ------------------------------- */
function buildGame(champKey){
  units=[];projectiles=[];particles=[];announcements=[];revealZones=[];
  jungleCamps.forEach(c=>{c.alive=true;c.respawn=0;});   // fresh jungle each game
  kills[0]=0;kills[1]=0;towers[0]=0;towers[1]=0;firstBlood=false;
  gameTime=0;waveTimer=12;waveIndex=0;nexusAlive=[true,true];
  goldDelta=0;
  // rebuild structures (fresh)
  towerList.length=0;inhibitors.length=0;nexusList.length=0;
  buildStructures();
  // player
  const bp={x:2000,y:12820};
  player=new Champion(champKey,BLUE,bp.x,bp.y,true);
  player.moveTarget={x:bp.x,y:bp.y};player.attacking=false;
  units.push(player);
  // allies (4 bots) + enemies (5 bots)
  const allyKeys=CHAMP_KEYS.filter(k=>k!==champKey);
  for(let i=0;i<4;i++){
    const k=allyKeys[i%allyKeys.length];
    const b=new Champion(k,BLUE,bp.x+rand(-250,250),bp.y+rand(-250,250),false);
    b.moveTarget={x:bp.x,y:bp.y};
    units.push(b);
  }
  const rp={x:12820,y:2000};
  for(let i=0;i<5;i++){
    const k=CHAMP_KEYS[randi(0,CHAMP_KEYS.length-1)];
    const b=new Champion(k,RED,rp.x+rand(-250,250),rp.y+rand(-250,250),false);
    b.moveTarget={x:rp.x,y:rp.y};
    units.push(b);
  }
  // nexus
  {const n1=new Nexus(2000,12820,BLUE);units.push(n1);nexusList.push(n1);
   const n2=new Nexus(12820,2000,RED);units.push(n2);nexusList.push(n2);}
  // towers + inhibitors into units
  towerList.forEach(t=>units.push(t));
  inhibitors.forEach(i=>units.push(i));
  // jungle monsters
  jungleCamps.forEach(c=>{
    if(c.alive)units.push(makeMonster(c));
  });
  cam.x=player.x;cam.y=player.y;cam.zoom=cam.targetZoom=0.6;
  GAME.id=(GAME.id||0)+1;
  GAME.started=true;GAME.ended=false;GAME.winner=-1;
  GAME.announce('Welcome to the arena — defeat the enemy core!','#8fffa0',true);
}
function buildStructures(){
  /* R40: idempotent — clear before re-append (double-init doubled towers) */
  towerList.length=0;inhibitors.length=0;nexusList.length=0;
  // rebuild towers + inhibitors (map geometry already exists)
  const towerSet=[
    {lane:'top',side:BLUE,t:0.16},{lane:'top',side:BLUE,t:0.32},{lane:'top',side:BLUE,t:0.48},
    {lane:'top',side:RED,t:0.52},{lane:'top',side:RED,t:0.68},{lane:'top',side:RED,t:0.84},
    {lane:'mid',side:BLUE,t:0.14},{lane:'mid',side:BLUE,t:0.30},{lane:'mid',side:BLUE,t:0.46},
    {lane:'mid',side:RED,t:0.54},{lane:'mid',side:RED,t:0.70},{lane:'mid',side:RED,t:0.86},
    {lane:'bot',side:BLUE,t:0.16},{lane:'bot',side:BLUE,t:0.32},{lane:'bot',side:BLUE,t:0.48},
    {lane:'bot',side:RED,t:0.52},{lane:'bot',side:RED,t:0.68},{lane:'bot',side:RED,t:0.84},
  ];
  towerSet.forEach((ts,i)=>{
    const p=LANES[ts.lane].path[Math.floor(ts.t*(LANES[ts.lane].path.length-1))];
    const sideIdx=i%6;                       // 0,1,2 blue ; 3,4,5 red within each lane
    const rank=sideIdx<3?sideIdx:5-sideIdx;  // blue 0,1,2 ; red 2,1,0 (outer=0, inner=1, inhib=2)
    towerList.push(makeTower(p.x,p.y,ts.side,rank));
  });
  const inhibSet=[
    {lane:'top',side:BLUE,t:0.075},{lane:'mid',side:BLUE,t:0.06},{lane:'bot',side:BLUE,t:0.075},
    {lane:'top',side:RED,t:0.925},{lane:'mid',side:RED,t:0.94},{lane:'bot',side:RED,t:0.925},
  ];
  inhibSet.forEach(ib=>{
    const p=LANES[ib.lane].path[Math.floor(ib.t*(LANES[ib.lane].path.length-1))];
    inhibitors.push(new Inhibitor(p.x,p.y,ib.side,ib.lane));
  });
  const nexusPos=[{x:2000,y:12820,team:BLUE},{x:12820,y:2000,team:RED}];
  nexusPos.forEach(n=>{towerList.push(makeTower(n.x-120,n.y-120,n.team,3));towerList.push(makeTower(n.x+120,n.y+120,n.team,3));});
}
function makeMonster(c){
  const m=new Unit(c.x,c.y,-1);   // neutral: hostile to BOTH teams (LoL jungle)
  m.isMonster=true;m.type=c.type;m.camp=c;
  m.r=28;m.ms=0;m.range=140;m.ad=40;m.armor=10;m.mr=10;
  m.maxhp=m.hp=1200;m.attackCd=0;m.as=0.7;m.leash=500;
  m.gold=80;m.xp=120;m.respawn=60;
  m.die=function(killer){
    if(!this.alive)return;
    this.alive=false;this.dead=true;
    this.camp.alive=false;this.camp.respawn=60;   // schedule camp respawn
    if(killer&&killer.team!==this.team&&killer instanceof Champion){
      killer.gold+=this.gold;killer.grantXP(this.xp);
      if(killer.isPlayer)spawnFloatingText(this.x,this.y,'+'+this.gold+'g','#ffd76b');
      // jungle buff: blue buff = CDR feel (faster cooldowns), red buff = burn on hit
      if(this.type==='blueBuff'){for(const s in killer.abilities)killer.abilities[s].cdT=0;}
    }
    spawnParticles(this.x,this.y,'#c08a5a',12,'death');
  };
  return m;
}

/* ------------------------------ update loop ------------------------------ */
let lastTime=performance.now();
function update(dt){
  if(state===STATES.PLAYING){
    gameTime+=dt;
    // smooth camera
    cam.zoom=lerp(cam.zoom,cam.targetZoom,dt*6);
    if(player&&player.alive){
      cam.x=lerp(cam.x,player.x,dt*8);cam.y=lerp(cam.y,player.y,dt*8);
    } else if(player){
      // dead: keep camera
    }

    // minion waves
    waveTimer-=dt;
    if(waveTimer<=0){spawnWave();waveTimer=30;}

    // player movement & attacking
    if(player&&player.alive){
      player.respawnT=0;
      tickCC(player,dt);
      for(const slot in player.abilities)if(player.abilities[slot].cdT>0)player.abilities[slot].cdT-=dt;
      if(player.summoner.D.cd>0)player.summoner.D.cd-=dt;
      if(player.summoner.F.cd>0)player.summoner.F.cd-=dt;
      if(player.recalling){
        player.recallT-=dt;
        if(player.recallT<=0){
          player.recalling=false;
          const b={x:2000,y:12820};
          player.x=b.x;player.y=b.y;player.hp=player.maxhp;player.mana=player.maxmana;
          spawnParticles(player.x,player.y,T_BLUE,24,'recall');
        }
      } else {
        if(player.target&&player.target.alive){
          const d=dist(player.x,player.y,player.target.x,player.target.y);
          if(d>player.range+player.target.r-8){
            moveToward(player,player.target.x,player.target.y,dt);
          } else {
            attack(player,player.target,dt);
          }
        } else if(player.moveTarget){
          const d=dist(player.x,player.y,player.moveTarget.x,player.moveTarget.y);
          if(d>12){moveToward(player,player.moveTarget.x,player.moveTarget.y,dt);}else{player.moveTarget=null;}
          player.target=null;
        }
        // auto-acquire target if attacking clicked area
        if(player.target&&!player.target.alive){player.target=null;player.attacking=false;}
      }
      // regen
      player.lastCombat=player.lastCombat||0;
      player.hp=Math.min(player.maxhp,player.hp+player.hpr*dt);
      player.mana=Math.min(player.maxmana,player.mana+player.mpr*dt);
      // passive gold trickle (LoL-style ~20 gold / 10s)
      player.goldAcc=(player.goldAcc||0)+dt*2;
      while(player.goldAcc>=1){player.gold=(player.gold||0)+1;player.goldAcc-=1;}
      if(player.hp<=0&&player.alive)player.die(null);
    } else if(player&&!player.alive){
      player.respawnTick(dt);
      if(player.alive&&player.isPlayer){cam.x=player.x;cam.y=player.y;}
    }

    // bots
    for(const u of units){
      if(u instanceof Champion&&!u.isPlayer){
        if(!u.alive){u.respawnTick(dt);continue;}   // dead bots respawn like the player
        botThink(u,dt);
        tickCC(u,dt);
        for(const slot in u.abilities)if(u.abilities[slot].cdT>0)u.abilities[slot].cdT-=dt;
        if(u.recalling){u.recallT-=dt;if(u.recallT<=0){u.recalling=false;const b=u.team===BLUE?{x:2000,y:12820}:{x:12820,y:2000};u.x=b.x;u.y=b.y;u.hp=u.maxhp;u.mana=u.maxmana;}}
        // act on moveTarget / target
        if(u.target&&u.target.alive){
          const d=dist(u.x,u.y,u.target.x,u.target.y);
          if(d>u.range+u.target.r-8)moveToward(u,u.target.x,u.target.y,dt);
          else attack(u,u.target,dt);
        } else if(u.moveTarget){if(dist(u.x,u.y,u.moveTarget.x,u.moveTarget.y)>12)moveToward(u,u.moveTarget.x,u.moveTarget.y,dt);else u.moveTarget=null;}
        u.hp=Math.min(u.maxhp,u.hp+u.hpr*dt);
        u.mana=Math.min(u.maxmana,u.mana+u.mpr*dt);
        if(u.hp<=0&&u.alive)u.die(null);
      }
    }

    // minions & monsters
    for(const u of units){
      if(u instanceof Minion&&u.alive)minionThink(u,dt);
      if(u.isMonster&&u.alive){
        // leash / attack nearby enemies (prefer champions; return home when dragged)
        const home=u.camp;
        let t=null;let bd=u.leash;
        for(const e of units){if(e.alive&&e.team!==u.team&&e instanceof Champion){const d=dist(u.x,u.y,e.x,e.y);if(d<bd){bd=d;t=e;}}}
        if(!t){for(const e of units){if(e.alive&&e.team!==u.team&&e instanceof Minion){const d=dist(u.x,u.y,e.x,e.y);if(d<bd){bd=d;t=e;}}}}
        const far=dist(u.x,u.y,home.x,home.y)>u.leash*1.6;
        if(far){moveToward(u,home.x,home.y,dt);}                       // dragged too far: walk home
        else if(t){if(dist(u.x,u.y,t.x,t.y)>u.range+t.r)moveToward(u,t.x,t.y,dt);else attack(u,t,dt);}
        u.attackCd-=dt;
      }
      if(u instanceof Tower&&u.alive)towerThink(u,dt);
    }

    // projectiles
    for(const p of projectiles)p.update(dt);
    projectiles=projectiles.filter(p=>!p.dead);

    // particles
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    particles=particles.filter(p=>p.life>0);

    // announcements
    for(const a of announcements)a.t+=dt;
    announcements=announcements.filter(a=>a.t<a.dur);

    // temporary vision zones
    for(const z of revealZones)z.t-=dt;
    revealZones=revealZones.filter(z=>z.t>0);

    // win condition FIRST (dead nexus is removed by cleanup below, so check before it)
    for(const u of units){
      if(u instanceof Nexus&&!u.alive){
        nexusAlive[u.team]=false;
        if(u.team===BLUE){GAME.ended=true;GAME.winner=RED;}
        else{GAME.ended=true;GAME.winner=BLUE;}
      }
    }
    // LoL surrender rule: from 15:00 a team hopelessly behind (kill+structure deficit) concedes
    if(!GAME.ended&&gameTime>=900){
      const kd=kills[BLUE]-kills[RED];
      const td=towers[BLUE]-towers[RED];   // structures destroyed by each side
      const late=gameTime>=1200;
      const blueWins=(kd>=10&&td>=5)||(late&&(kd>=8&&td>=4));
      const redWins=(kd<=-10&&td<=-5)||(late&&(kd<=-8&&td<=-4));
      if(blueWins||redWins){
        if(!GAME.surrenderOffer){GAME.surrenderOffer={by:redWins?RED:BLUE,at:gameTime,expires:gameTime+45};}
        if(GAME.surrenderOffer&&gameTime>GAME.surrenderOffer.expires){GAME.surrenderOffer=null;}
      }
    }
    if(GAME.ended&&state===STATES.PLAYING){
      state=STATES.END;
      GAME.announce(GAME.winner===BLUE?'VICTORY':'DEFEAT',GAME.winner===BLUE?T_BLUE:T_RED,true);
    }

    // inhibitor respawn (5 min down, then revives)
    for(const i of inhibitors){
      if(!i.alive){
        i.respawnT-=dt;
        if(i.respawnT<=0){
          i.alive=true;i.dead=false;i.hp=i.maxhp;
          GAME.announce((i.team===BLUE?'Blue':'Red')+' inhibitor restored',i.team===BLUE?T_BLUE:T_RED);
          spawnParticles(i.x,i.y,i.team===BLUE?T_BLUE:T_RED,16,'spawn');
        }
      }
    }

    // dead cleanup (keep corpses gone; champions + inhibitors persist for respawn)
    units=units.filter(u=>u.alive||u instanceof Champion||u instanceof Inhibitor);

    // jungle respawn
    jungleCamps.forEach(c=>{if(!c.alive){c.respawn-=dt;if(c.respawn<=0){c.alive=true;units.push(makeMonster(c));}}});
  }
}

// ground: big textured plane (procedural canvas texture)
function groundTexture(){
  const S=2048;
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#26391c';g.fillRect(0,0,S,S);
  // layered meadow: broad tonal patches (two hues)
  for(let i=0;i<3200;i++){
    const x=Math.random()*S,y=Math.random()*S,r=6+Math.random()*46;
    const hue=Math.random();
    g.fillStyle=hue<0.45?'rgba(48,70,36,0.30)':(hue<0.8?'rgba(32,52,26,0.30)':'rgba(58,78,40,0.22)');
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  // grass tufts (short strokes, lighter tips)
  for(let i=0;i<26000;i++){
    const x=Math.random()*S,y=Math.random()*S,l=3+Math.random()*7,a=(Math.random()-0.5)*0.9;
    const dk=Math.random()<0.5;
    g.strokeStyle=dk?'rgba(38,60,28,0.5)':'rgba(84,110,56,0.5)';
    g.lineWidth=1.4;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(a)*l,y-Math.cos(a)*l);g.stroke();
  }
  // dirt patches + pebbles (mostly off-lane, everywhere lightly)
  for(let i=0;i<900;i++){
    const x=Math.random()*S,y=Math.random()*S,r=4+Math.random()*16;
    g.fillStyle='rgba(92,76,52,0.20)';
    g.beginPath();g.ellipse(x,y,r,r*0.6,Math.random()*3.14,0,Math.PI*2);g.fill();
  }
  for(let i=0;i<2600;i++){
    const x=Math.random()*S,y=Math.random()*S,r=1+Math.random()*3;
    g.fillStyle=Math.random()<0.5?'rgba(140,132,116,0.5)':'rgba(96,90,78,0.5)';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  // paths: layered roads (shoulder, gravel body, flagstone core, worn track, stone edging)
  const SC=v=>v/1024*S;
  for(const lane of ['top','mid','bot']){
    const pts=LANES[lane].path;
    const trace=()=>{g.beginPath();pts.forEach((p,i)=>{const X=SC(p.x/MAPW*1024),Y=SC(p.y/MAPW*1024);i?g.lineTo(X,Y):g.moveTo(X,Y);});};
    g.lineCap='round';g.lineJoin='round';
    trace();g.strokeStyle='rgba(56,48,30,0.95)';g.lineWidth=SC(52);g.stroke();  // dark shoulder
    trace();g.strokeStyle='rgba(128,108,72,0.97)';g.lineWidth=SC(42);g.stroke();// gravel body
    // gravel speckle inside the road band
    g.save();
    trace();g.lineWidth=SC(42);g.strokeStyle='rgba(0,0,0,0)';g.stroke();
    g.restore();
    trace();g.strokeStyle='rgba(156,136,94,0.9)';g.lineWidth=SC(28);g.stroke(); // flagstone core
    // flagstone joints: dashed overlay
    g.save();
    trace();g.setLineDash([SC(9),SC(7)]);g.lineWidth=SC(28);g.strokeStyle='rgba(104,88,58,0.45)';g.stroke();
    g.setLineDash([]);
    g.restore();
    trace();g.strokeStyle='rgba(186,168,126,0.55)';g.lineWidth=SC(8);g.stroke(); // worn track
    // stone edging lines
    g.save();
    trace();g.lineWidth=SC(46);g.strokeStyle='rgba(0,0,0,0)';g.stroke();
    g.restore();
  }
  // road gravel speckle (dense, on-lane): draw many dots along lane paths
  for(const lane of ['top','mid','bot']){
    const pts=LANES[lane].path;
    for(let i=0;i<pts.length-1;i++){
      for(let k=0;k<130;k++){
        const t2=Math.random();
        const px=pts[i].x+(pts[i+1].x-pts[i].x)*t2, py=pts[i].y+(pts[i+1].y-pts[i].y)*t2;
        const off=(Math.random()-0.5)*SC(38);
        const nx=-(pts[i+1].y-pts[i].y),ny=(pts[i+1].x-pts[i].x);
        const nl=Math.hypot(nx,ny)||1;
        const X=SC(px/MAPW*1024)+nx/nl*off, Y=SC(py/MAPW*1024)+ny/nl*off;
        g.fillStyle=Math.random()<0.5?'rgba(150,132,100,0.5)':'rgba(96,82,58,0.5)';
        g.fillRect(X,Y,1.6,1.6);
      }
    }
  }
  // river with banks, water, flow, sparkle
  const riv=()=>{g.beginPath();g.moveTo(S*0.98,S*0.60);g.quadraticCurveTo(S*0.52,S*0.48,S*0.60,S*0.02);g.moveTo(S*0.98,S*0.60);g.quadraticCurveTo(S*0.48,S*0.52,S*0.02,S*0.40);};
  g.lineCap='round';
  riv();g.strokeStyle='rgba(36,60,46,0.9)';g.lineWidth=SC(106);g.stroke();    // banks
  riv();g.strokeStyle='rgba(44,94,118,0.85)';g.lineWidth=SC(88);g.stroke();   // water
  riv();g.strokeStyle='rgba(88,148,180,0.5)';g.lineWidth=SC(48);g.stroke();   // flow
  // flow streaks
  for(let i=0;i<420;i++){
    const t2=Math.random();
    const cx=S*(0.98-0.5*t2), cy=S*(0.60-0.36*t2);
    g.strokeStyle='rgba(160,215,235,0.28)';g.lineWidth=SC(1.2);
    g.beginPath();g.moveTo(cx,cy);g.lineTo(cx-SC(8),cy-SC(6));g.stroke();
  }
  riv();g.strokeStyle='rgba(150,210,230,0.22)';g.lineWidth=SC(14);g.stroke(); // sparkle
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=8;
  return t;
}
const groundTex=groundTexture();
groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;
groundTex.repeat.set(3,3);   // tile 3x3: road lanes are re-traced per tile is NOT wanted —
                             // roads must map 1:1, so undo repeat for correctness:
groundTex.repeat.set(1,1);
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(MAPW,MAPW,96,96),
  new THREE.MeshStandardMaterial({map:groundTex,roughness:0.93,metalness:0})
);
// gentle terrain relief: raise vertices slightly off-lane for a rolling field
{
  const pos=ground.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i)+MAPW/2, y=pos.getY(i)+MAPW/2;
    let h=0;
    h+=Math.sin(x*0.0009)*Math.cos(y*0.0011)*26;   // broad rolls
    h+=Math.sin(x*0.0031+1.7)*Math.sin(y*0.0027)*12;
    h*=0.35;                                        // keep lanes near-flat enough to read
    pos.setZ(i,h);
  }
  pos.needsUpdate=true;
  ground.geometry.computeVertexNormals();
}
ground.rotation.x=-Math.PI/2;
ground.position.set(MAPW/2,0,MAPW/2);
ground.receiveShadow=true;
world.add(ground);

// outer wall: stacked weathered stone blocks (jittered rows), same footprint
{
  const stoneM=new THREE.MeshStandardMaterial({color:0x3d4a3a,roughness:0.95});
  const stoneM2=new THREE.MeshStandardMaterial({color:0x33402f,roughness:0.95});
  const seg=48,rows=4,wallH=240;
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
    const r=MAPW*0.72;
    const x0=Math.cos(a0)*r,z0=Math.sin(a0)*r;
    const x1=Math.cos(a1)*r,z1=Math.sin(a1)*r;
    const len=Math.hypot(x1-x0,z1-z0);
    for(let row=0;row<rows;row++){
      const bh=wallH/rows;
      const jitter=(Math.random()-0.5)*0.35*len/rows;
      const w=new THREE.Mesh(new THREE.BoxGeometry(len/rows-6+Math.random()*10,bh*0.96,80+Math.random()*24),row%2?stoneM:stoneM2);
      const t0=0.5+jitter/len;
      const cx=x0+(x1-x0)*((row%2?0.25:0.6)),cz=z0+(z1-z0)*((row%2?0.25:0.6));
      w.position.set(cx+MAPW/2+Math.cos((a0+a1)/2)*(Math.random()*8-4),bh*row+bh/2,cz+MAPW/2+Math.sin((a0+a1)/2)*(Math.random()*8-4));
      w.rotation.y=-Math.atan2(z1-z0,x1-x0)+(Math.random()-0.5)*0.02;
      w.castShadow=false;w.receiveShadow=true;
      world.add(w);
    }
  }
}

// river glow strip (3D water)
{

}

// jungle trees: layered canopies (3 blobs) + trunks with a branch fork — instanced
{
  const trunkG=new THREE.CylinderGeometry(9,16,86,6);
  const branchG=new THREE.CylinderGeometry(4,6,44,5);
  const blobG=new THREE.SphereGeometry(1,10,8);           // unit blob, scaled per layer
  const trunkM=new THREE.MeshStandardMaterial({color:0x4a3626,roughness:1});
  const leafM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.95});
  const N=340;
  const trunks=new THREE.InstancedMesh(trunkG,trunkM,N);
  const branches=new THREE.InstancedMesh(branchG,trunkM,N*2);
  const canopies=new THREE.InstancedMesh(blobG,leafM,N*3);
  canopies.castShadow=true;trunks.castShadow=true;
  const dummy=new THREE.Object3D();const leafCol=new THREE.Color();
  let placed=0,guard=0,bc=0,cc=0;
  while(placed<N&&guard++<8000){
    const x=rand(600,MAPW-600),y=rand(600,MAPW-600);
    if(distToLanes(x,y)<380)continue;
    if(Math.hypot(x-MAPW/2,y-MAPW/2)<1500)continue;
    let nearBase=false;
    for(const b of [{x:2000,y:12820},{x:12820,y:2000}]) if(Math.hypot(x-b.x,y-b.y)<2200) nearBase=true;
    if(nearBase)continue;
    const s=0.7+Math.random()*0.9;
    const rot=Math.random()*6.28;
    dummy.position.set(x,43*s,y);dummy.scale.setScalar(s);dummy.rotation.set(0,rot,0);dummy.updateMatrix();
    trunks.setMatrixAt(placed,dummy.matrix);
    // two branches
    for(let b2=0;b2<2;b2++){
      const a=rot+b2*Math.PI+0.5;
      dummy.position.set(x+Math.cos(a)*26*s,(60+b2*16)*s,y+Math.sin(a)*26*s);
      dummy.scale.setScalar(s*(0.8+b2*0.2));
      dummy.rotation.set(0,-a,0.9);dummy.updateMatrix();
      branches.setMatrixAt(bc++,dummy.matrix);
    }
    // three-layer canopy with color jitter (deep->light)
    const layers=[[0,150,52,0.8],[0,196,58,1.0],[0,238,60,0.7]];
    for(let l=0;l<3;l++){
      const L=layers[l];
      dummy.position.set(x+(l-1)*10*s,(L[1]-4+l*6)*s,y+(l%2?12:-10)*s);
      dummy.scale.set(L[2]*s,L[2]*0.72*s,L[2]*s);
      dummy.rotation.set(0,rot+l,0);dummy.updateMatrix();
      canopies.setMatrixAt(cc,dummy.matrix);
      // green jitter per canopy blob (instance color)
      leafCol.setHSL(0.29+Math.random()*0.05,0.52+Math.random()*0.15,0.20+l*0.05+Math.random()*0.04);
      canopies.setColorAt(cc,leafCol);
      cc++;
    }
    placed++;
  }
  trunks.count=placed;branches.count=bc;canopies.count=cc;
  if(canopies.instanceColor)canopies.instanceColor.needsUpdate=true;
  world.add(trunks);world.add(branches);world.add(canopies);
}

// ---- brush zones (LoL-style grass): landmarks by lanes/river ----
{
  const brushDef=[
    [6300,6600,300],[8500,8200,300],
    [5400,8600,260],[8800,6200,260],[4200,10000,260],[10600,4800,260],
    [3000,10800,260],[5600,9600,260],[9200,8400,260],[11400,6200,260],
    [6200,11200,260],[8400,9200,260],[9600,5600,260],[10800,3400,260],
    [3400,11800,240],[11400,3000,240],
  ];
  const tuftG=new THREE.ConeGeometry(1,1,5);
  const brushM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});
  const per=26, N=brushDef.length*per;
  const tufts=new THREE.InstancedMesh(tuftG,brushM,N);
  const dummy=new THREE.Object3D();
  const bc=new THREE.Color();
  let k=0;
  for(const [bx,by,br] of brushDef){
    for(let i=0;i<per;i++){
      const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*br;
      const x=bx+Math.cos(a)*r, y=by+Math.sin(a)*r*0.8;
      const hgt=46+Math.random()*36, wdt=10+Math.random()*8;
      dummy.position.set(x,hgt*0.4,y);
      dummy.scale.set(wdt,hgt,wdt);
      dummy.rotation.set((Math.random()-0.5)*0.25,Math.random()*6.28,(Math.random()-0.5)*0.25);
      dummy.updateMatrix();
      if(k<N){tufts.setMatrixAt(k,dummy.matrix);
        bc.setHSL(0.27+Math.random()*0.04,0.55,0.24+Math.random()*0.08);
        tufts.setColorAt(k,bc);k++;}
    }
  }
  tufts.count=k;
  if(tufts.instanceColor)tufts.instanceColor.needsUpdate=true;
  tufts.castShadow=true;
  world.add(tufts);
  const discG=new THREE.CircleGeometry(1,18);
  const discM=new THREE.MeshBasicMaterial({color:0x365f26,transparent:true,opacity:0.45,side:THREE.DoubleSide});
  for(const [bx,by,br] of brushDef){
    const d=new THREE.Mesh(discG,discM);
    d.rotation.x=-Math.PI/2;d.position.set(bx,0.9,by);d.scale.setScalar(br*1.1);
    world.add(d);
  }
}

const champMats={};
function champMat(color){
  if(!champMats[color])champMats[color]=new THREE.MeshStandardMaterial({color,roughness:0.55,metalness:0.15});
  return champMats[color];
}
// A champion: articulated body — torso, head, arms, legs, weapon, team ring, portrait disc
function buildChampionMesh(u){
  const g=new THREE.Group();
  const col=new THREE.Color(u.champColor||'#8ab4ff');
  const teamCol=u.team===BLUE?0x2f7fe0:0xd0453a;
  // legs
  const S3=1.6; g.scale.setScalar(S3);
  const legG=new THREE.CapsuleGeometry(9,34,3,8);
  const legM=new THREE.MeshStandardMaterial({color:0x2a3040,roughness:0.8});
  const legL=new THREE.Mesh(legG,legM);legL.position.set(-11,28,0);
  const legR=new THREE.Mesh(legG,legM);legR.position.set(11,28,0);
  legL.castShadow=legR.castShadow=true;
  g.add(legL,legR);
  // torso
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(17,26,4,10),champMat(col.getHex()));
  torso.position.y=72;torso.castShadow=true;g.add(torso);
  // cape (strong team color)
  const cape=new THREE.Mesh(new THREE.BoxGeometry(26,52,4),
    new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:0.25,roughness:0.9,side:THREE.DoubleSide}));
  cape.position.set(0,74,-16);cape.castShadow=true;g.add(cape);
  // chest emblem (team glow dot)
  const emblem=new THREE.Mesh(new THREE.SphereGeometry(4.5,8,8),
    new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:1.2}));
  emblem.position.set(0,80,15);g.add(emblem);
  // head
  const head=new THREE.Mesh(new THREE.SphereGeometry(12,14,12),
    new THREE.MeshStandardMaterial({color:0xf2c9a0,roughness:0.6}));
  head.position.y=104;head.castShadow=true;g.add(head);
  // hair/hood tint by champ color
  const hood=new THREE.Mesh(new THREE.SphereGeometry(13,14,10,0,Math.PI*2,0,Math.PI*0.55),champMat(col.getHex()));
  hood.position.y=105;g.add(hood);
  // helmet: dome + nose guard + visor slit (dark)
  const helmM=new THREE.MeshStandardMaterial({color:0x8a95a8,metalness:0.65,roughness:0.35});
  const helm=new THREE.Mesh(new THREE.SphereGeometry(13.2,14,10,0,Math.PI*2,0,Math.PI*0.42),helmM);
  helm.position.y=106;helm.rotation.x=-0.16;g.add(helm);
  const nose=new THREE.Mesh(new THREE.BoxGeometry(3.4,10,2.6),helmM);
  nose.position.set(0,104,11.4);g.add(nose);
  const visor=new THREE.Mesh(new THREE.BoxGeometry(15,2.6,2),
    new THREE.MeshStandardMaterial({color:0x0a0d14,roughness:0.4}));
  visor.position.set(0,105.4,11.8);g.add(visor);
  // pauldrons on both shoulders
  const paulG=new THREE.SphereGeometry(9,10,8,0,Math.PI*2,0,Math.PI*0.55);
  const paulM=new THREE.MeshStandardMaterial({color:teamCol,metalness:0.4,roughness:0.5});
  const paulL=new THREE.Mesh(paulG,paulM);paulL.position.set(-24,86,0);paulL.rotation.z=0.5;
  const paulR=new THREE.Mesh(paulG,paulM);paulR.position.set(24,86,0);paulR.rotation.z=-0.5;
  paulL.castShadow=paulR.castShadow=true;g.add(paulL,paulR);
  // belt + chest strap
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(17.5,17.5,6,12),
    new THREE.MeshStandardMaterial({color:0x4a3826,roughness:0.9}));
  belt.position.y=64;g.add(belt);
  const strap=new THREE.Mesh(new THREE.BoxGeometry(6,34,3),
    new THREE.MeshStandardMaterial({color:0x4a3826,roughness:0.9}));
  strap.position.set(6,80,15);strap.rotation.z=0.32;g.add(strap);

  const armG=new THREE.CapsuleGeometry(6.5,26,3,8);
  const armL=new THREE.Mesh(armG,champMat(col.getHex()));armL.position.set(-24,74,0);

    blade.position.y=32;
    const hilt=new THREE.Mesh(new THREE.CylinderGeometry(3,3,16,8),
      new THREE.MeshStandardMaterial({color:0x333,metalness:0.8}));
    weapon.add(blade,hilt);
  }
  weapon.position.set(24,76,8);
  weapon.rotation.z=-0.35;
  weapon.castShadow=true;
  g.add(weapon);
  // team ring on ground
  const ring=new THREE.Mesh(new THREE.RingGeometry(32,44,36),
    new THREE.MeshBasicMaterial({color:teamCol,transparent:true,opacity:0.85,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.6;g.add(ring);
  // facing arrow (small cone)
  const arrow=new THREE.Mesh(new THREE.ConeGeometry(7,16,4),
    new THREE.MeshBasicMaterial({color:0xffffff}));
  arrow.rotation.x=Math.PI/2;arrow.position.set(0,1.4,46);g.add(arrow);
  // player marker
  if(u.isPlayer){
    const sel=new THREE.Mesh(new THREE.RingGeometry(40,46,32),
      new THREE.MeshBasicMaterial({color:0xffd76b,transparent:true,opacity:0.9,side:THREE.DoubleSide}));
    sel.rotation.x=-Math.PI/2;sel.position.y=0.7;g.add(sel);
  }
  g.userData={legL,legR,armL,armR,torso,head,weapon,cape,ring,arrow,phase:Math.random()*10,baseY:0};
  return g;
}

function buildMinionMesh(u){
  const g=new THREE.Group();
  g.scale.setScalar(1.5);
  const teamCol=u.team===BLUE?0x4a9fe8:0xe8503a;

const projMeshes=new Map();   // projectile -> mesh
const partMeshes=[];          // {mesh,vel,life}
const partGeo=new THREE.SphereGeometry(5,6,6);

function syncProjectiles(){
  const seen=new Set();
  for(const p of projectiles){
    seen.add(p);
    let m=projMeshes.get(p);
    if(!m){
      const col=new THREE.Color(p.color||'#ffe9a8');
      m=new THREE.Mesh(partGeo,new THREE.MeshBasicMaterial({color:col.getHex(),transparent:true,opacity:0.95}));
      m.scale.setScalar(p.kind==='skillshot'?1.5:0.8);
      projMeshes.set(p,m);scene.add(m);
    }
    m.position.set(p.x,55,p.y);
  }
  for(const [p,m] of projMeshes){
    if(!seen.has(p)){scene.remove(m);projMeshes.delete(p);}
  }
}

function syncParticles(dt){
  // spawn meshes for new particles (cap for perf)
  const cap=Math.min(particles.length,180);
  for(let i=0;i<cap;i++){
    const pt=particles[i];
    if(pt._m)continue;
    const col=new THREE.Color(pt.color||'#fff');
    const m=new THREE.Mesh(partGeo,new THREE.MeshBasicMaterial({color:col.getHex(),transparent:true,opacity:0.85}));
    m.position.set(pt.x,40+Math.random()*40,pt.y);
    pt._m=m;scene.add(m);
  }
  for(const pt of particles){
    if(pt._m){
      pt._m.position.x+=pt.vx*dt;pt._m.position.z+=pt.vy*dt;
      pt._m.position.y+=60*dt;
      pt._m.material.opacity=Math.max(0,pt.life);
      if(pt.life<=0||!pt._m.parent){if(pt._m.parent)scene.remove(pt._m);pt._m=null;}
    }
  }
}

const meshes=new Map();       // unit -> group
function unitMesh(u){
  let g=meshes.get(u);
  if(!g){
    if(u instanceof Champion)g=buildChampionMesh(u);
    else if(u instanceof Minion)g=buildMinionMesh(u);
    else if(u instanceof Tower)g=buildTowerMesh(u);
    else if(u instanceof Inhibitor)g=buildInhibitorMesh(u);
    else if(u instanceof Nexus)g=buildNexusMesh(u);
    else if(u.isMonster)g=buildMonsterMesh(u);
    else return null;
    meshes.set(u,g);scene.add(g);
  }
  return g;
}
function pruneMeshes(){
  for(const [u,g] of meshes){
    const keep=u.alive||u instanceof Champion||u instanceof Inhibitor;
    if(!keep||!g.parent){scene.remove(g);meshes.delete(u);}
  }
}

const barCanvasCache=new Map();
function makeBarSprite(u){
  const cv=document.createElement('canvas');cv.width=128;cv.height=(u instanceof Champion)?34:20;
  const tex=new THREE.CanvasTexture(cv);
  tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  spr.scale.set(150,24,1);

function updateBarSprite(spr,u){
  const {cv,tex}=spr.userData;
  const g=cv.getContext('2d');
  const isChamp=u instanceof Champion;
  if(cv.height!==(isChamp?34:20))cv.height=isChamp?34:20;   // nameplate room
  g.clearRect(0,0,128,cv.height);
  const pct=Math.max(0,Math.min(1,u.hp/u.maxhp));
  if(isChamp){
    g.font='bold 11px system-ui,sans-serif';g.textAlign='center';
    const ally=u.team===(player?player.team:BLUE);
    const label=(u.isPlayer?'\u25B6 ':'')+u.name+' '+u.level;
    g.lineWidth=3;g.strokeStyle='rgba(0,0,0,0.85)';g.strokeText(label,64,11);
    g.fillStyle=ally?'#cfe6ff':'#ffd0c8';g.fillText(label,64,11);
  }
  const barY=isChamp?16:4;
  g.fillStyle='rgba(0,0,0,0.72)';g.fillRect(4,barY,120,12);
  const col=u instanceof Champion?(u.team===(player?player.team:BLUE)?'#4ade80':'#ff5a48'):
             (u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus)?(u.team===BLUE?'#5ab0ff':'#ff7a6a'):'#e6b04a';
  g.fillStyle=col;g.fillRect(6,6,116*pct,8);
  if(u.shield>0){g.fillStyle='rgba(180,220,255,0.9)';g.fillRect(6,6,116*Math.min(1,u.shield/u.maxhp),3);}
  tex.needsUpdate=true;
}
const barSprites=new Map();
function syncBars(){
  const seen=new Set();
  for(const u of units){
    if(!u.alive)continue;
    if(!(u instanceof Champion||u instanceof Minion||u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus||u.isMonster))continue;
    // skip own minions? LoL shows them; keep but small. For perf: champions+structures+monsters always; minions only if hp<max
    if(u instanceof Minion&&u.hp>=u.maxhp&&units.length>90)continue;
    if(!inPlayerVision(u))continue;
    seen.add(u);
    let spr=barSprites.get(u);
    if(!spr){spr=makeBarSprite(u);barSprites.set(u,spr);scene.add(spr);}
    updateBarSprite(spr,u);
    const h=(u instanceof Tower)?240:(u instanceof Nexus)?170:(u instanceof Inhibitor)?120:(u instanceof Champion)?158:(u.isMonster)?64:62;
    spr.scale.set(u instanceof Champion?170:150,u instanceof Champion?46:24,1);
    spr.position.set(u.x,h,u.y);
  }
  for(const [u,s] of barSprites){
    if(!seen.has(u)){scene.remove(s);barSprites.delete(u);}
  }
}

/* ------------------------------ camera (LoL-style) ----------------------- */
const camCtl={x:HALF,y:HALF,zoom:1.35,targetZoom:1.35};
// zoom 0.7 (far) .. 2.6 (close)
function worldToScreen(wx,wy){
  // project through three camera
  const v=new THREE.Vector3(wx,0,wy).project(camera);
  return {x:(v.x+1)/2*W,y:(1-v.y)/2*H};
}
function screenToWorld(sx,sy){
  const ray=new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(sx/W*2-1,-(sy/H*2-1)),camera);
  const t=new THREE.Vector3();
  ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),t);
  return {x:t.x,y:t.z};
}
function updateCamera(dt){
  camCtl.zoom+=(camCtl.targetZoom-camCtl.zoom)*Math.min(1,dt*6);
  const z=camCtl.zoom;
  const dist=2400/z;
  const height=3000/z;
  const target=camCtl;
  const tx=target.x,tz=target.y;
  camera.position.set(tx,height+dist*0.24,tz+dist);
  camera.lookAt(tx,60,tz);
  camera.updateMatrixWorld();
}

/* ------------------------------ input rewiring --------------------------- */
// reuse existing listeners? Old listeners reference canvas/ctx sizes. Replace with our own on window.
// The old code added listeners to `canvas` var defined in HTML; we removed resize but canvas still
// exists in DOM (hidden). Attach fresh listeners to renderer.domElement + window.
{
  const dom=renderer.domElement;
  dom.addEventListener('contextmenu',e=>e.preventDefault());
  dom.addEventListener('mousedown',e=>{
    if(e.button===2){mouse.right=true;handleRightClick(e.clientX,e.clientY);}
    else if(e.button===0){handleLeftClick(e.clientX,e.clientY);}
  });
  window.addEventListener('mouseup',e=>{if(e.button===2)mouse.right=false;});
  window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
  dom.addEventListener('wheel',e=>{
    camCtl.targetZoom=Math.min(2.6,Math.max(0.7,camCtl.targetZoom*(e.deltaY<0?1.12:0.9)));
  },{passive:true});
  // edge-pan (LoL style) + WASD pan
  window.addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
  });
  window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
}

/* old input handlers referenced a 2D canvas via screenToWorld; our screenToWorld above
   now projects through the 3D camera, and handleRightClick/handleLeftClick/buyAt all
   call screenToWorld — so clicks land on the correct world positions automatically. */

/* ------------------------------ animation -------------------------------- */
function animateUnits(dt,now){
  for(const [u,g] of meshes){
    if(!g.visible)continue;
    // position (map x,y -> world x,z)
    g.position.x=u.x;g.position.z=u.y;
    // facing
    if(!(u instanceof Tower||u instanceof Nexus||u instanceof Inhibitor)){
      g.rotation.y=-u.facing+Math.PI/2;
    }
    const ud=g.userData;
    if(u instanceof Champion&&ud.legL){
      const moving=(u.moveTarget&&dist(u.x,u.y,u.moveTarget.x,u.moveTarget.y)>14)||(u.attacking&&u.target&&u.target.alive);
      const sw=moving?Math.sin(now*11+ud.phase)*0.55:0;
      ud.legL.rotation.x=sw;ud.legR.rotation.x=-sw;
      ud.armL.rotation.x=-sw*0.7;
      const attacking=u.attacking&&u.target&&u.target.alive;
      ud.armR.rotation.x=attacking?Math.sin(now*13+ud.phase)*0.9-0.3:-sw*0.7;
      ud.cape.rotation.x=moving?-0.35-Math.sin(now*9+ud.phase)*0.12:-0.08;
      g.position.y=u.alive?Math.abs(Math.sin(now*11+ud.phase))*3:0;
      // recall ring
    }
    if(u instanceof Minion&&ud.body){
      const moving=(u.moveTarget||u.target);
      ud.body.position.y=30+(moving?Math.sin(now*10+ud.phase)*2.4:0);
      ud.head.position.y=48+(moving?Math.sin(now*10+ud.phase+1)*2:0);
    }
    if(u instanceof Tower&&ud.gem){
      ud.gem.rotation.y=now*0.8;
      if(u.lastTarget&&u.lastTarget.alive){
        const a=Math.atan2(u.lastTarget.y-u.y,u.lastTarget.x-u.x);
        ud.barrel.rotation.y=-a;   // aim barrel (approx)
      }
    }
    if(u instanceof Inhibitor&&ud.crystal){ud.crystal.rotation.y=now*0.6;ud.crystal.position.y=64+Math.sin(now*2+ud.phase)*6;}
    if(u instanceof Nexus&&ud.core){ud.core.rotation.y=now*0.5;ud.core.rotation.x=Math.sin(now*0.4)*0.2;ud.core.position.y=92+Math.sin(now*1.6+ud.phase)*8;
      if(ud.heart){ud.heart.rotation.y=-now*1.1;ud.heart.scale.setScalar(1+Math.sin(now*3+ud.phase)*0.08);}
      if(ud.shards){ud.shards.forEach((sh,i2)=>{const a=now*0.6+i2/4*Math.PI*2;sh.position.set(Math.cos(a)*72,92+Math.sin(now*1.3+i2*1.7)*18,Math.sin(a)*72);sh.rotation.y=now+i2;});}
    }
    if(u.isMonster&&ud.body){ud.body.position.y=20+Math.sin(now*3+ud.phase)*3;}
    // death: sink & hide handled by prune; champions stay (respawn)
    if(!u.alive){
      if(u instanceof Champion){g.visible=false;}
      else{g.visible=false;}
    }else{g.visible=inPlayerVision(u)||u.isPlayer;}
  }
}

  //   items(114+14) + abilities(336) + summoners(18+56) = 538px centered.

  const dockW=142+336+18+56;

    for(let r2=0;r2<5;r2++){
      ctx.fillStyle=r2<rank?'#ffd76b':'rgba(255,255,255,0.18)';

        ctx.strokeStyle='#d8c98a';ctx.beginPath();ctx.moveTo(-6,2);ctx.lineTo(-2,6);ctx.stroke();
      }else if(it.cat==='magic'){ // orb + sparkles

function roundRectH(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
