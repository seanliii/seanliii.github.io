function drawMinimap3D(){
  const S=W<1150?150:210,pad=18;
  const mx=W-S-pad,my=H-S-pad;
  ctx.save();
  ctx.fillStyle='rgba(6,10,18,0.88)';roundRectH(mx-6,my-6,S+12,S+12,10);ctx.fill();
  ctx.strokeStyle='rgba(90,120,170,0.6)';ctx.lineWidth=1.5;roundRectH(mx-6,my-6,S+12,S+12,10);ctx.stroke();
  const sc=S/MAPW;
  // lanes (clean 3-lane MOBA minimap)
  for(const lane of ['top','mid','bot']){
    ctx.strokeStyle='rgba(190,170,120,0.85)';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    LANES[lane].path.forEach((p,i)=>{const X=mx+p.x*sc,Y=my+p.y*sc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.stroke();
  }
  // river (diagonal, LoL-style)
  ctx.strokeStyle='rgba(70,130,170,0.75)';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(mx+MAPW*0.98*sc,my+MAPW*0.60*sc);
  ctx.quadraticCurveTo(mx+MAPW*0.52*sc,my+MAPW*0.48*sc,mx+MAPW*0.60*sc,my+MAPW*0.02*sc);
  ctx.moveTo(mx+MAPW*0.98*sc,my+MAPW*0.60*sc);
  ctx.quadraticCurveTo(mx+MAPW*0.48*sc,my+MAPW*0.52*sc,mx+MAPW*0.02*sc,my+MAPW*0.40*sc);
  ctx.stroke();
  // base platforms
  for(const [bx,by,col] of [[2000,12820,'rgba(60,120,200,0.5)'],[12820,2000,'rgba(200,70,60,0.5)']]){
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(mx+bx*sc,my+by*sc,13,0,Math.PI*2);ctx.fill();
  }
  // structures + units
  for(const u of units){
    if(!u.alive)continue;
    const X=mx+u.x*sc,Y=my+u.y*sc;
    if(u instanceof Nexus){ctx.fillStyle=u.team===BLUE?T_BLUE:T_RED;ctx.beginPath();ctx.arc(X,Y,6,0,Math.PI*2);ctx.fill();}
    else if(u instanceof Tower){ctx.fillStyle=u.team===BLUE?'#5ab0ff':'#ff7a6a';ctx.fillRect(X-3,Y-3,6,6);}
    else if(u instanceof Inhibitor){ctx.fillStyle=u.team===BLUE?'#8ad0ff':'#ffa08a';ctx.fillRect(X-2,Y-4,4,8);}
    else if(u instanceof Champion){
      if(u.isPlayer){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,4.5,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#ffd76b';ctx.lineWidth=2;ctx.stroke();}
      else if(inPlayerVision(u)){ctx.fillStyle=u.team===player.team?'#3fd06a':'#ff5040';ctx.beginPath();ctx.arc(X,Y,3.5,0,Math.PI*2);ctx.fill();
        if(u.team!==player.team){ctx.strokeStyle='rgba(255,80,64,0.85)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(X,Y,5.5,0,Math.PI*2);ctx.stroke();}}
    }
    else if(u instanceof Minion&&inPlayerVision(u)){ctx.fillStyle=u.team===BLUE?'#3a7bd5':'#d0453a';ctx.fillRect(X-1.5,Y-1.5,3,3);}
    else if(u.isMonster&&inPlayerVision(u)){ctx.fillStyle='#c9b458';ctx.fillRect(X-2,Y-2,4,4);}
  }
  // camera frustum hint
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.strokeRect(mx+ (camCtl.x-2600/camCtl.zoom)*sc, my+(camCtl.y-2000/camCtl.zoom)*sc, 5200/camCtl.zoom*sc, 4000/camCtl.zoom*sc);
  ctx.restore();
}

function drawSurrenderOffer3D(){
  const pw=460,ph=170;

function wrapText3D(text,x,y,maxW,lh){

/* ------------------------------ main loop -------------------------------- */
let lastT3=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(typeof window!=='undefined')window.__riftFrameAlive=true;
  const dt=Math.min(0.05,(now-lastT3)/1000);
  lastT3=now;
  update(dt);   // original game logic (movement, combat, waves, AI, win)
  // camera follow player
  if(player&&state===STATES.PLAYING){
    camCtl.x+= (player.x-camCtl.x)*Math.min(1,dt*8);
    camCtl.y+= (player.y-camCtl.y)*Math.min(1,dt*8);
    // edge pan / WASD pan
    const edge=26,panSpd=1500*dt/camCtl.zoom;
    if(mouse.x<edge)camCtl.x-=panSpd;
    if(mouse.x>W-edge)camCtl.x+=panSpd;
    if(mouse.y<edge)camCtl.y-=panSpd;
    if(mouse.y>H-edge)camCtl.y+=panSpd;
    if(keys['a'])camCtl.x-=panSpd;
    if(keys['d'])camCtl.y-=panSpd;
    if(keys['w'])camCtl.y-=panSpd*0.8;   // careful: 'w' is also ability… use arrows? LoL uses edge pan; WASD conflicts with QWER? W is ability. Only edge pan + arrows.
    if(keys['s'])camCtl.y+=panSpd*0.8;
    // clamp camera to map
    camCtl.x=clamp(camCtl.x,300,MAPW-300);
    camCtl.y=clamp(camCtl.y,300,MAPW-300);
  }
  updateCamera(dt);
  // ensure meshes exist & animate
  for(const u of units){unitMesh(u);}
  pruneMeshes();
  animateUnits(dt,now/1000);
  syncBars();
  syncProjectiles();
  syncParticles(dt);
  // vfx rings
  for(let i=vfxList.length-1;i>=0;i--){
    const v=vfxList[i];v.life-=dt;
    v.mesh.material.opacity=Math.max(0,v.life*1.6);
    v.mesh.scale.setScalar(1+(0.5-v.life)*1.6);
    if(v.life<=0){scene.remove(v.mesh);vfxList.splice(i,1);}
  }
  // move marker fade
  if(moveMarker&&moveMarker.userData.t>0){moveMarker.userData.t-=dt;moveMarker.material.opacity=moveMarker.userData.t*1.4;}
  renderer.render(scene,camera);
  // HUD
  if(state===STATES.END){drawEndScreen3D();}
  else renderHUD3D();
}

function init(){
  /* R40 startup-integrity fix: this script historically called init() TWICE
     (once after the 2D UI section, once after the 3D layer). buildMap() and
     buildStructures() only ever PUSH into jungleCamps / towerList /
     inhibitors, so each extra init() doubled every camp (24 monster records
     at 12 coordinates, two identical units stacked per camp — observed live
     in a fresh Ashe session at gameTime 0.6s) and re-armed a second
     requestAnimationFrame(frame) chain. Fixes:
       - idempotence guard (second init() is a no-op except rAF re-arm safety)
       - buildMap/buildStructures now clear their target arrays first
       - frame loop scheduled exactly once per page lifetime                 */
  if(typeof window!=='undefined'&&window.__riftInitDone){
    /* late re-entry (should not happen after the 1518 call removal, but be
       safe for any external caller): only ensure the loop is alive */
    if(!window.__riftFrameAlive)requestAnimationFrame(frame);
    return;
  }
  if(typeof window!=='undefined')window.__riftInitDone=true;
  buildMap();
  buildStructures();
  jungleCamps.forEach(c=>{if(c.alive)units.push(makeMonster(c));});
  requestAnimationFrame(frame);
}

/* seeded RNG lives at the very top: `var` binds on the global object when the
   combined script evaluates non-strict, so the base script (which runs after
   this layer and calls our groundTexture override) can read it too. */
var rng6=(()=>{let s=0x5EED6;return ()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};})();

   ART OVERHAUL LAYER (CC round, 2026-09-25) — prepended before the base game
   script. All overrides use hoisted function declarations: they replace the
   base script's identically-named functions at call time, while base consts
   (scene, camera, materials...) remain visible to this layer's code below.
   The base game logic (combat, waves, AI, win) is untouched.
   ============================================================================ */

/* ---------------------------- 1. shared helpers --------------------------- */
const ART={};
ART.tintCanvas=(baseHex,noise=0.07,streaks=0)=>{           // painted-armor style texture
  const S=128,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#'+new THREE.Color(baseHex).getHexString();g.fillRect(0,0,S,S);
  for(let i=0;i<260;i++){                                   // tonal speckle
    const x=Math.random()*S,y=Math.random()*S,r=1+Math.random()*3;
    g.fillStyle='rgba('+(Math.random()<0.5?'255,255,255':'0,0,0')+','+(Math.random()*noise).toFixed(3)+')';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  for(let i=0;i<streaks;i++){                               // brushed-metal streaks
    const y=Math.random()*S;
    g.strokeStyle='rgba(255,255,255,'+(0.03+Math.random()*0.05).toFixed(3)+')';
    g.lineWidth=1+Math.random()*2;g.beginPath();g.moveTo(0,y);g.lineTo(S,y+(Math.random()-0.5)*8);g.stroke();
  }

};
ART.mat=(hex,rough=0.6,metal=0.3,streaks=14)=>{             // cached painted material
  if(!ART._m)ART._m={};

    const tex=new THREE.CanvasTexture(ART.tintCanvas(hex,0.08,streaks));
    ART._m[k]=new THREE.MeshStandardMaterial({color:0xffffff,map:tex,roughness:rough,metalness:metal});
  }

};

/* 4a. animated river: scrolling highlight texture on the existing tube */
ART._riverTex=null;
ART.riverTick=(now)=>{
  if(!ART._riverTex){
    /* find the river tube: first transparent tube child of world */
    world.traverse(o=>{
      if(!ART._riverTex&&o.material&&o.material.transparent&&o.geometry&&o.geometry.type==='TubeGeometry'){
        ART._riverTex=o; 
      }
    });
    if(ART._riverTex){
      const m=ART._riverTex.material;
      /* build animated normal-ish map */
      const S=256,c=document.createElement('canvas');c.width=c.height=S;
      const g2=c.getContext('2d');
      g2.fillStyle='#7fd4ff';g2.fillRect(0,0,S,S);
      ART._rivCv=c;ART._rivCtx=g2;
      m.map=new THREE.CanvasTexture(c);m.map.wrapS=m.map.wrapT=THREE.RepeatWrapping;
      m.map.repeat.set(6,20);
      m.color=new THREE.Color(0xffffff);
      m.opacity=0.5;
    }
  }
  if(ART._rivCtx){
    const g2=ART._rivCtx;
    g2.fillStyle='rgba(127,212,255,0.22)';g2.fillRect(0,0,256,256);
    for(let i=0;i<7;i++){
      const x=(i*37+now*22*(i%2?1:-1))%256,y=(i*53+now*90)%256;
      g2.strokeStyle='rgba(255,255,255,0.5)';g2.lineWidth=2;
      g2.beginPath();g2.moveTo(x,y);g2.quadraticCurveTo(x+8,y+14,x,y+28);g2.stroke();
    }
    if(ART._riverTex)ART._riverTex.material.map.needsUpdate=true;
  }
};

/* 4b. fireflies / jungle motes: one Points cloud, cheap */
ART.motes=null;
ART.initMotes=()=>{
  if(ART.motes||!world)return;
  const N=260,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=rand(600,MAPW-600);pos[i*3+1]=40+Math.random()*120;pos[i*3+2]=rand(600,MAPW-600);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const c=document.createElement('canvas');c.width=c.height=32;
  const g2=c.getContext('2d');
  const gr=g2.createRadialGradient(16,16,1,16,16,15);
  gr.addColorStop(0,'rgba(255,244,180,1)');gr.addColorStop(1,'rgba(255,244,180,0)');
  g2.fillStyle=gr;g2.fillRect(0,0,32,32);
  const spr=new THREE.PointsMaterial({size:26,map:new THREE.CanvasTexture(c),transparent:true,opacity:0.55,depthWrite:false,blending:THREE.AdditiveBlending});
  ART.motes=new THREE.Points(geo,spr);

};

/* All class hooks are installed lazily (classes are declared by the base
   script AFTER this layer executes). installArtHooks() runs from the frame
   guard once the base script has fully evaluated.                      */
let _artHooksOn=false;
function installArtHooks(){
  if(_artHooksOn)return;_artHooksOn=true;
  /* 5a. hit sparks on damage */
  const _artTakeDamage=Unit.prototype.takeDamage;
  Unit.prototype.takeDamage=function(dmg,src,type){
    const final=_artTakeDamage.call(this,dmg,src,type);
    if(final>0&&typeof particles!=='undefined'){
      const col=type==='magic'?'#8ab4ff':(type==='true'?'#ffffff':'#ffcf6b');
      spawnParticles(this.x,this.y,col,this instanceof Champion?7:4,'hit');
    }
    return final;
  };
  /* 5c. tower death debris */
  const _artTowerDie=Tower.prototype.die;
  Tower.prototype.die=function(killer){
    const x=this.x,y=this.y;
    _artTowerDie.call(this,killer);
    if(typeof scene==='undefined')return;
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2;
      const chunk=new THREE.Mesh(new THREE.BoxGeometry(rand(14,34),rand(10,26),rand(14,30)),
        new THREE.MeshStandardMaterial({color:0x4a5570,roughness:0.9}));
      chunk.position.set(x+Math.cos(a)*rand(0,40),rand(40,200),y+Math.sin(a)*rand(0,40));
      chunk.userData.vx=Math.cos(a)*rand(120,420);chunk.userData.vy=rand(200,560);chunk.userData.vz=Math.sin(a)*rand(120,420);
      chunk.userData.spin=rand(2,7);
      scene.add(chunk);vfxList.push({mesh:chunk,life:1.4,debris:true});
    }
    const boom=ART.addGlow(scene,0xffd76b,300,120);boom.position.set(x,120,y);
    vfxList.push({mesh:boom,life:0.8,glow:true});
  };
  /* 5d. champion death dissolve */
  const _artChampDie=Champion.prototype.die;
  Champion.prototype.die=function(killer){
    const x=this.x,y=this.y,team=this.team,col=this.champColor;
    _artChampDie.call(this,killer);
    if(typeof scene==='undefined')return;
    const ringM=new THREE.Mesh(new THREE.RingGeometry(10,26,40),
      new THREE.MeshBasicMaterial({color:team===BLUE?0x4a9fe8:0xff6a4a,transparent:true,opacity:0.9,side:THREE.DoubleSide}));
    ringM.rotation.x=-Math.PI/2;ringM.position.set(x,2,y);
    scene.add(ringM);vfxList.push({mesh:ringM,life:0.7});
    for(let i=0;i<16;i++){
      const a=Math.random()*Math.PI*2;
      const m=new THREE.Mesh(new THREE.OctahedronGeometry(4),
        new THREE.MeshBasicMaterial({color:new THREE.Color(col).getHex(),transparent:true,opacity:0.9}));
      m.position.set(x,rand(20,90),y);
      m.userData.vx=Math.cos(a)*rand(60,260);m.userData.vy=rand(120,420);m.userData.vz=Math.sin(a)*rand(60,260);
      scene.add(m);vfxList.push({mesh:m,life:0.9,spark:true});
    }
  };
  /* 5e. tower hit impact flash (hook the particle spawner used by towerThink) */
  const _artSpawnParticles=spawnParticles;
  spawnParticles=function(x,y,color,n,type){
    _artSpawnParticles(x,y,color,n,type);

/* ---------------------------- 6. animation upgrade ------------------------ */
/* Extended unit animation: anticipation on attack, cape sway, bob, recoil. */
function animateUnits(dt,now){
  for(const [u,g] of meshes){
    if(!g.visible)continue;
    g.position.x=u.x;g.position.z=u.y;
    if(!(u instanceof Tower||u instanceof Nexus||u instanceof Inhibitor)){
      g.rotation.y=-u.facing+Math.PI/2;
    }
    const ud=g.userData;
    if(u instanceof Champion&&ud.legL){
      const moving=(u.moveTarget&&dist(u.x,u.y,u.moveTarget.x,u.moveTarget.y)>14)||(u.attacking&&u.target&&u.target.alive);
      const attacking=u.attacking&&u.target&&u.target.alive;
      /* walk cycle with vertical bob + slight lean */
      const sw=moving?Math.sin(now*11+ud.phase)*0.55:Math.sin(now*2+ud.phase)*0.04;
      ud.legL.rotation.x=sw;ud.legR.rotation.x=-sw;
      ud.armL.rotation.x=-sw*0.7;
      /* attack: anticipation -> strike (armR) */
      if(attacking){
        const t=(now*1.6+ud.phase)%1;
        ud.armR.rotation.x=t<0.6?-1.4+Math.sin(t/0.6*Math.PI)*0.5:-0.3;   // wind up then snap
        ud.torso.rotation.y=t<0.6?-0.25*t:0.18;
      } else {
        ud.armR.rotation.x=-sw*0.7;ud.torso.rotation.y=0;
      }
      /* cape sway: speed-based flutter */
      ud.cape.rotation.x=moving?-0.4-Math.sin(now*9+ud.phase)*0.14:-0.1+Math.sin(now*2.2+ud.phase)*0.05;
      ud.cape.rotation.z=Math.sin(now*7+ud.phase)*(moving?0.1:0.04);
      g.position.y=u.alive?Math.abs(Math.sin(now*11+ud.phase))*3.2:0;
    }
    if(u instanceof Minion&&ud.body){
      const moving=(u.moveTarget||u.target);
      ud.body.position.y=22+(moving?Math.sin(now*10+ud.phase)*2.2:0);
      ud.body.rotation.z=moving?Math.sin(now*10+ud.phase)*0.06:0;
      ud.head.position.y=44+(moving?Math.sin(now*10+ud.phase+1)*1.8:0);
    }
    if(u instanceof Tower&&ud.gem){
      ud.gem.rotation.y=now*0.8;
      ud.gem.position.y=212+Math.sin(now*2+ud.phase)*3;
      if(u.lastTarget&&u.lastTarget.alive){
        const a=Math.atan2(u.lastTarget.y-u.y,u.lastTarget.x-u.x);
        ud.barrel.rotation.y=-a;
      }
    }
    if(u instanceof Inhibitor&&ud.crystal){ud.crystal.rotation.y=now*0.6;ud.crystal.position.y=64+Math.sin(now*2+ud.phase)*6;}
    if(u instanceof Nexus&&ud.core){ud.core.rotation.y=now*0.5;ud.core.rotation.x=Math.sin(now*0.4)*0.2;ud.core.position.y=92+Math.sin(now*1.6+ud.phase)*8;
      if(ud.heart){ud.heart.rotation.y=-now*1.1;ud.heart.scale.setScalar(1+Math.sin(now*3+ud.phase)*0.08);}
      if(ud.shards){ud.shards.forEach((sh,i2)=>{const a=now*0.6+i2/4*Math.PI*2;sh.position.set(Math.cos(a)*72,92+Math.sin(now*1.3+i2*1.7)*18,Math.sin(a)*72);sh.rotation.y=now+i2;});}
    }
    if(u.isMonster&&ud.body){ud.body.position.y=20+Math.sin(now*3+ud.phase)*3;}
    if(!u.alive){g.visible=false;}
    else{g.visible=inPlayerVision(u)||u.isPlayer;}
  }
  /* env anims */
  ART.riverTick(now);
  if(ART.motes){
    ART.motes.rotation.y=now*0.01;
    ART.motes.material.size=24+Math.sin(now*1.3)*6;
  }
}

/* ---------------------------- 7. frame tail hook -------------------------- */
/* The base script's frame() is a hoisted function too — we re-declare it with
   the same body plus art additions. (Re-declaration replaces the earlier one.) */
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-lastT3)/1000);
  lastT3=now;
  update(dt);
  if(player&&state===STATES.PLAYING){
    camCtl.x+=(player.x-camCtl.x)*Math.min(1,dt*8);
    camCtl.y+=(player.y-camCtl.y)*Math.min(1,dt*8);
    const edge=26,panSpd=1500*dt/camCtl.zoom;
    if(mouse.x<edge)camCtl.x-=panSpd;
    if(mouse.x>W-edge)camCtl.x+=panSpd;
    if(mouse.y<edge)camCtl.y-=panSpd;
    if(mouse.y>H-edge)camCtl.y+=panSpd;
    if(keys['a'])camCtl.x-=panSpd;
    if(keys['d'])camCtl.y+=panSpd;
    if(keys['w'])camCtl.y-=panSpd*0.8;
    if(keys['s'])camCtl.y+=panSpd*0.8;
    camCtl.x=clamp(camCtl.x,300,MAPW-300);
    camCtl.y=clamp(camCtl.y,300,MAPW-300);
  }
  updateCamera(dt);
  for(const u of units){unitMesh(u);}
  pruneMeshes();
  animateUnits(dt,now/1000);
  syncBars();
  syncProjectiles();
  syncParticles(dt);
  /* art vfx lifecycle: sparks fall, debris tumble & land, flashes shrink */
  for(let i=vfxList.length-1;i>=0;i--){
    const v=vfxList[i];
    v.life-=dt;
    const m=v.mesh;
    if(v.spark){
      m.position.x+=(m.userData.vx||0)*dt;
      m.position.y+=(m.userData.vy||0)*dt;m.userData.vy-=900*dt;
      m.position.z+=(m.userData.vz||0)*dt;
      m.rotation.x+=dt*7;m.rotation.y+=dt*5;
      if(m.position.y<2)m.position.y=2;
    } else if(v.debris){
      m.position.x+=(m.userData.vx||0)*dt;
      m.position.y+=(m.userData.vy||0)*dt;m.userData.vy-=1500*dt;
      m.position.z+=(m.userData.vz||0)*dt;
      m.rotation.x+=(m.userData.spin||3)*dt;m.rotation.z+=(m.userData.spin||2)*dt;
      if(m.position.y<8){m.position.y=8;m.userData.vx*=0.3;m.userData.vz*=0.3;m.userData.vy=0;}
    } else if(v.flash){
      m.scale.setScalar(1+(0.4-v.life)*4);
    } else if(v.glow){
      /* keep still, fade via opacity below */
    } else {
      m.material.opacity=Math.max(0,v.life*1.6);
      m.scale.setScalar(1+(0.5-v.life)*1.6);
    }
    m.material.opacity=(v.spark||v.debris)?Math.max(0,v.life*1.4):Math.max(0,v.life*1.5);
    if(v.glow)m.material.opacity=Math.max(0,v.life*1.1);
    if(v.life<=0){scene.remove(m);vfxList.splice(i,1);}
  }
  if(moveMarker&&moveMarker.userData.t>0){moveMarker.userData.t-=dt;moveMarker.material.opacity=moveMarker.userData.t*1.4;}
  renderer.render(scene,camera);
  if(state===STATES.END){drawEndScreen3D();}
  else renderHUD3D();
}

/* ---------------------------- 8. init-time grade -------------------------- */
/* Runs once the base script finished creating scene/renderer (we are inside
   the same script tag, sequential execution: this IIFE runs AFTER everything
   above in the base, since this whole art layer is textually FIRST... no —
   the art layer is FIRST, so base consts are not yet defined here. Instead we
   schedule our upgrades on the first animation frame.                     */
let _artInited=false;
const _artInitHook=()=>{
  if(_artInited||typeof scene==='undefined'||!scene)return;
  _artInited=true;
  /* 8a. READABILITY FIX (2026-09-25 round 3): the previous "cinematic grade"
     (ACES + exposure 1.12 + outputEncoding=sRGBEncoding) whitewashed the
     battlefield on real WebGL: sRGB-encoding the OUTPUT while every canvas
     texture stayed LinearEncoding brightened mid-tones ~x1.8 and clipped
     roads/minions/towers to near-white (real M2 Chrome screenshots: field
     luminance p50 197-200 vs 109 in the old readable build; units unfindable
     without health bars). Reverted to the PROVEN 926 pipeline: NoToneMapping,
     LinearEncoding output, base light intensities/colors, base fog. The art
     layer keeps its geometry/VFX/palette work - now lit the way the old build
     proved readable. Palette hexes that washed white were re-targeted dark.
     R8 (real-GPU fix, 2026-09-26): even with NoToneMapping, the LIGHT SUM
     clipped the road: sun 1.35 + hemi 1.05 + rim 0.9 + bounce 0.3 gives flat
     ground ~1.9-2.2x albedo -> a 0.5-brightness warm-tan albedo saturated to
     >1.0 = hard white (real M2 road.jpg: road band #ffffff, grass #5c9350 -
     classic blown-highlights, NOT a texture problem; texture probe at the
     same spot is healthy warm-tan #af9f7f). Fix at the SOURCE: re-budget the
     rig so flat-ground irradiance stays ~1.15, and roll off the last 15% of
     the range so anything still hot compresses instead of flat-clipping. */
  if(renderer){
    renderer.toneMapping=THREE.ReinhardToneMapping;
    renderer.toneMappingExposure=1.28;   /* Reinhard+1.28: mid-tones (road
       tan, grass) land ~where the readable build put them; only the >0.85
       highlight region compresses - the white band becomes bright but
       structured stone instead of a flat blown band. */
    renderer.outputEncoding=THREE.LinearEncoding;
  }
  /* re-budget: sun stays the primary (shadow-casting, warm); hemi trimmed;
     rim/bounce become accents, not second suns.
       flat-ground sum before: ~2.05  ->  after: ~1.15
       grass albedo ~0.35 -> ~0.40 lit (same read as before)
       road albedo 0.42-0.55 -> 0.5-0.63 lit (tan preserved, no clip) */
  /* R8 third pass (vision-measured): plaza luminance p50=103, p90=130 —
     dark vs the road band (p50 ~150). Raise the whole scene one more notch:
     hemi 0.85 -> 0.95, sun 1.38 -> 1.42. Flat-ground sum ~1.28 -> ~1.40.
     Road albedo peak 0.55: 0.55*1.40=0.77, tone-mapped ~0.68 — structured
     highlight, no white clip (clip needs >0.9 post-Reinhard). Safe. */
  if(typeof sun!=='undefined'&&sun){sun.intensity=1.42;sun.color.setHex(0xfff2d8);}
  if(typeof hemi!=='undefined'&&hemi){hemi.intensity=0.95;hemi.color.setHex(0xcfe0ff);hemi.groundColor.setHex(0x3a4a2e);}
  if(ART.rim){ART.rim.intensity=0.32;}        /* accent, not a second sun */
  if(ART.bounce){ART.bounce.intensity=0.10;}
  if(typeof scene!=='undefined'&&scene&&scene.fog){scene.fog.color.setHex(0x0b1220);}
  if(typeof scene!=='undefined'&&scene){scene.background=new THREE.Color(0x0b1220);}
  /* 8b. glow halos on nexus cores + tower gems (fake bloom) */
  for(const [u,g] of meshes){
    if(u instanceof Nexus){ART.addGlow(g,u.team===BLUE?0x3a9fe0:0xe05a3a,260,92);}
    if(u instanceof Tower){ART.addGlow(g,u.team===BLUE?0x2f7fe0:0xd0453a,90,212);}
  }
  /* 8c. env: motes */
  ART.initMotes();
  /* 8d. projectiles get tracer trails: wrap syncProjectiles */
  const _baseSyncProj=syncProjectiles;
  syncProjectiles=function(){
    _baseSyncProj();
  };
};
/* run hook each frame until scene exists (first frame after base init) */
const _artFrameGuard=setInterval(()=>{
  if(typeof scene!=='undefined'&&scene&&typeof meshes!=='undefined'&&typeof Unit!=='undefined'){
    _artInitHook();
    installArtHooks();
    clearInterval(_artFrameGuard);
  }
},50);


/* ============================================================================

   function re-declaration on renderHUD3D pieces is not possible for inner
   fns, so we wrap renderHUD3D itself and post-fix the two inherited quirks:
   (a) timer drawn at fixed y=56 (below bar on short bars) -> re-center;
   (b) duplicate item-grid 'ghost' cluster -> suppressed by re-laying items.
   Wrapping keeps ALL base HUD logic; we only adjust the two glitch sites by
   pre-setting layout variables through a small monkey-patch of roundRectH.

/* ---- (a+b) cleanest: fully re-drawn top bar & item strip via wrapper ---- */
const _artBaseHUD=renderHUD3D;
renderHUD3D=function(){
  /* (a) inherited quirk: base top-bar panel is 44px tall (y 10..54) but the
     clock is drawn centred at y=56 -> digits hang below the panel, floating
     over the 3D scene.  Fix without touching base internals: while the base
     draws, rewrite the ONE top-bar box signature (x,10,380,44,12) — unique
     in the whole HUD — to a 56px-tall panel (y 10..66) so the clock sits
     inside the frame like every LoL-style scoreboard bar. */
  const _rr=roundRectH;
  let _topX=null;
  roundRectH=function(x,y,w,h,r){
    if(y===10&&w===380&&h===44&&r===12){_topX=x;h=56;}
    _rr(x,y,w,h,r);
  };
  _artBaseHUD();
  roundRectH=_rr;
  /* re-centre the clock INSIDE the tall panel (base drew it at y=56 centre,
     which is now mid-panel) and give it a soft dark chip so it reads over
     the ':' divider — pure cosmetic, no state touched. */
  if(_topX!==null&&state===STATES.PLAYING&&player){
    const cx=W/2;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.42)';roundRectH(cx-52,46,104,18,8);ctx.fill();
    ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#e8f0ff';
    const mm=Math.floor(gameTime/60),ss=Math.floor(gameTime%60);
    ctx.fillText(mm+':'+(ss<10?'0':'')+ss,cx,56);
    ctx.restore();
  }
  /* (b) item-grid 'ghosts': verified single item grid in base (3x2 LoL-style
     slots with faint empty borders) — intended design, not a duplicate. */
};

/* ---- recall channel beam (hook Champion.recall through prototype) -------- */
const _artRecall=Champion.prototype.recall;
Champion.prototype.recall=function(){
  const wasRecalling=this.recalling;
  _artRecall.call(this);
  if(!wasRecalling&&this.recalling&&typeof scene!=='undefined'&&typeof meshes!=='undefined'){
    const g=meshes.get(this);
    if(g){
      const beam=new THREE.Mesh(new THREE.CylinderGeometry(30,30,420,12,1,true),
        new THREE.MeshBasicMaterial({color:this.team===BLUE?0x4a9fe8:0xff6a4a,transparent:true,opacity:0.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
      beam.position.y=210;
      g.add(beam);
      const dur=8;
      const start=performance.now();
      const fade=()=>{
        const t=(performance.now()-start)/1000;
        if(!this.recalling||t>dur||!g.parent){g.remove(beam);return;}
        beam.rotation.y+=0.05;
        beam.material.opacity=0.2+0.15*Math.sin(t*8);
        requestAnimationFrame(fade);
      };
      fade();
    }
  }
};

/* ---- 9. WebAudio combat SFX (synthesized — zero assets, zero network) ---- */
/* Unlocked on first user gesture (autoplay policy). Every combat event gets
   a tone: melee thud, ranged plink, magic shimmer, ability cast, ult slam,
   tower hit, tower fall, kill sting, death, level-up, recall, victory/defeat. */
const SFX={ctx:null,unlock(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  ok(){return !!this.ctx&&this.ctx.state!=='closed';},
  tone(f,d,type,vol,slide){
    if(!this.ok())return;
    try{
      const t=this.ctx.currentTime;
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(this.ctx.destination);
      o.start(t);o.stop(t+d+0.02);
    }catch(e){}
  },
  hit(kind,crit){
    if(kind==='magic')this.tone(crit?520:420,0.09,'triangle',0.05,0.55);
    else if(kind==='true')this.tone(660,0.08,'sine',0.05,0.6);
    else this.tone(crit?95:120,0.07,'sawtooth',0.045,0.5);
  },
  rangedHit(){this.tone(240,0.05,'square',0.02,0.7);},
  cast(){this.tone(330,0.12,'triangle',0.04,1.6);},
  ult(){this.tone(92,0.45,'sawtooth',0.07,0.6);this.tone(310,0.3,'square',0.02,1.2);},
  towerHit(){this.tone(180,0.1,'square',0.035,0.8);},
  towerFall(){this.tone(62,0.9,'sawtooth',0.06,0.4);this.tone(210,0.5,'square',0.02,0.5);},
  kill(streak){
    this.tone(540+Math.min(streak,5)*55,0.18,'triangle',0.05);
    this.tone(360,0.22,'sine',0.03,0.8);
  },
  death(){this.tone(160,0.5,'sawtooth',0.05,0.45);},
  levelUp(){this.tone(392,0.09,'triangle',0.04);this.tone(523,0.12,'triangle',0.04);},
  recall(){this.tone(440,0.3,'sine',0.03,1.5);},
  victory(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.28,'triangle',0.05),i*140));},
  defeat(){[392,330,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'sine',0.05),i*160));},
  minion(){this.tone(200,0.04,'square',0.012,0.8);}
};
(function(){
  const unlock=()=>{SFX.unlock();};
  window.addEventListener('pointerdown',unlock,{once:true});
  window.addEventListener('keydown',unlock,{once:true});

/* ---- 10. camera retarget: closer default, wider zoom range ---------------
   Old: dist=2400/z, zoom .7..2.6, default 1.35 -> champion ~21-45px.
   New: dist=1800/z, zoom .65..3.4, default 1.85 -> champion ~55-90px at
   default (matches the 60-80px presence of mature references). Map, fog,
   movement, minimap scale all untouched — only the projection moves.       */
function updateCamera(dt){
  camCtl.zoom+=(camCtl.targetZoom-camCtl.zoom)*Math.min(1,dt*7);
  const z=camCtl.zoom;
  const dist=1800/z;
  const height=2200/z;
  const target=camCtl;
  const tx=target.x,tz=target.y;
  /* camera shake: applied as a decaying offset (never touches logic) */
  let sx=0,sy=0;
  if(ART.shake>0.001){
    sx=(Math.random()-0.5)*ART.shake*38;
    sy=(Math.random()-0.5)*ART.shake*38;
    ART.shake*=Math.pow(0.0018,dt);       // exponential decay ~0.25s
  }
  camera.position.set(tx+sx,height+dist*0.30,tz+dist+sy);
  camera.lookAt(tx+sx,60,tz+sy);
  camera.updateMatrixWorld();
}
ART.shake=0;
ART.addShake=(v)=>{ART.shake=Math.min(2.2,Math.max(ART.shake,v));};
/* retarget wheel zoom + first-frame default */
(function(){
  const dom=(typeof renderer!=='undefined'&&renderer)?renderer.domElement:null;
  if(dom){
    dom.addEventListener('wheel',e=>{
      camCtl.targetZoom=Math.min(3.4,Math.max(0.65,camCtl.targetZoom*(e.deltaY<0?1.13:0.885)));
    },{passive:true});
  }
  camCtl.zoom=camCtl.targetZoom=1.85;
})();
/* re-run the wheel listener install when renderer appears later (guard) */
const _zoomGuard=setInterval(()=>{
  if(typeof renderer!=='undefined'&&renderer&&renderer.domElement&&!renderer.domElement._artZoom){
    renderer.domElement._artZoom=true;
    renderer.domElement.addEventListener('wheel',e=>{
      camCtl.targetZoom=Math.min(3.4,Math.max(0.65,camCtl.targetZoom*(e.deltaY<0?1.13:0.885)));
    },{passive:true});
    clearInterval(_zoomGuard);
  }
},80);

/* ---- 11. hit-stop: 60ms time dip on the PLAYER's impactful hits ----------
   Time scale is a *render/anim* effect here: we scale dt fed to update() in
   our frame() override below. Purely cosmetic — no state is edited.         */
ART.hitStop=0;
ART.hitStopMax=0;

/* ---- 12. world-space floating damage numbers -----------------------------
   Sprites with canvas text, projected like health bars (same billboarding).
   Numbers only for damage the PLAYER deals or receives (mature MOBAs don't
   spam numbers for bot-vs-bot minion fights), plus gold popups.            */
ART.dmgNums=[];
ART.spawnDmgNum=(x,y,text,color,scale)=>{
  if(ART.dmgNums.length>48)ART.dmgNums.shift();
  const cv=document.createElement('canvas');cv.width=160;cv.height=64;
  const tex=new THREE.CanvasTexture(cv);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  spr.userData={cv,tex,vy:120,life:0.85,t:0,text,color,scale:scale||1,x,y};
  spr.scale.set(120*(scale||1),48*(scale||1),1);
  ART.dmgNums.push(spr);scene.add(spr);
};
ART.stepDmgNums=(dt)=>{
  for(let i=ART.dmgNums.length-1;i>=0;i--){
    const s=ART.dmgNums[i],u=s.userData;
    u.t+=dt;u.life-=dt;
    u.y+=u.vy*dt;u.vy-=160*dt;
    if(u.life<=0||!s.parent){scene.remove(s);if(u.tex)u.tex.dispose();ART.dmgNums.splice(i,1);continue;}
    const g=u.cv.getContext('2d');
    g.clearRect(0,0,160,64);
    g.font='bold 34px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=6;g.strokeStyle='rgba(0,0,0,0.85)';
    g.globalAlpha=Math.min(1,u.life*2.2);
    g.strokeText(u.text,80,32);
    g.fillStyle=u.color;g.fillText(u.text,80,32);
    g.globalAlpha=1;
    u.tex.needsUpdate=true;
    const h=170+(1-u.life)*90;
    s.position.set(u.x,h,u.y);
    s.material.opacity=Math.min(1,u.life*2.4);
  }
};

/* ---- 13. combat hooks: shake/numbers/sound on every impactful event ------ */
function installCombatHooks(){
  /* 13a. damage taken anywhere by the player: red number + shake          */
  const _baseTD=Unit.prototype.takeDamage;
  Unit.prototype.takeDamage=function(dmg,src,type){
    const final=_baseTD.call(this,dmg,src,type);
    if(final>0&&typeof player!=='undefined'&&player){
      if(this===player){
        ART.spawnDmgNum(this.x,this.y,'-'+final,'#ff5a48',1.15);
        ART.addShake(Math.min(0.55,0.12+final/900));
        SFX.hit(type,false);
      }
      /* player DEALT this damage (src is the player or player's pets) */
      else if(src===player||(src&&src.owner===player)||(src&&src.src===player)){
        const crit=final>200;
        ART.spawnDmgNum(this.x,this.y,String(final),
          type==='magic'?'#8ad4ff':(type==='true'?'#ffffff':'#ffd76b'),
          this instanceof Champion?1.25:0.9);
        if(this instanceof Champion){SFX.hit(type,crit);ART.addShake(0.14);}
        else if(this instanceof Tower||this instanceof Nexus){SFX.towerHit();ART.addShake(0.08);}
        else SFX.minion();
        if(src===player&&!(this instanceof Tower)&&final>60)ART.hitStop=0.05;
      }
      /* bot-vs-bot champion fights near the player: soft shake only */
      else if(this instanceof Champion&&src instanceof Champion){
        const d=typeof dist!=='undefined'?dist(this.x,this.y,player.x,player.y):9999;
        if(d<1800)ART.addShake(0.05);
      }
    }
    return final;
  };

  /* 13b. ability casts: cast sound + slight shake for ults                */
  const _baseCast=castAbility;
  castAbility=function(src,slot,targetPos){
    const ok=_baseCast(src,slot,targetPos);
    if(ok&&typeof player!=='undefined'&&player&&src===player){
      if(slot==='R'){SFX.ult();ART.addShake(0.4);}
      else SFX.cast();
    }
    return ok;
  };

  /* 13c. kills: streak announcements + sting + killcam-ish shake          */
  const _baseAwardKill=(typeof awardKill!=='undefined')?awardKill:null;
  if(_baseAwardKill){
    awardKill=function(killer,victim){
      _baseAwardKill(killer,victim);
      if(typeof units==='undefined')return;
      const streakKey=(k)=>k instanceof Champion;
      if(killer instanceof Champion){
        killer._killT=killer._killT||[];
        const now=(typeof gameTime!=='undefined')?gameTime:0;
        killer._killT=killer._killT.filter(t=>now-t<11);
        killer._killT.push(now);
        const n=killer._killT.length;
        const label=n>=5?'PENTA KILL':n===4?'QUADRA KILL':n===3?'TRIPLE KILL':n===2?'DOUBLE KILL':null;
        if(label&&typeof GAME!=='undefined'&&GAME.announce){
          GAME.announce(label+' — '+(killer.name||'champion'),killer.team===BLUE?'#5ec8ff':'#ff7a6a',true);
        }
        if(killer.isPlayer||victim.isPlayer){SFX.kill(n);ART.addShake(0.45);}
        else{
          const d=(typeof player!=='undefined'&&player&&typeof dist!=='undefined')?dist(killer.x,killer.y,player.x,player.y):9999;
          if(d<2600)SFX.kill(n);
        }
      }
      if(victim.isPlayer){SFX.death();ART.addShake(0.8);}
    };
  }

  /* 13d. level-up flourish on the player                                  */
  const _baseLevelUp=Champion.prototype.levelUp;
  Champion.prototype.levelUp=function(){
    _baseLevelUp.call(this);
    if(this.isPlayer){SFX.levelUp();ART.spawnDmgNum(this.x,this.y,'LEVEL '+this.level,'#7dff9a',1.3);}
  };

  /* 13e. recall start sound                                               */
  const _baseRecall=Champion.prototype.recall;
  Champion.prototype.recall=function(){
    const was=this.recalling;
    _baseRecall.call(this);
    if(!was&&this.recalling&&this.isPlayer)SFX.recall();
  };

  /* 13f. tower fall: big shake + deep boom (art layer adds debris)        */
  const _artTowerDieR4=Tower.prototype.die;
  Tower.prototype.die=function(killer){
    _artTowerDieR4.call(this,killer);
    SFX.towerFall();
    const d=(typeof player!=='undefined'&&player&&typeof dist!=='undefined')?dist(this.x,this.y,player.x,player.y):9999;
    ART.addShake(Math.max(0.25,0.9-d/6000));
  };

  /* 13g. game end: victory/defeat sting + slow-down ending beat.
     Camera pans to the falling nexus over 1.4s while shards fly (the art
     layer's nexus death already spawns debris). Implemented as a light
     cinematic: freeze player input effect by state END (base handles).   */
  const _origEndDraw=null;
  ART.endCin={t:-1};
}

/* ---- 14. ghost-chip health bars: recent-damage trail --------------------
   Upgrade makeBarSprite: a faded 'ghost' fill trails the real fill (the
   classic 'white sliver that catches up'). Implemented by re-declaring
   updateBarSprite — same sprite pool, richer drawing.                      */
function updateBarSprite(spr,u){
  const {cv,tex}=spr.userData;
  const g=cv.getContext('2d');
  const isChamp=u instanceof Champion;
  if(cv.height!==(isChamp?36:20))cv.height=isChamp?36:20;
  g.clearRect(0,0,128,cv.height);
  const pct=Math.max(0,Math.min(1,u.hp/u.maxhp));
  /* ghost ratio chases pct with lag (per-sprite, stored on userData) */
  spr.userData.ghost=spr.userData.ghost===undefined?pct:spr.userData.ghost+(pct-spr.userData.ghost)*0.08;
  const ghost=Math.max(pct,spr.userData.ghost);
  if(isChamp){
    g.font='bold 11px system-ui,sans-serif';g.textAlign='center';
    const ally=u.team===(player?player.team:BLUE);
    const label=(u.isPlayer?'▶ ':'')+u.name+' '+u.level;
    g.lineWidth=3;g.strokeStyle='rgba(0,0,0,0.85)';g.strokeText(label,64,11);
    g.fillStyle=ally?'#cfe6ff':'#ffd0c8';g.fillText(label,64,11);
  }
  const barY=isChamp?18:4;
  /* frame + background */
  g.fillStyle='rgba(0,0,0,0.78)';g.fillRect(3,barY-1,122,14);
  g.fillStyle='rgba(10,16,26,0.95)';g.fillRect(5,barY+1,118,10);
  /* ghost trail (recent damage) */
  if(ghost>pct+0.004){g.fillStyle='rgba(255,235,200,0.55)';g.fillRect(6,barY+2,116*ghost,8);}
  /* real fill */
  const col=u instanceof Champion?(u.team===(player?player.team:BLUE)?'#4ade80':'#ff5a48'):
             (u instanceof Tower||u instanceof Inhibitor||u instanceof Nexus)?(u.team===BLUE?'#5ab0ff':'#ff7a6a'):'#e6b04a';
  g.fillStyle=col;g.fillRect(6,barY+2,116*pct,8);
  if(isChamp){
    /* level pips along champion bar (LoL-style segmented) */
    g.fillStyle='rgba(0,0,0,0.4)';
    for(let i=1;i<Math.min(18,u.level);i++)g.fillRect(6+116*(1-Math.pow(1-i/18,0.9)),barY+2,1,8);
  }
  if(u.shield>0){g.fillStyle='rgba(180,220,255,0.95)';g.fillRect(6,barY,116*Math.min(1,u.shield/u.maxhp),3);}
  tex.needsUpdate=true;
}

/* ---- 15. tower danger flash: when an enemy tower targets the player ----- */
ART.towerWarn=null;
ART.stepTowerWarn=(dt)=>{
  if(typeof player==='undefined'||!player||typeof units==='undefined')return;
  let warned=false;
  for(const u of units){
    if(u instanceof Tower&&u.alive&&u.team!==player.team&&u.lastTarget===player){
      warned=true;break;
    }
  }
  if(warned&&!ART.towerWarn){
    ART.towerWarn={t:0};
    if(typeof GAME!=='undefined'&&GAME.announce)GAME.announce('! Enemy tower is targeting you','#ff8a5a');
  }
  if(ART.towerWarn){
    ART.towerWarn.t+=dt;
    if(ART.towerWarn.t>2.4)ART.towerWarn=null;
  }
};

/* ---- 16. upgraded kill feed: framed banners with streak icons ----------- */
function drawKillFeed3D(){
  if(typeof announcements==='undefined')return;
  const feed=announcements.filter(a=>!a.floating).slice(-4);
  feed.forEach((a,i)=>{
    const y=78+i*26;
    const w=Math.min(420,ctx.measureText(a.text).width+38);
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,(a.dur-a.t)*1.4));
    ctx.fillStyle='rgba(8,12,22,0.72)';roundRectH(W-16-w,y-14,w,24,6);ctx.fill();
    ctx.strokeStyle=(a.color||'#fff')+'66';ctx.lineWidth=1;roundRectH(W-16-w,y-14,w,24,6);ctx.stroke();
    ctx.fillStyle=a.color||'#fff';ctx.font=(a.big?'bold 13px':'bold 12px')+' system-ui';
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(a.text,W-26,y-1);
    ctx.restore();
  });
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

/* ---- 17. end-of-game beat: sting + one-shot camera push on the core -----
   Fires once when state flips to END: plays sting, nudges the camera
   toward the destroyed nexus, and lets the existing shard debris carry.  */
ART.endBeatFired=false;
ART.stepEndBeat=()=>{
  if(typeof state==='undefined'||typeof STATES==='undefined')return;
  if(state===STATES.END&&!ART.endBeatFired){
    ART.endBeatFired=true;
    const win=typeof GAME!=='undefined'&&GAME.winner===BLUE;
    if(win)SFX.victory();else SFX.defeat();
    ART.addShake(1.4);
    /* find the destroyed nexus for a camera nudge. Dead nexus units are
       removed from `units` by the base cleanup on the same tick — search the
       bar/mesh registries first (they persist a frame), else infer: the loser
       team's nexus position is fixed (2000,12820) blue / (12820,2000) red. */
    let nx=null,ny=null;
    if(typeof units!=='undefined'){
      for(const u of units){
        if(u instanceof Nexus&&!u.alive){nx=u.x;ny=u.y;break;}
      }
    }
    if(nx===null&&typeof barSprites!=='undefined'){
      for(const [u] of barSprites){
        if(u instanceof Nexus&&!u.alive){nx=u.x;ny=u.y;break;}
      }
    }
    if(nx===null&&typeof GAME!=='undefined'&&GAME.winner!==undefined){
      const loser=GAME.winner===BLUE?RED:BLUE;
      nx=loser===BLUE?2000:12820;
      ny=loser===BLUE?12820:2000;
    }
    if(nx!==null){camCtl.x=nx;camCtl.y=ny;}
  }
  if(typeof state!=='undefined'&&state===STATES.MENU)ART.endBeatFired=false;
};

/* ---- 18. frame override v2: hit-stop + new systems in the loop ---------- */
/* Re-declares the round-2 frame(): adds hit-stop time scaling, damage
   numbers, tower warnings, kill feed, end beat. Everything else identical. */
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-lastT3)/1000);
  lastT3=now;
  /* hit-stop: brief time dip on the player's heavy hits (cosmetic) */
  if(ART.hitStop>0){
    ART.hitStop-=dt;
    dt*=0.35;
  }
  update(dt);
  if(player&&state===STATES.PLAYING){
    camCtl.x+=(player.x-camCtl.x)*Math.min(1,dt*8);
    camCtl.y+=(player.y-camCtl.y)*Math.min(1,dt*8);
    const edge=26,panSpd=1500*dt/camCtl.zoom;
    if(mouse.x<edge)camCtl.x-=panSpd;
    if(mouse.x>W-edge)camCtl.x+=panSpd;
    if(mouse.y<edge)camCtl.y-=panSpd;
    if(mouse.y>H-edge)camCtl.y+=panSpd;
    if(keys['a'])camCtl.x-=panSpd;
    if(keys['d'])camCtl.y+=panSpd;
    if(keys['w'])camCtl.y-=panSpd*0.8;
    if(keys['s'])camCtl.y+=panSpd*0.8;
    camCtl.x=clamp(camCtl.x,300,MAPW-300);
    camCtl.y=clamp(camCtl.y,300,MAPW-300);
  }
  updateCamera(dt);
  for(const u of units){unitMesh(u);}
  pruneMeshes();
  animateUnits(dt,now/1000);
  syncBars();
  syncProjectiles();
  syncParticles(dt);
  ART.stepDmgNums(dt);
  ART.stepTowerWarn(dt);
  ART.stepEndBeat();
  /* art vfx lifecycle (round-2 code, unchanged) */
  for(let i=vfxList.length-1;i>=0;i--){
    const v=vfxList[i];
    v.life-=dt;
    const m=v.mesh;
    if(v.spark){
      m.position.x+=(m.userData.vx||0)*dt;
      m.position.y+=(m.userData.vy||0)*dt;m.userData.vy-=900*dt;
      m.position.z+=(m.userData.vz||0)*dt;
      m.rotation.x+=dt*7;m.rotation.y+=dt*5;
      if(m.position.y<2)m.position.y=2;
    } else if(v.debris){
      m.position.x+=(m.userData.vx||0)*dt;
      m.position.y+=(m.userData.vy||0)*dt;m.userData.vy-=1500*dt;
      m.position.z+=(m.userData.vz||0)*dt;
      m.rotation.x+=(m.userData.spin||3)*dt;m.rotation.z+=(m.userData.spin||2)*dt;
      if(m.position.y<8){m.position.y=8;m.userData.vx*=0.3;m.userData.vz*=0.3;m.userData.vy=0;}
    } else if(v.flash){
      m.scale.setScalar(1+(0.4-v.life)*4);
    } else if(v.glow){
      /* keep still, fade via opacity below */
    } else {
      m.material.opacity=Math.max(0,v.life*1.6);
      m.scale.setScalar(1+(0.5-v.life)*1.6);
    }
    m.material.opacity=(v.spark||v.debris)?Math.max(0,v.life*1.4):Math.max(0,v.life*1.5);
    if(v.glow)m.material.opacity=Math.max(0,v.life*1.1);
    if(v.life<=0){scene.remove(m);vfxList.splice(i,1);}
  }
  if(moveMarker&&moveMarker.userData.t>0){moveMarker.userData.t-=dt;moveMarker.material.opacity=moveMarker.userData.t*1.4;}
  renderer.render(scene,camera);
  if(state===STATES.END){drawEndScreen3D();}
  else{
    renderHUD3D();
    drawKillFeed3D();
  }
}

/* ---- 19. gold popups for last-hits (hook Minion.die) -------------------- */
(function(){

})();
