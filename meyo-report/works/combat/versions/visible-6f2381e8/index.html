   S5 HUD reskin (game typography, beveled slots, ult distinction, gold/blue
      semantic tokens) + minimap region fills
   S6 spatialized audio (stereo pan + distance falloff) + variant hits
   ============================================================================ */

/* ---------------------------- S1. render grade ---------------------------- */
/* Applied when scene exists (guard, same pattern as round-2 _artInitHook).
   R8: this USED to re-apply ACES 1.02 on top of the init-hook's NoToneMapping
   - two grades fighting. Now both sites agree with the single R8 rig policy:
   ReinhardToneMapping + exposure 1.28 + LinearEncoding output (see the 8a
   comment above for the measured blowout numbers and why a knee beats hard
   clipping). Shadow-box tightening below is kept as-is. */
ART.gradeApplied=false;
ART.applyGrade=()=>{
  if(ART.gradeApplied||!renderer)return;
  ART.gradeApplied=true;
  renderer.toneMapping=THREE.ReinhardToneMapping;
  renderer.toneMappingExposure=1.28;
  renderer.outputEncoding=THREE.LinearEncoding;   // keep — our canvas textures are authored in this space
  /* tight shadow box: base used ±9000 world units at 2048² — effective
     texel density ~8.8u/px (shadows guaranteed mush). Following the anchor
     recipe: shadows live near the ACTION. We re-frame the shadow camera
     around the map center at high density, updating position each 0.5s to
     follow the player (cheap, static-scene trick from voidfall: shadow
     autoUpdate off, manual refresh every 0.14s is overkill for our unit
     count — we do 0.5s). */
  if(typeof sun!=='undefined'&&sun&&sun.shadow&&sun.shadow.camera){
    const sc=sun.shadow.camera;
    sc.left=-2600;sc.right=2600;sc.top=2600;sc.bottom=-2600;sc.far=40000;
    sc.updateProjectionMatrix();
    sun.shadow.mapSize.set(2048,2048);
    ART._shadowFollow=true;
    if(renderer.shadowMap){renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;}
  }
  /* rim light: cool directional from behind the camera view — carves units
     out of the terrain (anchor: voidfall rim 0x546dff intensity 1.2). */
  if(typeof scene!=='undefined'&&scene&&!ART.rim){
    ART.rim=new THREE.DirectionalLight(0x6f8cff,0.32);   /* R8: accent budget */
    ART.rim.position.set(-4500,2600,-5200);
    scene.add(ART.rim);
    /* warm bounce from the opposite low side (R8: trimmed to 0.10) */
    ART.bounce=new THREE.DirectionalLight(0xffd9a0,0.10);
    ART.bounce.position.set(5200,1400,4800);
    scene.add(ART.bounce);
  }
  /* fog slightly closer: reads depth without hiding lanes */
  if(scene.fog){scene.fog.near=5200;scene.fog.far=13500;}
};
/* shadow follows the player every 0.5s (world-space sun stays, box recenters) */
ART._shadowT=0;
ART.stepGrade=(dt)=>{
  if(!ART._shadowFollow||typeof sun==='undefined'||!sun||!sun.shadow||!sun.shadow.camera)return;
  ART._shadowT+=dt;
  if(ART._shadowT<0.5)return;
  ART._shadowT=0;
  const px=(typeof player!=='undefined'&&player)?player.x:MAPW/2;
  const py=(typeof player!=='undefined'&&player)?player.y:MAPW/2;
  /* keep sun direction constant: offset position so target = player */
  sun.target.position.set(px,0,py);
  if(!sun.target.parent)scene.add(sun.target);
  sun.position.set(px+3800,6800,py+2300);
  if(renderer.shadowMap){renderer.shadowMap.needsUpdate=true;}
};

/* vignette (cinematic focus — drawn once per frame after render, cheap) */
ART.vignette=null;
ART.drawVignette=()=>{
  if(!ART.vignette){
    const c=document.createElement('canvas');c.width=512;c.height=288;
    const g=c.getContext('2d');
    const gr=g.createRadialGradient(256,144,120,256,144,330);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(0.62,'rgba(2,6,12,0.16)');
    gr.addColorStop(1,'rgba(1,4,9,0.46)');
    g.fillStyle=gr;g.fillRect(0,0,512,288);
    ART.vignette=new THREE.CanvasTexture(c);
  }
  if(!ART._vigSpr){
    ART._vigSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:ART.vignette,transparent:true,depthTest:false,depthWrite:false}));
    ART._vigSpr.renderOrder=999;
    scene.add(ART._vigSpr);
  }
  /* screen-space: stretch sprite across the frustum near plane */
  const h=2*Math.tan(camera.fov*Math.PI/360)*140;
  ART._vigSpr.scale.set(h*camera.aspect,h,1);
  ART._vigSpr.position.copy(camera.position);
  ART._vigSpr.position.add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(140));
};

/* ---------------------------- S2. hero rebuild ---------------------------- */
/* Five authored champions at voidfall-class density. Design language:
   - broad factor per hero (rook-like tank 1.22 vs assassin 0.84) — identity
     difference starts with the skeleton, not the color
   - three-material system: body (painted, low metal) + accent (emissive) +
     team (cape/ring/emblem) — team never overrides accent
   - signature weapon per hero: 8-14 parts each, on a weaponPivot group that
     attack/cast animation drives (node-hierarchy rigging, voidfall-verified
     for single-file web games)
   - animation contract preserved: {legL,legR,armL,armR,torso,head,weapon,
     cape,ring,arrow} PLUS rig subnodes ud.rig/ud.weaponPivot/ud.mantle
   Scale: game world is 14820 units; a champion reads at ~190u tall * broad. */
function buildChampionMesh(u){
  const g=new THREE.Group();
  const k=u.key;
  const teamCol=u.team===BLUE?0x2f7fe0:0xd0453a;
  const teamColSoft=u.team===BLUE?0x9fc8ff:0xffb0a0;
  /* per-hero skeleton config: broad / PROPORTION (the silhouette contrast the
     vision read demanded: tank 30-50% wider shoulders + bigger pauldrons,
     small girl slimmer with proportionally larger head) / ranged */
  const CFG={
    garen:{broad:1.28,chest:1.38,paul:1.65,head:0.90,leg:1.05,stance:1.28,
           accent:0xffd76b,accentHex:'#ffd76b',hair:0xb98a4a,skin:0xdcac7e,melee:true},
    ashe:{broad:0.90,chest:0.94,paul:0.88,head:1.02,leg:1.06,stance:1.02,
           accent:0x7fd8ff,accentHex:'#7fd8ff',hair:0xf0e6d2,skin:0xf2cba6,melee:false},
    annie:{broad:0.74,chest:0.76,paul:0.64,head:1.34,leg:0.80,stance:0.90,
           accent:0xff8a46,accentHex:'#ff8a46',hair:0xd44a20,skin:0xf4c8a8,melee:false},
    lux:{broad:0.88,chest:0.92,paul:0.96,head:1.06,leg:1.04,stance:1.0,
           accent:0xffe98a,accentHex:'#ffe98a',hair:0xe8c86a,skin:0xf4cfae,melee:false},
    yi:{broad:0.86,chest:0.96,paul:0.80,head:0.98,leg:1.08,stance:1.12,
           accent:0x9fff6a,accentHex:'#9fff6a',hair:0x2a2f3a,skin:0xe0b48c,melee:true}
  }[k]||{broad:1,chest:1,paul:1,head:1,leg:1,stance:1,
         accent:0x8ab4ff,accentHex:'#8ab4ff',hair:0x333,skin:0xd8a070,melee:true};
  const B=CFG.broad;
  const S3=1.6*B;                       // master scale — smaller heroes are LITERALLY smaller
  g.scale.setScalar(S3);

  /* palette per hero (painted canvas materials, round-3 dark-targeting kept) */
  /* brightened values (r5 software-render pixel audit: cloth at 0x223c72
     rendered rgb(10,18,34) at game lighting — heroes read as dark blobs at
     gameplay distance; anchor heroes read mid-bright) */
  const armorHex={garen:0xa8b6c8,ashe:0x6d8db0,annie:0x9a4a5c,lux:0xb09a68,yi:0x5c6c80}[k]||0x7a8494;
  const clothHex={garen:0x3a5a9e,ashe:0x3d6a9e,annie:0x7a3448,lux:0xc09a48,yi:0x2e4058}[k]||0x2c3448;
  const armorM=ART.mat(armorHex,0.42,0.62,18);
  const armorLightM=ART.mat(Math.round(armorHex*1.25)&0xffffff,0.4,0.6,16);
  const clothM=ART.mat(clothHex,0.85,0.05,0);
  const darkM=ART.mat(0x22262e,0.65,0.35,6);
  const skinM=ART.mat(CFG.skin,0.6,0,0);
  const hairM=ART.mat(CFG.hair,0.75,0.05,0);
  const trimM=new THREE.MeshStandardMaterial({color:0xd4af37,metalness:0.85,roughness:0.3});
  const accentM=new THREE.MeshStandardMaterial({color:CFG.accent,emissive:CFG.accent,emissiveIntensity:1.5,roughness:0.3});
  const teamM=new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:0.3,roughness:0.6,metalness:0.3});

  /* ---------- rig root: all body nodes hang under this so attack lunge,
     cast shiver and death fall can move the whole body from ONE pivot ----- */
  const rig=new THREE.Group();
  rig.position.y=0;
  g.add(rig);

  /* ---------- legs: articulated thigh/shin/boot, hip pivots ------------- */
  const mkLeg=(side)=>{
    const leg=new THREE.Group();
    const th=B<0.9?0.8:1.06;                       // garen thick limbs, girls slim
    const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(8.5*th,20*CFG.leg,3,8),clothM);
    thigh.position.y=-12*CFG.leg;thigh.castShadow=true;
    const knee=new THREE.Mesh(new THREE.SphereGeometry(6.6*th,8,6),armorLightM);
    knee.position.y=-24*CFG.leg;
    const shin=new THREE.Mesh(new THREE.CapsuleGeometry(6.2*th,17*CFG.leg,3,8),armorM);
    shin.position.y=-33*CFG.leg;shin.castShadow=true;
    const boot=new THREE.Mesh(new THREE.BoxGeometry(11*th,8,18*CFG.leg),darkM);
    boot.position.set(0,-47*CFG.leg,3.5);boot.castShadow=true;
    /* boot cuff + accent greave line */
    const cuff=new THREE.Mesh(new THREE.CylinderGeometry(7*th,8*th,5,8),armorLightM);
    cuff.position.y=-38*CFG.leg;
    const greave=new THREE.Mesh(new THREE.BoxGeometry(2.2,14*CFG.leg,2.2),accentM);
    greave.position.set(0,-33*CFG.leg,6.4);
    leg.add(thigh,knee,shin,boot,cuff,greave);
    /* stance: garen wide, annie narrow (silhouette triangle) */
    leg.position.set(side*11*CFG.stance,58,0);
    leg.rotation.z=side*0.07;                       // legs splay outward
    return leg;
  };
  const legL=mkLeg(-1),legR=mkLeg(1);rig.add(legL,legR);

  /* ---------- hips + abdomen belt (silhouette break) -------------------- */
  const pelvis=new THREE.Mesh(new THREE.CylinderGeometry(13.5,12,10,10),clothM);
  pelvis.position.y=53;pelvis.castShadow=true;rig.add(pelvis);
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(13.6,13,6,10),darkM);
  belt.position.y=58;
  const buckle=new THREE.Mesh(new THREE.BoxGeometry(9,7,3.4),trimM);
  buckle.position.set(0,58,12);
  /* belt side pouches x2 — real-gear clutter */
  for(const s of [-1,1]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(6,7,5),darkM);
    p.position.set(s*13,56,2);rig.add(p);
  }
  rig.add(belt,buckle);

  /* ---------- torso: chest + abs + shoulder yoke, V-taper --------------- */
  /* chest width is THE hero read (tank 30-50% wider); waist stays put so
     V-taper sharpens instead of the whole body inflating uniformly */
  const chestW=16.5*CFG.chest,waistW=12.5/Math.sqrt(CFG.chest);
  const chest=new THREE.Mesh(new THREE.CylinderGeometry(chestW,13,26,10),armorM);
  chest.position.y=82;chest.castShadow=true;
  const chestPlate=new THREE.Mesh(new THREE.BoxGeometry(22*CFG.chest,14,6),armorLightM);
  chestPlate.position.set(0,88,12.5);chestPlate.castShadow=true;
  const abs=new THREE.Mesh(new THREE.CylinderGeometry(waistW,11,16,10),clothM);
  abs.position.y=64;abs.castShadow=true;
  const collar=new THREE.Mesh(new THREE.TorusGeometry(8,2.4,6,12),trimM);
  collar.position.y=99;collar.rotation.x=Math.PI/2;
  rig.add(chest,chestPlate,abs,collar);

  /* ---------- per-hero chest sigil (accent emissive) -------------------- */
  const sigil={
    garen:()=>{const s=new THREE.Group();
      const mark=new THREE.Mesh(new THREE.OctahedronGeometry(5,0),trimM);
      s.add(mark);return s;},                              // neutral geometric role emblem
    ashe:()=>{const s=new THREE.Group();
      const arr=new THREE.Mesh(new THREE.ConeGeometry(3.4,10,3),accentM);
      arr.rotation.z=-Math.PI/2;s.add(arr);return s;},      // arrowhead
    annie:()=>{const s=new THREE.Group();
      const f=new THREE.Mesh(new THREE.IcosahedronGeometry(4.4,0),accentM);s.add(f);return s;},
    lux:()=>{const s=new THREE.Group();
      const st=new THREE.Mesh(new THREE.OctahedronGeometry(4.6),accentM);
      const halo=new THREE.Mesh(new THREE.TorusGeometry(6.4,0.9,6,14),trimM);
      halo.rotation.x=Math.PI/2.3;s.add(st,halo);return s;},
    yi:()=>{const s=new THREE.Group();
      const r1=new THREE.Mesh(new THREE.TorusGeometry(5.4,1.2,6,12),accentM);
      const r2=new THREE.Mesh(new THREE.TorusGeometry(3,1,6,10),accentM);
      s.add(r1,r2);return s;}                               // double hoop
  }[k]();
  sigil.position.set(0,88,15.5);rig.add(sigil);

  /* ---------- arms: 2-segment + gauntlet + elbow guard ------------------ */
  /* negative space: upper arm angles OUT from the shoulder (rotation.z),
     forearm angles back in — elbows clear the torso silhouette */
  const mkArm=(side)=>{
    const arm=new THREE.Group();
    const ah=B<0.9?0.78:1.05;                     // arm thickness follows build
    const up=new THREE.Mesh(new THREE.CapsuleGeometry(6*ah,15,3,8),clothM);
    up.position.y=-8;up.castShadow=true;
    const elbow=new THREE.Mesh(new THREE.SphereGeometry(5.4*ah,8,6),armorLightM);
    elbow.position.y=-17;
    const fore=new THREE.Mesh(new THREE.CapsuleGeometry(5.2*ah,13,3,8),armorM);
    fore.position.y=-25;fore.castShadow=true;
    const fist=new THREE.Mesh(new THREE.BoxGeometry(8*ah+2,8*ah+2,8*ah+2),armorM);
    fist.position.y=-35;
    /* vambrace accent stripe */
    const vam=new THREE.Mesh(new THREE.CylinderGeometry(5.6*ah,5.8*ah,5,8),accentM);
    vam.position.y=-29;
    arm.add(up,elbow,fore,fist,vam);
    arm.position.set(side*(20+7*CFG.chest),88,0);
    arm.rotation.z=side*-(0.30+0.12*CFG.chest);   // shoulder out
    fore.rotation.z=side*0.42;                    // elbow bends back in
    return arm;
  };
  const armL=mkArm(-1),armR=mkArm(1);rig.add(armL,armR);

  /* ---------- pauldrons: layered angular armor (R6: no more ball domes) ---
     Real photos flagged the spherical domes as the #1 toy-read. LoL pauldrons
     are ANGULAR layered plates that flare OUT (wide shoulder line), not ball
     joints. Build: 2-3 stacked flared plates (open half-cones, sheared) +
     rim band + team band + optional spike. */
  const paulSize=({garen:13,ashe:8.5,annie:6.5,lux:9,yi:7.5}[k]||9)*CFG.paul;
  const mkPauldron=(side)=>{
    const p=new THREE.Group();
    /* three overlapping flared plates, each smaller + higher + tilted more —
       reads as forged scale armor from every angle, no sphere silhouette */
    const plates=[
      [paulSize*1.30,paulSize*1.02,0,-0.16],
      [paulSize*1.02,paulSize*0.78,paulSize*0.42,-0.30],
      [paulSize*0.74,paulSize*0.52,paulSize*0.80,-0.46]
    ];
    plates.forEach(([rt,rb,yy,tilt],i)=>{
      const seg=new THREE.Mesh(
        new THREE.CylinderGeometry(rt,rb,paulSize*0.62,7,1,true,i?Math.PI*0.15:0,Math.PI*1.5),
        i===1?armorLightM:armorM);
      seg.position.set(side*paulSize*0.30,yy,0);
      seg.rotation.z=side*(tilt-0.5);seg.rotation.y=side*-0.35;
      seg.castShadow=(i===0);p.add(seg);
      /* hard seam ridge between plates (kills the continuous-curvature ball read) */
      if(i<2){
        const seam=new THREE.Mesh(new THREE.TorusGeometry(rt*0.97,1.0,5,7),trimM);
        seam.rotation.x=Math.PI/2;
        seam.position.set(side*paulSize*0.30,yy+paulSize*0.31,0);
        seam.scale.z=0.7;p.add(seam);
      }
    });
    /* knuckle cap: low-poly angular cap, NOT a sphere (flatter top, faceted) */
    const capM=new THREE.Mesh(new THREE.OctahedronGeometry(paulSize*0.62,0),armorLightM);
    capM.scale.set(1.3,0.62,1.12);
    capM.position.set(side*paulSize*0.42,paulSize*0.88,0);
    capM.rotation.y=side*0.5;p.add(capM);
    /* crest ridge along the top (a forged center spine — hard highlight line) */
    const crest=new THREE.Mesh(new THREE.ConeGeometry(paulSize*0.16,paulSize*0.9,4),trimM);
    crest.position.set(side*paulSize*0.42,paulSize*1.14,0);
    crest.rotation.z=side*-0.35;crest.scale.z=0.6;p.add(crest);
    /* rim band under lowest plate (forged edge) */
    const rim=new THREE.Mesh(new THREE.TorusGeometry(paulSize*1.16,1.15,5,7),trimM);
    rim.rotation.x=Math.PI/2;rim.position.set(side*paulSize*0.30,-paulSize*0.18,0);
    rim.scale.z=0.72;p.add(rim);
    const spike=(k==='garen'||k==='yi')?
      new THREE.Mesh(new THREE.ConeGeometry(1.9,paulSize*1.05,4),trimM):null;
    if(spike){spike.position.set(side*paulSize*0.44,paulSize*1.35,0);spike.rotation.z=side*-0.22;}
    const teamBand=new THREE.Mesh(new THREE.TorusGeometry(paulSize*0.8,1.05,5,8),teamM);
    teamBand.rotation.x=Math.PI/2;teamBand.position.set(side*paulSize*0.30,paulSize*0.30,0);
    teamBand.scale.z=0.6;p.add(teamBand);
    if(spike)p.add(spike);
    /* pauldrons ride OUT on the shoulder line — the shoulder span IS the tank read */
    p.position.set(side*(21+10*CFG.chest),97,0);
    p.rotation.z=side*-0.18;
    return p;
  };
  rig.add(mkPauldron(-1),mkPauldron(1));

  /* ---------- head group: neck + skull + authored headgear -------------- */
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(4.8,6,7,8),skinM);neck.position.y=101;rig.add(neck);
  const head=new THREE.Group();
  const HS=CFG.head;                          // annie 1.30: child proportions
  const skull=new THREE.Mesh(new THREE.SphereGeometry(10.5*HS,14,12),skinM);skull.castShadow=true;
  /* face plane hint: eyes as accent slivers (reads at distance) */
  const eyeM=CFG.melee?accentM:accentM;
  const eyeL=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.4,1),eyeM);eyeL.position.set(-3.6,1.4,9.6);
  const eyeR=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.4,1),eyeM);eyeR.position.set(3.6,1.4,9.6);
  head.add(skull,eyeL,eyeR);
  if(k==='garen'){
    const helm=new THREE.Mesh(new THREE.SphereGeometry(11.8,14,10,0,Math.PI*2,0,Math.PI*0.62),armorM);
    helm.position.y=1;helm.rotation.x=-0.12;head.add(helm);
    const mohawk=new THREE.Mesh(new THREE.ConeGeometry(2.6,9,4),trimM);
    mohawk.position.set(0,10,-2);mohawk.scale.z=2.4;head.add(mohawk);
    const nose=new THREE.Mesh(new THREE.BoxGeometry(3,8,2.6),armorM);nose.position.set(0,-1,10.4);head.add(nose);
    const visor=new THREE.Mesh(new THREE.BoxGeometry(13,2.2,2),darkM);visor.position.set(0,0.8,10.8);head.add(visor);
    /* wing motifs on helm sides */
    for(const s of [-1,1]){
      const wing=new THREE.Mesh(new THREE.BoxGeometry(5,2.2,1.2),trimM);
      wing.position.set(s*11,4,0);wing.rotation.z=s*0.5;head.add(wing);
    }
  } else if(k==='ashe'){
    const hood=new THREE.Mesh(new THREE.SphereGeometry(11.8,12,10,0,Math.PI*2,0,Math.PI*0.6),ART.mat(0x24486e,0.8,0.1,0));
    hood.position.y=1.5;head.add(hood);
    /* headdress: center braid + side braids (3 capsules) */
    const braid=new THREE.Mesh(new THREE.CapsuleGeometry(2.4,18,3,6),hairM);
    braid.position.set(0,-6,-8);braid.rotation.x=0.5;head.add(braid);
    for(const s of [-1,1]){
      const b=new THREE.Mesh(new THREE.CapsuleGeometry(2,14,3,6),hairM);
      b.position.set(s*8,-8,-4);b.rotation.z=s*0.3;head.add(b);
    }
    /* frost crown: tiara arc + gem */
    const tiara=new THREE.Mesh(new THREE.TorusGeometry(9.4,1,6,16,Math.PI),trimM);
    tiara.position.y=5;tiara.rotation.z=Math.PI;head.add(tiara);
    const gem=new THREE.Mesh(new THREE.OctahedronGeometry(2.6),accentM);
    gem.position.set(0,9,2);head.add(gem);
  } else if(k==='annie'){
    const hair=new THREE.Mesh(new THREE.SphereGeometry(12,12,10,0,Math.PI*2,0,Math.PI*0.7),hairM);
    hair.position.y=0.8;head.add(hair);
    /* twin front curls + big side bows */
    for(const s of [-1,1]){
      const curl=new THREE.Mesh(new THREE.SphereGeometry(4.4,8,6),hairM);
      curl.position.set(s*9,3,6);head.add(curl);
      const bow=new THREE.Mesh(new THREE.TorusKnotGeometry(3,1,16,4),ART.emissive(0xff5522,0.5));
      bow.position.set(s*10.5,6,2);bow.rotation.y=s*0.6;head.add(bow);
    }
    const fringe=new THREE.Mesh(new THREE.BoxGeometry(14,3,4),hairM);
    fringe.position.set(0,7,7.6);head.add(fringe);
  } else if(k==='lux'){
    const hair=new THREE.Mesh(new THREE.SphereGeometry(11.8,12,10,0,Math.PI*2,0,Math.PI*0.58),hairM);
    hair.position.y=1;head.add(hair);
    /* long twin-tails + side buns */
    for(const s of [-1,1]){
      const tail=new THREE.Mesh(new THREE.CapsuleGeometry(3.6,22,3,6),hairM);
      tail.position.set(s*9,-12,-4);tail.rotation.z=s*0.24;head.add(tail);
      const bun=new THREE.Mesh(new THREE.SphereGeometry(3,8,6),hairM);
      bun.position.set(s*8.5,7,-3);head.add(bun);
    }
    const circlet=new THREE.Mesh(new THREE.TorusGeometry(9.6,0.9,6,16),trimM);
    circlet.position.y=5.6;circlet.rotation.x=0.28;head.add(circlet);
    const cg=new THREE.Mesh(new THREE.ConeGeometry(2.2,7,4),accentM);
    cg.position.set(0,10,2);head.add(cg);
  } else {  // yi
    const hood=new THREE.Mesh(new THREE.SphereGeometry(11.8,12,10,0,Math.PI*2,0,Math.PI*0.72),darkM);
    hood.position.y=1;head.add(hood);
    /* seven-visor goggles: lens band with 3 accent cells */
    const band=new THREE.Mesh(new THREE.BoxGeometry(16,4.6,4),armorM);
    band.position.set(0,1,9);head.add(band);
    for(let i=-1;i<=1;i++){
      const lens=new THREE.Mesh(new THREE.BoxGeometry(3.6,2.6,1.6),accentM);
      lens.position.set(i*5,1,11);head.add(lens);
    }
    /* topknot sash tail */
    const sash=new THREE.Mesh(new THREE.BoxGeometry(3,20,2),ART.mat(0x8a2a2a,0.8,0,0));
    sash.position.set(0,4,-9);sash.rotation.x=-0.4;head.add(sash);
  }
  head.position.y=110;head.scale.setScalar(1);head.castShadow=true;
  head.scale.setScalar(HS);head.position.y=108+2*HS;
  rig.add(head);

  /* ---------- cape / cloak: per-hero shape ------------------------------ */
  let cape=null,mantleL=null,mantleR=null;
  if(k==='garen'||k==='lux'){
    cape=new THREE.Mesh(new THREE.PlaneGeometry(30,58,1,4),ART.capeMat(teamCol));
    cape.position.set(0,72,-17);cape.castShadow=true;rig.add(cape);
    /* shoulder mantle flaps */
    for(const s of [-1,1]){
      const m=new THREE.Mesh(new THREE.BoxGeometry(12,18,3),ART.capeMat(teamCol));
      m.position.set(s*20,88,-11);m.rotation.z=s*0.28;rig.add(m);
    }
  } else if(k==='ashe'){
    cape=new THREE.Mesh(new THREE.PlaneGeometry(26,50,1,3),ART.capeMat(0x24486e));
    cape.position.set(0,70,-16);cape.castShadow=true;rig.add(cape);
    const hoodCape=new THREE.Mesh(new THREE.BoxGeometry(20,10,3),ART.mat(0x24486e,0.8,0.1,0));
    hoodCape.position.set(0,98,-12);rig.add(hoodCape);
  } else if(k==='annie'){
    cape=new THREE.Mesh(new THREE.PlaneGeometry(24,44,1,3),ART.capeMat(0x8a2030));
    cape.position.set(0,68,-15);cape.castShadow=true;rig.add(cape);
    /* cape collar */
    const collarC=new THREE.Mesh(new THREE.TorusGeometry(10,3,6,12),ART.mat(0x8a2030,0.8,0,0));
    collarC.position.y=100;collarC.rotation.x=Math.PI/2;rig.add(collarC);
  } else {  // yi — no cape, back sash
    const sashB=new THREE.Mesh(new THREE.BoxGeometry(6,54,3),ART.mat(0x8a2a2a,0.8,0,0));
    sashB.position.set(4,74,-13);sashB.rotation.z=0.2;rig.add(sashB);
    const beltS=new THREE.Mesh(new THREE.BoxGeometry(26,5,3),darkM);
    beltS.position.set(0,60,-13);rig.add(beltS);
  }
  mantleL=mantleR=null;

  /* ---------- signature weapons on weaponPivot -------------------------- */
  const weaponPivot=new THREE.Group();
  weaponPivot.position.set(26,76,6);      // in the right hand
  weaponPivot.rotation.z=-0.16;           // held canted OUT — weapon clears the body
  let weapon=new THREE.Group();
  if(k==='garen'){
    /* greatsword, 125% body height: broad blade + full crossguard reads first */
    const blade=new THREE.Mesh(new THREE.BoxGeometry(11,104,4),ART.mat(0x9aa8bc,0.24,0.9,26));
    blade.position.y=54;blade.castShadow=true;
    const fuller=new THREE.Mesh(new THREE.BoxGeometry(2.4,96,4.4),ART.mat(0x6a788c,0.3,0.85,20));
    fuller.position.y=52;
    const tip=new THREE.Mesh(new THREE.ConeGeometry(6,16,4),ART.mat(0xb8c4d6,0.22,0.9,20));
    tip.position.y=114;tip.rotation.y=Math.PI/4;
    const guardW1=new THREE.Mesh(new THREE.BoxGeometry(13,4,4.4),trimM);guardW1.position.set(-11,-3,0);guardW1.rotation.z=0.55;
    const guardW2=guardW1.clone();guardW2.position.x=11;guardW2.rotation.z=-0.55;
    const guard=new THREE.Mesh(new THREE.BoxGeometry(8,4.8,5.4),trimM);guard.position.y=-3;
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(3,3,16,8),darkM);grip.position.y=-12;
    const pom=new THREE.Mesh(new THREE.OctahedronGeometry(4.2),trimM);pom.position.y=-21;
    const pomGem=new THREE.Mesh(new THREE.OctahedronGeometry(2.1),accentM);pomGem.position.y=-21;pomGem.scale.setScalar(0.6);
    weapon.add(blade,fuller,tip,guard,guardW1,guardW2,grip,pom,pomGem);
    weapon.rotation.z=-0.26;
  } else if(k==='ashe'){
    /* greatbow taller than torso: strong C-curve, held to clear the body */
    const bowR=42;
    const bowArc=new THREE.Mesh(new THREE.TorusGeometry(bowR,3.4,8,26,Math.PI*1.25),ART.mat(0x5a9ec8,0.32,0.45,10));
    bowArc.rotation.z=Math.PI*0.62;
    const bowArc2=new THREE.Mesh(new THREE.TorusGeometry(bowR,1.8,6,26,Math.PI*1.25),accentM);
    bowArc2.rotation.z=Math.PI*0.62;bowArc2.scale.setScalar(1.02);
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.8,16,8),darkM);
    const string=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,74,4),new THREE.MeshBasicMaterial({color:0xe8f4ff}));
    string.position.y=0;string.position.x=21;string.rotation.z=0.62;
    const iceGem=new THREE.Mesh(new THREE.OctahedronGeometry(6.4),accentM);
    iceGem.position.set(-2,0,0);
    ART.addGlow(weapon,CFG.accent,32,0);
    weapon.add(bowArc,bowArc2,grip,string,iceGem);
    weapon.rotation.z=Math.PI/2;
    weapon.rotation.y=0.5;                          // C opens toward camera, not flat
  } else if(k==='annie'){
    /* pyromancer staff: gnarled wood + BIG fire orb + orbiting flame rings */
    const staff=new THREE.Mesh(new THREE.CylinderGeometry(2.6,3.4,70,8),ART.mat(0x3a2c1e,0.85,0,4));
    staff.position.y=18;
    const staffTop=new THREE.Mesh(new THREE.TorusGeometry(5,1.2,6,10),darkM);
    staffTop.position.y=52;staffTop.rotation.x=Math.PI/2;
    const orb=new THREE.Mesh(new THREE.SphereGeometry(14,14,12),ART.emissive(0xff7a3d,2.0));
    orb.position.y=64;
    ART.addGlow(weapon,0xff7a3d,48,64);
    const flameRing=new THREE.Mesh(new THREE.TorusGeometry(19,2,6,18),ART.emissive(0xffaa44,1.4));
    flameRing.position.y=64;flameRing.rotation.x=Math.PI/2.4;
    const flameRing2=new THREE.Mesh(new THREE.TorusGeometry(14,1.4,6,14),ART.emissive(0xffd76b,1.2));
    flameRing2.position.y=64;flameRing2.rotation.x=Math.PI/1.8;flameRing2.rotation.y=0.5;
    /* 3 orbit flame cones (animated in animateUnits via ud.orbiters) */
    const orbiters=[];
    for(let i=0;i<3;i++){
      const f=new THREE.Mesh(new THREE.ConeGeometry(3,10,4),ART.emissive(0xff8a46,1.6));
      f.position.y=64;weapon.add(f);orbiters.push(f);
    }
    weapon.add(staff,staffTop,orb,flameRing,flameRing2);
    weapon.userData.orbiters=orbiters;
  } else if(k==='lux'){
    /* lightstaff: gilt shaft, wing brackets, prismatic core + halo ring */
    const staff=new THREE.Mesh(new THREE.CylinderGeometry(2.8,3.6,96,8),ART.mat(0xa08438,0.4,0.65,12));
    const wing1=new THREE.Mesh(new THREE.BoxGeometry(18,4,2),trimM);wing1.position.set(-9,44,0);wing1.rotation.z=0.55;
    const wing2=wing1.clone();wing2.position.x=9;wing2.rotation.z=-0.55;
    const gem=new THREE.Mesh(new THREE.OctahedronGeometry(15),ART.emissive(0xffe98a,2.1));
    gem.position.y=62;
    ART.addGlow(weapon,0xffe98a,52,62);
    const ringB=new THREE.Mesh(new THREE.TorusGeometry(19,1.4,6,20),ART.emissive(0xfff3c4,1.5));
    ringB.position.y=62;ringB.rotation.x=Math.PI/2.2;
    const ringC=new THREE.Mesh(new THREE.TorusGeometry(14,1,6,16),ART.emissive(0xffffff,1.2));
    ringC.position.y=62;ringC.rotation.x=Math.PI/1.7;ringC.rotation.y=0.6;
    const shaftTip=new THREE.Mesh(new THREE.ConeGeometry(3.4,10,6),trimM);
    shaftTip.position.y=-50;
    weapon.add(staff,wing1,wing2,gem,ringB,ringC,shaftTip);
  } else {  // yi
    /* twin longsabers: blade+edge glow+disc guard, second saber reversed */
    const mkSaber=(flip)=>{
      const s=new THREE.Group();
      const blade=new THREE.Mesh(new THREE.BoxGeometry(4.4,86,2.4),ART.mat(0x7a9a6a,0.28,0.72,16));
      blade.position.y=36;blade.castShadow=true;
      const edge=new THREE.Mesh(new THREE.BoxGeometry(1.6,86,2.8),ART.emissive(0x9fff6a,1.2));
      edge.position.set(2.6,36,0);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(2.5,10,4),ART.mat(0x9aba8a,0.28,0.7,12));
      tip.position.y=84;
      const guard=new THREE.Mesh(new THREE.TorusGeometry(5.8,1.7,6,12),darkM);
      guard.rotation.x=Math.PI/2;guard.position.y=-7;
      const grip=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,13,8),darkM);grip.position.y=-15;
      s.add(blade,edge,tip,guard,grip);
      if(flip)s.rotation.z=Math.PI;
      return s;
    };
    weapon.add(mkSaber(false));
    /* offhand saber: mirrored across the body plane, tilted so BOTH blade
       glows flank the torso — an X of green light around the champion */
    const off=mkSaber(false);
    off.position.set(-22,2,20);off.rotation.z=0.55;off.rotation.x=-0.25;
    weapon.add(off);
    weapon.rotation.z=-0.28;                                // main saber cants out
  }
  weapon.castShadow=true;
  weaponPivot.add(weapon);
  rig.add(weaponPivot);

  /* ---------- ground ring + player marker + facing arrow --------------- */
  const ring=new THREE.Mesh(new THREE.RingGeometry(30,42,36),
    new THREE.MeshBasicMaterial({color:teamCol,transparent:true,opacity:0.8,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.6;g.add(ring);
  const arrow=new THREE.Mesh(new THREE.ConeGeometry(6,14,4),
    new THREE.MeshBasicMaterial({color:teamColSoft}));
  arrow.rotation.x=Math.PI/2;arrow.position.set(0,1.4,44);g.add(arrow);
  if(u.isPlayer){
    const sel=new THREE.Mesh(new THREE.RingGeometry(38,45,32),
      new THREE.MeshBasicMaterial({color:0xffd76b,transparent:true,opacity:0.9,side:THREE.DoubleSide}));
    sel.rotation.x=-Math.PI/2;sel.position.y=0.7;g.add(sel);
    const chevM=new THREE.MeshBasicMaterial({color:0xffd76b,transparent:true,opacity:0.95,depthTest:false});
    const chev=new THREE.Mesh(new THREE.ConeGeometry(9,16,4),chevM);
    chev.rotation.x=Math.PI;chev.position.set(0,225,0);g.add(chev);
    const glow=ART.addGlow(g,0xffd76b,42,225);glow.material.opacity=0.5;
  }
  /* contact blob shadow (vision read: "units don't pop off the ground") */
  const blob=new THREE.Mesh(new THREE.CircleGeometry(26,20),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.34,depthWrite:false}));
  blob.rotation.x=-Math.PI/2;blob.position.y=0.35;g.add(blob);

  g.userData={
    legL,legR,armL,armR,torso:chest,head,weapon,cape,ring,arrow,
    rig,weaponPivot,sigil,offhand:null,
    broad:B,melee:CFG.melee,accentHex:CFG.accentHex,
    walkTime:Math.random()*8,attackKick:0,attackMax:CFG.melee?0.34:0.22,castKick:0,
    phase:Math.random()*10,baseY:0,art:true,r5:true
  };
  return g;
}

/* ---------------------------- S3. tower rebuild --------------------------- */
/* Anchor recipe (voidfall tower GLB, 3,484 tris/25 parts): stepped gold base,
   9-vertex cone shaft, THREE armor bands (the plated-health visualization),
   balcony torus, crown, BIG rotating crystal with bob, 4 spikes, 4 buttresses,
   crown wings, pulse ring. Our scale: map 14820u, tower ~250u tall. */
function buildTowerMesh(u){
  const g=new THREE.Group();
  const teamCol=u.team===BLUE?0x3a8fe8:0xe0503a;
  const isNexusT=(u.rank===3);
  const stone=ART.mat(0x49546c,0.82,0.18,10);
  const stoneDark=ART.mat(0x333c52,0.88,0.14,8);
  const stoneLight=ART.mat(0x5d6a88,0.72,0.24,14);
  const goldM=new THREE.MeshStandardMaterial({color:0xc9a23f,metalness:0.78,roughness:0.34});
  const crystalM=new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:1.7,roughness:0.25});
  const bandM=new THREE.MeshStandardMaterial({color:0x8a97a8,metalness:0.7,roughness:0.38});

  /* stepped base: 3 tiers (anchor: gold step ring between tiers) */
  const b1=new THREE.Mesh(new THREE.CylinderGeometry(60,76,16,10),stoneDark);
  b1.position.y=8;b1.castShadow=true;b1.receiveShadow=true;g.add(b1);
  const goldStep1=new THREE.Mesh(new THREE.CylinderGeometry(52,60,5,10),goldM);
  goldStep1.position.y=18;g.add(goldStep1);
  const b2=new THREE.Mesh(new THREE.CylinderGeometry(48,54,12,10),stone);
  b2.position.y=26;b2.castShadow=true;g.add(b2);
  const goldStep2=new THREE.Mesh(new THREE.CylinderGeometry(42,48,4,10),goldM);
  goldStep2.position.y=33;g.add(goldStep2);

  /* 4 buttresses with gold caps */
  for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2+Math.PI/4;
    const but=new THREE.Mesh(new THREE.BoxGeometry(14,58,24),stoneDark);
    but.position.set(Math.cos(a)*56,44,Math.sin(a)*56);
    but.rotation.y=-a;but.rotation.z=0.38;but.castShadow=true;g.add(but);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(6,8,6,6),goldM);
    cap.position.set(Math.cos(a)*70,74,Math.sin(a)*70);g.add(cap);
  }

  /* tapered shaft (9-vertex cone read) */
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(24,38,92,9),stone);
  shaft.position.y=82;shaft.castShadow=true;g.add(shaft);

  /* THREE armor bands = the plated-health visualization (anchor: r1.37+tier*.06
     at y 2.25/3.45/4.55 — here mapped to shaft heights; animate to dim when
     tower hp crosses band thresholds — handled in animateUnits) */
  const bands=[];
  [112,142,172].forEach((y,i)=>{
    const band=new THREE.Mesh(new THREE.TorusGeometry(28+i*1.5,3.4,8,18),bandM);
    band.rotation.x=Math.PI/2;band.position.y=y;band.castShadow=true;g.add(band);
    /* gold stud on each band */
    for(let s=0;s<4;s++){
      const a=s/4*Math.PI*2+i*0.4;
      const stud=new THREE.Mesh(new THREE.BoxGeometry(4,5,3),goldM);
      stud.position.set(Math.cos(a)*(28+i*1.5),y,Math.sin(a)*(28+i*1.5));
      stud.rotation.y=-a;g.add(stud);
    }
    bands.push(band);
  });

  /* balcony + crown */
  const balcony=new THREE.Mesh(new THREE.TorusGeometry(30,4,8,20),stoneLight);
  balcony.rotation.x=Math.PI/2;balcony.position.y=188;balcony.castShadow=true;g.add(balcony);
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(25,20,14,9),stoneLight);
  crown.position.y=196;crown.castShadow=true;g.add(crown);
  const crownRim=new THREE.Mesh(new THREE.TorusGeometry(25,2.2,6,18),goldM);
  crownRim.rotation.x=Math.PI/2;crownRim.position.y=203;g.add(crownRim);

  /* crown wings (the tower's "shoulders" — signature voidfall silhouette) */
  for(const s of [-1,1]){
    const wing=new THREE.Mesh(new THREE.BoxGeometry(26,34,5),stoneLight);
    wing.position.set(s*38,202,0);wing.rotation.z=s*0.55;wing.castShadow=true;g.add(wing);
    const wingTrim=new THREE.Mesh(new THREE.BoxGeometry(26,5,5.4),goldM);
    wingTrim.position.set(s*38,214,0);wingTrim.rotation.z=s*0.55;g.add(wingTrim);
  }

  /* BIG crystal + focus ring + 4 prongs — crystal is the #1 read at
     gameplay distance, so it is large + strongly emissive */
  const crystal=new THREE.Mesh(new THREE.IcosahedronGeometry(24,0),crystalM);
  crystal.position.y=230;crystal.rotation.y=Math.PI/4;crystal.castShadow=true;g.add(crystal);
  const focus=new THREE.Mesh(new THREE.TorusGeometry(31,2.2,6,20),
    new THREE.MeshBasicMaterial({color:teamCol,transparent:true,opacity:0.8}));
  focus.rotation.x=Math.PI/2;focus.position.y=230;g.add(focus);
  for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2;
    const prong=new THREE.Mesh(new THREE.ConeGeometry(5.5,30,4),
      new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:0.8,roughness:0.4}));
    prong.position.set(Math.cos(a)*22,220,Math.sin(a)*22);
    prong.rotation.x=Math.sin(a)*0.35;prong.rotation.z=-Math.cos(a)*0.35;
    g.add(prong);
  }
  /* pulse halo (breathes in animateUnits) */
  const pulse=new THREE.Mesh(new THREE.TorusGeometry(44,2.6,6,24),
    new THREE.MeshBasicMaterial({color:teamCol,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false}));
  pulse.rotation.x=Math.PI/2;pulse.position.y=214;g.add(pulse);

  /* rune band around shaft mid */
  const rune=new THREE.Mesh(new THREE.CylinderGeometry(28.5,33,6,9,1,true),
    new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:1.4,side:THREE.DoubleSide,roughness:0.4}));
  rune.position.y=128;g.add(rune);

  /* barrel + muzzle (keeps Tower animation contract ud.barrel) */
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(6,6,52,8),
    new THREE.MeshStandardMaterial({color:0x161b26,metalness:0.6,roughness:0.5}));
  barrel.rotation.x=Math.PI/2;barrel.position.set(0,192,34);g.add(barrel);
  const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(8,6,10,8),
    new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:0.9,metalness:0.6,roughness:0.4}));
  muzzle.rotation.x=Math.PI/2;muzzle.position.set(0,192,58);g.add(muzzle);

  if(isNexusT){g.scale.setScalar(1.16);}  // nexus turrets read bigger
  g.userData={gem:crystal,barrel,pulse,bands,focus,crystalM,phase:Math.random()*10,art:true,r5:true};
  return g;
}

/* ---------------------------- S3b. nexus rebuild -------------------------- */
function buildNexusMesh(u){
  const g=new THREE.Group();
  const teamCol=u.team===BLUE?0x3a9fe8:0xe05a3a;
  const stone=ART.mat(0x3d4658,0.82,0.2,10);
  const goldM=new THREE.MeshStandardMaterial({color:0xc9a23f,metalness:0.78,roughness:0.34});
  /* 2-tier dais */
  const d1=new THREE.Mesh(new THREE.CylinderGeometry(96,112,20,12),stone);
  d1.position.y=10;d1.castShadow=true;d1.receiveShadow=true;g.add(d1);
  const d2=new THREE.Mesh(new THREE.CylinderGeometry(74,88,16,12),stone);
  d2.position.y=28;d2.castShadow=true;g.add(d2);
  const goldRing=new THREE.Mesh(new THREE.TorusGeometry(86,3,8,28),goldM);
  goldRing.rotation.x=Math.PI/2;goldRing.position.y=22;g.add(goldRing);
  /* 6 claw pylons (anchor: 6-claw ring r3.15) */
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const claw=new THREE.Mesh(new THREE.ConeGeometry(9,58,5),stone);
    claw.position.set(Math.cos(a)*72,54,Math.sin(a)*72);
    claw.rotation.z=-Math.cos(a)*0.34;claw.rotation.x=Math.sin(a)*0.34;
    claw.castShadow=true;g.add(claw);
    const clawGem=new THREE.Mesh(new THREE.OctahedronGeometry(6),
      new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:1.5}));
    clawGem.position.set(Math.cos(a)*82,86,Math.sin(a)*82);
    g.add(clawGem);
  }
  /* core crystal + heart + orbits */
  const core=new THREE.Mesh(new THREE.IcosahedronGeometry(48,1),
    new THREE.MeshStandardMaterial({color:0xbfe6ff,emissive:teamCol,emissiveIntensity:1.1,transparent:true,opacity:0.92,roughness:0.18}));
  core.position.y=110;core.castShadow=true;g.add(core);
  const heart=new THREE.Mesh(new THREE.IcosahedronGeometry(24,1),
    new THREE.MeshStandardMaterial({color:0xffffff,emissive:u.team===BLUE?0x9fd8ff:0xffc8b0,emissiveIntensity:2.4,roughness:0.1}));
  heart.position.y=110;g.add(heart);
  const orbits=[];
  for(let i=0;i<3;i++){
    const o=new THREE.Mesh(new THREE.TorusGeometry(62+i*14,2.2,6,26),
      new THREE.MeshStandardMaterial({color:teamCol,emissive:teamCol,emissiveIntensity:0.9,transparent:true,opacity:0.7}));
    o.position.y=110;o.rotation.x=Math.PI/2+(i-1)*0.3;g.add(o);orbits.push(o);
  }
  const shards=[];
  const shardM=new THREE.MeshStandardMaterial({color:0xdff2ff,emissive:teamCol,emissiveIntensity:1.0,transparent:true,opacity:0.85});
  for(let i=0;i<6;i++){
    const sh=new THREE.Mesh(new THREE.OctahedronGeometry(9),shardM);
    sh.position.set(Math.cos(i/6*Math.PI*2)*74,110+Math.sin(i*1.7)*20,Math.sin(i/6*Math.PI*2)*74);
    g.add(sh);shards.push(sh);
  }
  const light=new THREE.PointLight(teamCol,0.9,1600);
  light.position.y=118;g.add(light);
  g.userData={core,light,heart,shards,orbits,phase:Math.random()*10,art:true,r5:true};
  return g;
}
