/* ---------------------------- S2b. animation v2 --------------------------- */
/* Full replacement of animateUnits: node-hierarchy rig animation.
   - walkTime advances dt*(moving?9:2), legs swing sin(walkTime)*amplitude
   - attackKick drives attackArc=sin(progress*PI): melee lunges rig forward,
     weapon pivot swings -attackArc*1.08; ranged draws bow pivot back
   - castKick: weapon pivot shivers sin(castKick*PI*6)*0.35
   - tower bands dim by hp thresholds (armor plate peeling visualization)
   - annie staff orbiters + nexus orbits + inhibitor halo all live here       */
function animateUnits(dt,now){
  for(const [u,g] of meshes){
    if(!g.visible)continue;
    g.position.x=u.x+(u._sx||0);g.position.z=u.y+(u._sy||0);
    if(!(u instanceof Tower||u instanceof Nexus||u instanceof Inhibitor)){
      g.rotation.y=-u.facing+Math.PI/2;
    }
    const ud=g.userData;
    if(u instanceof Champion&&ud.rig&&ud.legL){
      const moving=(u.moveTarget&&dist(u.x,u.y,u.moveTarget.x,u.moveTarget.y)>14)||(u.attacking&&u.target&&u.target.alive);
      const attacking=u.attacking&&u.target&&u.target.alive;
      /* attack timing sync: the base attack() sets attackCd=1/totalAS on fire;
         we detect the fire edge via ud.prevCd and start attackKick */
      if(u.attackCd!==undefined){
        if(ud.prevCd===undefined)ud.prevCd=u.attackCd;
        if(u.attackCd>ud.prevCd+0.01&&ud.attackKick<=0){ud.attackKick=ud.attackMax;}
        ud.prevCd=u.attackCd;
      }
      ud.attackKick=Math.max(0,ud.attackKick-dt);
      ud.castKick=Math.max(0,ud.castKick-dt);
      const attackProgress=ud.attackKick>0?1-ud.attackKick/Math.max(0.01,ud.attackMax):0;
      const attackArc=ud.attackKick>0?Math.sin(attackProgress*Math.PI):0;
      ud.walkTime+=dt*(moving?9:2);
      const amplitude=moving?0.28:0.05;
      ud.legL.rotation.x=Math.sin(ud.walkTime)*amplitude;
      ud.legR.rotation.x=-Math.sin(ud.walkTime)*amplitude;
      ud.armL.rotation.x=-Math.sin(ud.walkTime)*amplitude*0.75;
      /* off-hand follows the weapon on attack for two-handed reads */
      if(attacking||ud.attackKick>0){
        ud.armR.rotation.x=-0.6-attackArc*0.9;
        if(!ud.melee)ud.armL.rotation.x=-1.1-attackArc*0.4;   // bow draw
      } else {
        ud.armR.rotation.x=Math.sin(ud.walkTime)*amplitude*0.75+0.12;
      }
      /* rig: bob + lunge (voidfall formula) */
      ud.rig.position.y=Math.abs(Math.sin(ud.walkTime))*(moving?3.4:1.0);
      if(ud.melee)ud.rig.position.z=-attackArc*6.5;
      ud.rig.rotation.x=ud.attackKick>0?-attackArc*0.14:0;
      ud.torso.rotation.y=ud.attackKick>0?-attackArc*0.3:(moving?Math.sin(ud.walkTime)*0.06:0);
      /* weapon pivot: melee swing arc; cast shiver overrides; idle sway */
      if(ud.castKick>0){
        ud.weaponPivot.rotation.y=Math.sin(ud.castKick*Math.PI*6)*0.35;
      } else {
        ud.weaponPivot.rotation.y=Math.sin(now*1.8+ud.phase)*0.025;
      }
      if(ud.melee)ud.weaponPivot.rotation.z=-attackArc*1.05-0.1;
      /* head look-at target when attacking (adds intent) */
      if(attacking&&u.target){
        const dx=u.target.x-u.x,dz=u.target.y-u.y;
        const rel=Math.atan2(dx,-dz)-u.facing;
        ud.head.rotation.y=Math.max(-0.7,Math.min(0.7,rel*0.5));
      } else ud.head.rotation.y*=0.9;
      /* cape sway */
      if(ud.cape){
        ud.cape.rotation.x=moving?-0.35-Math.sin(now*9+ud.phase)*0.12:-0.08+Math.sin(now*2.2+ud.phase)*0.05;
        ud.cape.rotation.z=Math.sin(now*7+ud.phase)*(moving?0.09:0.04);
      }
      /* annie orbiter flames */
      if(ud.weapon&&ud.weapon.userData&&ud.weapon.userData.orbiters){
        ud.weapon.userData.orbiters.forEach((f,i)=>{
          const a=now*2.6+i/3*Math.PI*2;
          f.position.set(Math.cos(a)*22,64+Math.sin(now*4+i)*4,Math.sin(a)*22);
          f.rotation.z=Math.cos(a)*0.6;f.rotation.x=Math.sin(a)*0.6;
        });
      }
      g.position.y=u.alive?ud.rig.position.y:0;
      if(!u.alive){
        /* death fall (voidfall deathPose recipe: fall forward + limbs splay) */
        ud.deathT=ud.deathT===undefined?0:(ud.deathT+dt);
        const t=Math.min(1,ud.deathT*2.2);
        ud.rig.rotation.x=t*1.25;
        ud.rig.position.y=-t*30;
        ud.legL.rotation.x=-0.8*t;ud.legR.rotation.x=0.5*t;
        ud.armL.rotation.x=0.6*t;ud.armR.rotation.x=-0.9*t;
      } else {ud.deathT=0;}
    }
    if(u instanceof Minion&&ud.body){
      const moving=(u.moveTarget||u.target);
      ud.body.position.y=22+(moving?Math.sin(now*10+ud.phase)*2.2:0);
      ud.body.rotation.z=moving?Math.sin(now*10+ud.phase)*0.06:0;
      if(ud.head)ud.head.position.y=44+(moving?Math.sin(now*10+ud.phase+1)*1.8:0);
    }
    if(u instanceof Tower&&ud.gem){
      ud.gem.rotation.y=now*0.8;
      ud.gem.position.y=230+Math.sin(now*2+ud.phase)*4;
      if(ud.focus)ud.focus.rotation.z=now*0.5;
      if(ud.pulse){
        const p=0.22+Math.sin(now*2.4+ud.phase)*0.12;
        ud.pulse.material.opacity=p;
        ud.pulse.scale.setScalar(1+Math.sin(now*2.4+ud.phase)*0.08);
      }
      /* armor bands dim as hp crosses plate thresholds (visual: plating peels) */
      if(ud.bands&&u.maxhp){
        const frac=u.hp/u.maxhp;
        ud.bands.forEach((b,i)=>{
          const active=frac> [0.9,0.6,0.3][i];
          b.material=active?b.userData._on||(b.userData._on=b.material):ART._bandOff||(ART._bandOff=new THREE.MeshStandardMaterial({color:0x3a4254,metalness:0.5,roughness:0.6}));
        });
      }
      if(u.lastTarget&&u.lastTarget.alive){
        const a=Math.atan2(u.lastTarget.y-u.y,u.lastTarget.x-u.x);
        ud.barrel.rotation.y=-a;
      }
    }
    if(u instanceof Inhibitor&&ud.crystal){ud.crystal.rotation.y=now*0.6;ud.crystal.position.y=64+Math.sin(now*2+ud.phase)*6;
      if(ud.halo)ud.halo.scale.setScalar(1+Math.sin(now*3+ud.phase)*0.1);}
    if(u instanceof Nexus&&ud.core){ud.core.rotation.y=now*0.5;ud.core.rotation.x=Math.sin(now*0.4)*0.2;ud.core.position.y=110+Math.sin(now*1.6+ud.phase)*8;
      if(ud.heart){ud.heart.rotation.y=-now*1.1;ud.heart.scale.setScalar(1+Math.sin(now*3+ud.phase)*0.08);}
      if(ud.orbits)ud.orbits.forEach((o,i)=>{o.rotation.z=now*(0.3+i*0.14);});
      if(ud.shards){ud.shards.forEach((sh,i2)=>{const a=now*0.6+i2/6*Math.PI*2;sh.position.set(Math.cos(a)*74,110+Math.sin(now*1.3+i2*1.7)*20,Math.sin(a)*74);sh.rotation.y=now+i2;});}
    }
    if(u.isMonster&&ud.body){ud.body.position.y=20+Math.sin(now*3+ud.phase)*3;}
    if(!u.alive){g.visible=false;}
    else{g.visible=inPlayerVision(u)||u.isPlayer;}
  }
  /* env anims */
  ART.riverTick(now);
  if(ART.motes){
    ART.motes.rotation.y=now*0.01;
    ART.motes.material.size=24+Math.sin(now*1.3)*6;
  }
}

/* ---------------------------- S4. ability aiming -------------------------- */
/* LoL casting flow: press Q/W/E/R -> world indicator appears following the
   cursor (shape per ability type: skillshot=arrow line, cone=sector,
   aoe=circle at cursor, dash=arrow, targeted=unit highlight, self=aura) ->
   LEFT-CLICK casts at that spot (Esc / right-click / re-press cancels).
   Implementation: a keydown interceptor installed after base loads. The
   base's own keydown handler still fires but tryCast is neutralized while
   aiming is active (we re-route: on cast-click we call castAbility directly
   with the aimed position). summoners D/F unchanged.                     */
const AIM={
  slot:null,            // 'Q'..'R' while aiming
  group:null,           // THREE.Group of indicator meshes
  ok:false,
  typeFor(ab){
    return ab.type;
  },
  start(slot){
    if(typeof player==='undefined'||!player||!player.alive)return false;
    const ab=player.abilities[slot];
    if(!ab||ab.cdT>0||ab.cost>player.mana)return false;
    if(ab.rank===undefined||true){/* rank gating handled by base castAbility */}
    this.clear();
    this.slot=slot;
    this.build(ab);
    if(typeof GAME!=='undefined'&&GAME.announce){/* no spam */}
    return true;
  },
  build(ab){
    if(!this.group){
      this.group=new THREE.Group();
      this.group.renderOrder=50;
      if(typeof scene!=='undefined')scene.add(this.group);
    }
    /* clear children (Array.isArray guard: headless FakeTHREE proxies return
       non-array children — do nothing there rather than spin) */
    if(Array.isArray(this.group.children)){
      while(this.group.children.length){const c=this.group.children.pop();this.group.remove(c);}
    }
    const col=0x7fd8ff;
    const matLine=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.42,side:THREE.DoubleSide,depthWrite:false});
    const matEdge=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.85,depthWrite:false});
    const matFill=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
    const gold=new THREE.MeshBasicMaterial({color:0xffd76b,transparent:true,opacity:0.9,depthWrite:false});
    const t=ab.type;
    if(t==='skillshot'){
      const len=Math.min(ab.range,3200);
      const shaft=new THREE.Mesh(new THREE.PlaneGeometry(len,ab.width||90),matFill);
      shaft.rotation.x=-Math.PI/2;shaft.position.z=-len/2;
      const headCone=new THREE.Mesh(new THREE.ConeGeometry((ab.width||90)*0.75,150,3),matEdge);
      headCone.rotation.x=-Math.PI/2;headCone.position.z=-len-40;
      this.group.add(shaft,headCone);
    } else if(t==='cone'){
      const r=ab.range;
      const geo=new THREE.CircleGeometry(r,20,-Math.PI/2-ab.arc/2,ab.arc);
      const sec=new THREE.Mesh(geo,matFill);
      sec.rotation.x=-Math.PI/2;
      const edge=new THREE.Mesh(new THREE.RingGeometry(r-14,r,20,-Math.PI/2-ab.arc/2,ab.arc),matEdge);
      edge.rotation.x=-Math.PI/2;
      this.group.add(sec,edge);
    } else if(t==='aoe'){
      const r=ab.r||240;
      const fill=new THREE.Mesh(new THREE.CircleGeometry(r,28),matFill);
      fill.rotation.x=-Math.PI/2;
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-12,r,28),matEdge);
      ring.rotation.x=-Math.PI/2;
      const center=new THREE.Mesh(new THREE.CircleGeometry(16,12),gold);
      center.rotation.x=-Math.PI/2;
      this.group.add(fill,ring,center);
    } else if(t==='dash'){
      const len=ab.range;
      const shaft=new THREE.Mesh(new THREE.PlaneGeometry(len,120),matFill);
      shaft.rotation.x=-Math.PI/2;shaft.position.z=-len/2;
      const head=new THREE.Mesh(new THREE.ConeGeometry(80,140,3),matEdge);
      head.rotation.x=-Math.PI/2;head.position.z=-len-30;
      this.group.add(shaft,head);
    } else if(t==='targeted'){
      const ring=new THREE.Mesh(new THREE.RingGeometry(ab.range-12,ab.range,40),new THREE.MeshBasicMaterial({color:0xff6a4a,transparent:true,opacity:0.5,depthWrite:false}));
      ring.rotation.x=-Math.PI/2;
      this.group.add(ring);
    } else {  // self
      const r=Math.max(160,ab.r||ab.range*0.2||180);
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-10,r,28),matEdge);
      ring.rotation.x=-Math.PI/2;
      this.group.add(ring);
    }
  },
  step(dt){
    if(!this.slot)return;
    if(typeof player==='undefined'||!player||!player.alive||typeof state!=='undefined'&&state!==STATES.PLAYING){this.clear();return;}
    const ab=player.abilities[this.slot];
    const w=screenToWorld(mouse.x,mouse.y);
    this.group.position.set(player.x,2.5,player.y);
    /* rotate toward cursor (indicator points -Z then yaw) */
    const a=Math.atan2(w.x-player.x,w.y-player.y);
    this.group.rotation.y=-a;
    if(ab.type==='aoe'){this.group.position.x=w.x;this.group.position.z=w.y;this.group.rotation.y=0;}
    this.ok=true;
  },
  cast(){
    if(!this.slot)return false;
    const slot=this.slot;
    const ab=player.abilities[slot];
    const w=screenToWorld(mouse.x,mouse.y);
    this.clear();
    if(ab.type==='targeted'){
      /* nearest enemy champion within range toward cursor (base tryCast logic) */
      let t=null,bd=1e9;
      for(const u of units){
        if(u.alive&&u.team!==player.team&&(u instanceof Champion||u instanceof Minion)){
          const d=dist(w.x,w.y,u.x,u.y);
          if(d<140&&d<bd){bd=d;t=u;}
        }
      }
      if(!t){for(const u of units){if(u.alive&&u.team!==player.team&&(u instanceof Champion||u instanceof Minion)){const d=dist(player.x,player.y,u.x,u.y);if(d<ab.range&&d<bd){bd=d;t=u;}}}}
      if(t){t._unit=true;return castAbility(player,slot,{x:t.x,y:t.y,_unit:t});}
      return false;
    }
    if(ab.type==='self'){return castAbility(player,slot,{x:player.x,y:player.y});}
    return castAbility(player,slot,{x:w.x,y:w.y});
  },
  clear(){
    this.slot=null;this.ok=false;
    if(this.group&&this.group.parent){this.group.visible=false;}
  },
  resume(){if(this.group)this.group.visible=true;}
};
/* install aiming input: intercept keydown QWER (capture phase, before base),
   and left/right click. We do NOT touch the base handlers — capture-phase
   listeners with stopPropagation give us first-pick.                         */
function installAiming(){
  if(AIM.installed)return;AIM.installed=true;
  window.addEventListener('keydown',e=>{
    const key=e.key.toLowerCase();
    if(!['q','w','e','r'].includes(key))return;
    if(e.ctrlKey||e.metaKey)return;                    // ctrl+key = learn, base handles
    if(typeof state==='undefined'||state!==STATES.PLAYING)return;
    if(typeof player==='undefined'||!player||!player.alive)return;
    if(typeof shopOpen!=='undefined'&&shopOpen)return;
    const slot=key.toUpperCase();
    if(AIM.slot===slot){AIM.clear();return;}           // re-press cancels
    if(AIM.slot){                                       // switch slot
      AIM.start(slot);
      e.stopImmediatePropagation();e.preventDefault();return;
    }
    if(AIM.start(slot)){
      e.stopImmediatePropagation();e.preventDefault(); // swallow base tryCast
    }
  },true);
  window.addEventListener('keydown',e=>{
    if(AIM.slot&&e.key==='Escape'){AIM.clear();}
  },true);
  window.addEventListener('mousedown',e=>{
    if(!AIM.slot)return;
    if(e.button===0){
      /* must not eat clicks meant for shop/surrender UI */
      if(typeof shopOpen!=='undefined'&&shopOpen)return;
      if(typeof GAME!=='undefined'&&GAME.surrenderOffer)return;
      AIM.cast();
      e.stopImmediatePropagation();e.preventDefault();
    } else if(e.button===2){
      AIM.clear();                                       // right-click cancels aim (LoL)
      e.stopImmediatePropagation();e.preventDefault();
    }
  },true);
  /* castKick on successful cast: piggyback the existing hook is inside
     installCombatHooks' castAbility wrapper — add visual kick there via AIM */
}

/* ---------------------------- S5. HUD reskin ------------------------------ */
/* Full renderHUD3D replacement: same information architecture and click
   zones (buyAt/surrender/menu untouched), new presentation layer:
   - condensed game-display font stack (Oswald/Barlow-style via installed
     fallbacks; degrade to sans) with heavy weights for numerals
   - chamfered (octagon) ability slots; R is physically larger + gold rim
   - upgrade-ready pulse, aiming-lift state, rank pips as gold dots
   - player panel: hex portrait, gradient HP with ghost trail, XP ring
   - gold/blue/red semantic tokens
   - minimap: jungle-region fills + camp dots + smoother lanes
   Keep every base function reference intact (drawShop3D etc. re-used).    */
const FONT={
  disp:(s,w)=>`${w||600} ${s}px 'Segoe UI Semibold','Arial Narrow',Arial,system-ui`,
  num:(s,w)=>`${w||700} ${s}px 'Arial Black','Segoe UI',system-ui`
};
function renderHUD3D(){
  ctx.clearRect(0,0,W,H);
  if(state===STATES.MENU){drawMenu3D();return;}
  if(!player)return;
  const GOLD='#e8bd68',BLUE_T='#75f1d2',RED_T='#ff786d',INK='rgba(5,13,20,0.86)',LINE='rgba(204,237,229,0.16)';
  /* ---- top bar: 5-column LoL grid (team K/D/A | score | timer | score | team) */
  const cx=W/2;
  ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(cx-190+14,10);ctx.lineTo(cx+190-14,10);ctx.lineTo(cx+190,24);ctx.lineTo(cx+190,62);ctx.lineTo(cx-190,62);ctx.lineTo(cx-190,24);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(232,189,104,0.42)';ctx.lineWidth=1.2;ctx.stroke();
  /* team score blocks */
  ctx.font=FONT.num(24);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=BLUE_T;ctx.fillText(kills[BLUE],cx-120,36);
  ctx.fillStyle='#cfd8e8';ctx.fillText(':',cx,36);
  ctx.fillStyle=RED_T;ctx.fillText(kills[RED],cx+120,36);
  const mm=Math.floor(gameTime/60),ss=Math.floor(gameTime%60);
  ctx.fillStyle='#e8f0ff';ctx.font=FONT.num(15,600);
  ctx.fillText(mm+':'+(ss<10?'0':'')+ss,cx,53);
  ctx.font=FONT.disp(11,600);ctx.fillStyle=GOLD;
  ctx.fillText((goldDelta>=0?'+':'')+Math.round(goldDelta)+'g',cx+165,36);
  /* team roster pips (top corners — LoL-style) */
  const roster=(team,x0,align)=>{
    let n=0;
    for(const u of units){
      if(u instanceof Champion&&u.team===team){
        const alive=u.alive;
        const x=align>0?x0+n*36:x0-n*36;
        ctx.globalAlpha=alive?1:0.38;
        /* hex slot (LoL roster read, kills the "debug number circle") */
        ctx.save();
        ctx.translate(x,26);
        ctx.beginPath();
        for(let k=0;k<6;k++){
          const a=k/6*Math.PI*2+Math.PI/6;
          const px2=Math.cos(a)*13,py2=Math.sin(a)*13;
          k?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
        }
        ctx.closePath();
        ctx.fillStyle=team===BLUE?'rgba(24,48,80,0.92)':'rgba(72,26,24,0.92)';
        ctx.fill();
        ctx.strokeStyle=team===BLUE?'rgba(90,176,255,0.9)':'rgba(255,122,106,0.9)';
        ctx.lineWidth=1.6;ctx.stroke();
        /* champion initial */
        ctx.fillStyle=alive?'#e8eef7':'#5a6274';
        ctx.font=FONT.disp(11,700);ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText((u.name||'?').slice(0,1).toUpperCase(),0,0.5);
        /* tiny hp sliver under the hex */
        const hp=Math.max(0,Math.min(1,u.hp/u.maxhp));
        ctx.fillStyle='rgba(6,10,16,0.9)';ctx.fillRect(-12,16,24,3);
        ctx.fillStyle=hp>0.45?'#4ade80':hp>0.2?'#ffd76b':'#ff5a48';
        ctx.fillRect(-12,16,24*hp,3);
        ctx.restore();
        if(!alive){ctx.strokeStyle='#5a2430';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-9,17);ctx.lineTo(x+9,35);ctx.stroke();}
        /* level badge on the corner */
        ctx.fillStyle='#0a0d15';ctx.beginPath();ctx.arc(x+10,36,6,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=GOLD;ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle=GOLD;ctx.font=FONT.num(8);ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(u.level,x+10,36.5);
        ctx.textAlign='left';ctx.textBaseline='alphabetic';
        ctx.globalAlpha=1;n++;
      }
    }
  };
  roster(BLUE,cx-330,-1);
  roster(RED,cx+330,1);

  /* ---- bottom-left: player panel (hex portrait + bars) ---- */
  const p=player;
  const px=16,py=H-140;
  ctx.fillStyle=INK;
  ctx.beginPath();ctx.moveTo(px+14,py);ctx.lineTo(px+314,py);ctx.lineTo(px+314,py+112);ctx.lineTo(px,py+112);ctx.lineTo(px,py+14);ctx.closePath();ctx.fill();
  ctx.strokeStyle=player.team===BLUE?'rgba(117,241,210,0.5)':'rgba(255,120,109,0.5)';ctx.lineWidth=2;ctx.stroke();
  /* hex portrait */
  const hx=px+46,hy=py+46,hr=36;
  const pimg=SPLASH_IMG[p.key];
  ctx.save();ctx.beginPath();
  for(let i=0;i<6;i++){const a=Math.PI/6+i/6*Math.PI*2;const X=hx+Math.cos(a)*hr,Y=hy+Math.sin(a)*hr;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.closePath();ctx.clip();
  if(pimg&&pimg.complete&&pimg.naturalWidth>0){
    const s=Math.max(hr*2/pimg.naturalWidth,hr*2/pimg.naturalHeight);
    ctx.drawImage(pimg,hx-pimg.naturalWidth*s/2,hy-pimg.naturalHeight*s/2,pimg.naturalWidth*s,pimg.naturalHeight*s);
  }else{ctx.fillStyle='#1d2740';ctx.fillRect(hx-hr,hy-hr,hr*2,hr*2);}
  ctx.restore();
  /* level badge on hex corner + XP arc */
  ctx.strokeStyle=p.champColor;ctx.lineWidth=2.5;
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=Math.PI/6+i/6*Math.PI*2;const X=hx+Math.cos(a)*hr,Y=hy+Math.sin(a)*hr;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.closePath();ctx.stroke();
  const xpn=p.xp!==undefined&&p.nextXP?p.xp/p.nextXP:0;
  ctx.strokeStyle=GOLD;ctx.lineWidth=2.4;
  ctx.beginPath();ctx.arc(hx+hr*0.8,hy+hr*0.72,13,-Math.PI/2,-Math.PI/2+xpn*Math.PI*2);ctx.stroke();
  ctx.fillStyle='#0a0d15';ctx.beginPath();ctx.arc(hx+hr*0.8,hy+hr*0.72,10.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=GOLD;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=GOLD;ctx.font=FONT.num(11);ctx.textAlign='center';ctx.fillText(p.level,hx+hr*0.8,hy+hr*0.72+0.5);
  /* name + HP numbers */
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff';ctx.font=FONT.disp(16,700);ctx.fillText(p.name,px+96,py+24);
  ctx.fillStyle='#8fa2bb';ctx.font=FONT.disp(10,500);ctx.fillText(p.role.toUpperCase()+' · LV '+p.level,px+96,py+38);
  /* HP: gradient + ghost + text inside bar (LoL style) */
  const bx=px+96,by=py+46,bw=196;
  ctx.fillStyle='rgba(0,0,0,0.66)';ctx.fillRect(bx-1,by-1,bw+2,13);
  const hpg=ctx.createLinearGradient(bx,by,bx,by+11);
  hpg.addColorStop(0,'#5ef08a');hpg.addColorStop(1,'#1f9d4d');
  ctx.fillStyle=hpg;ctx.fillRect(bx,by,bw*Math.max(0,p.hp/p.maxhp),11);
  if(p.shield>0){ctx.fillStyle='rgba(220,238,255,0.92)';ctx.fillRect(bx,by,bw*Math.min(1,p.shield/p.maxhp),4);}
  ctx.fillStyle='#eafff2';ctx.font=FONT.num(9);ctx.textAlign='right';
  ctx.fillText(Math.max(0,Math.round(p.hp))+' / '+Math.round(p.maxhp),bx+bw-4,by+9);
  /* mana */
  if(p.maxmana>0){
    ctx.fillStyle='rgba(0,0,0,0.66)';ctx.fillRect(bx-1,by+13,bw+2,9);
    const mg=ctx.createLinearGradient(bx,by+14,bx,by+21);
    mg.addColorStop(0,'#6ca8ff');mg.addColorStop(1,'#365fc0');
    ctx.fillStyle=mg;ctx.fillRect(bx,by+14,bw*(p.mana/p.maxmana),7);
    ctx.fillStyle='#dbe9ff';ctx.font=FONT.num(8);ctx.textAlign='right';
    ctx.fillText(Math.floor(p.mana),bx+bw-4,by+21);
  }
  ctx.textAlign='left';
  /* stats row: gold diamond + CS + KDA (breathing room, no overlap) */
  ctx.fillStyle=GOLD;ctx.save();ctx.translate(px+20,py+97);ctx.rotate(Math.PI/4);ctx.fillRect(-4,-4,8,8);ctx.restore();
  ctx.fillStyle=GOLD;ctx.font=FONT.num(13);ctx.textAlign='left';ctx.fillText(String(Math.floor(p.gold)),px+33,py+102);
  ctx.fillStyle='#8fa2bb';ctx.font=FONT.disp(11,600);ctx.fillText('CS '+p.cs,px+104,py+102);
  ctx.fillStyle='#e8e8f0';ctx.fillText((p.k||0)+'/'+(p.d||0)+'/'+(p.a||0),px+156,py+102);
  if(p.unspentPoints>0){
    ctx.fillStyle=GOLD;ctx.font=FONT.disp(10,700);ctx.textAlign='right';
    ctx.fillText('+'+p.unspentPoints+' PT · CTRL+Q/W/E/R',px+310,py+102);ctx.textAlign='left';
  }
  if(p.recalling){
    ctx.fillStyle='#9fd8ff';ctx.font=FONT.disp(12,700);
    ctx.fillText('RECALLING '+p.recallT.toFixed(1)+'s',px+14,py+120);
  }

  /* ---- bottom-center dock: octagon QWER with R promoted ---- */
  const dockW=142+356+18+56;
  let abx=cx-dockW/2+142;
  if(abx-142<330)abx=330+142;
  const mmLeft=W-(W<1150?150:210)-18;
  if(abx+374+56+8>mmLeft)abx=mmLeft-438;
  const aby=H-100;
  const slots=['Q','W','E','R'];
  const oct=(x,y,s,cut)=>{
    ctx.beginPath();
    ctx.moveTo(x+cut,y);ctx.lineTo(x+s-cut,y);ctx.lineTo(x+s,y+cut);ctx.lineTo(x+s,y+s-cut);
    ctx.lineTo(x+s-cut,y+s);ctx.lineTo(x+cut,y+s);ctx.lineTo(x,y+s-cut);ctx.lineTo(x,y+cut);ctx.closePath();
  };
  slots.forEach((s,i)=>{
    const ab=p.abilities[s];
    const isUlt=(s==='R');
    const size=isUlt?74:64;
    const y=aby-(isUlt?6:0);
    const x=abx+i*84+(isUlt?-4:0);
    const cd=ab.cd>0?ab.cdT/ab.cd:0;
    const rank=p.spellRanks[s]||0;
    const aiming=(AIM.slot===s);
    /* aiming lift + gold glow */
    if(aiming){
      ctx.save();ctx.shadowColor=GOLD;ctx.shadowBlur=24;
      ctx.strokeStyle=GOLD;ctx.lineWidth=3;oct(x-3,y-3,size+6,10);ctx.stroke();ctx.restore();
    }
    /* slot body: vertical gradient */
    const grad=ctx.createLinearGradient(x,y,x,y+size);
    grad.addColorStop(0,'rgba(22,61,64,0.97)');grad.addColorStop(0.72,'rgba(4,13,19,0.98)');
    ctx.fillStyle=grad;oct(x,y,size,9);ctx.fill();
    ctx.strokeStyle=rank===0?'#2c3644':(cd>0?'#5a657a':(isUlt?GOLD:p.champColor));
    ctx.lineWidth=isUlt?2.6:2;oct(x,y,size,9);ctx.stroke();
    /* icon glyph (base-drawn, reused) */
    ctx.save();ctx.translate(x+size/2,y+size/2+2);
    ctx.fillStyle=p.champColor;ctx.globalAlpha=rank===0?0.35:0.95;
    drawAbilityGlyph3D(s,ab);
    ctx.restore();
    /* cooldown wipe (bottom-up fill — LoL style) */
    if(cd>0){
      ctx.save();oct(x,y,size,9);ctx.clip();
      ctx.fillStyle='rgba(0,0,0,0.72)';
      ctx.fillRect(x,y+size*(1-cd),size,size*cd);
      ctx.restore();
      ctx.fillStyle='#fff';ctx.font=FONT.num(19);ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(Math.ceil(ab.cdT),x+size/2,y+size/2+1);ctx.textBaseline='alphabetic';
    }
    /* upgrade-ready pulse */
    if(p.unspentPoints>0&&rank<5&&rank>0||p.unspentPoints>0&&rank===0&&p.level>1){
      const pulse=0.5+0.5*Math.sin(performance.now()/300);
      ctx.strokeStyle=`rgba(232,189,104,${0.35+pulse*0.5})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x+size-9,y+9,7,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=GOLD;ctx.font=FONT.num(10);ctx.textAlign='center';
      ctx.fillText('+',x+size-9,y+13);
    }
    /* rank pips: gold dots right column */
    for(let r2=0;r2<Math.min(5,(s==='R'?3:5));r2++){
      ctx.fillStyle=r2<rank?GOLD:'rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.arc(x+size-8-r2*0,y+size-8,2.4,0,Math.PI*2);ctx.fill();
    }
    if(rank===0){ctx.fillStyle='rgba(0,0,0,0.55)';oct(x,y,size,9);ctx.fill();}
    /* key label chip */
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(x+2,y-13,18,13);
    ctx.strokeStyle='rgba(204,237,229,0.25)';ctx.lineWidth=1;ctx.strokeRect(x+2,y-13,18,13);
    ctx.fillStyle='#eef4ff';ctx.font=FONT.num(10);ctx.textAlign='center';
    ctx.fillText(s,x+11,y-3);
    /* mana cost */
    if(ab.cost>0){ctx.fillStyle='#7fb3e8';ctx.font=FONT.disp(9,600);ctx.fillText(ab.cost,x+size/2,y+size+11);}
    /* range indicator when aiming: range ring on the world (one at a time) */
  });
  /* aim hint text */
  if(AIM.slot){
    ctx.fillStyle=GOLD;ctx.font=FONT.disp(11,700);ctx.textAlign='center';
    ctx.fillText('CLICK TO CAST '+AIM.slot+'  ·  RIGHT-CLICK CANCEL',cx,aby-84);
  }
  /* ---- summoners D/F (right of abilities, beveled) ---- */
  const sumX=abx+4*84+22,sumY=aby-58;
  ['D','F'].forEach((s,i)=>{
    const sum=p.summoner[s];const x=sumX,y=sumY+i*64;
    const grad2=ctx.createLinearGradient(x,y,x,y+56);
    grad2.addColorStop(0,'rgba(30,52,64,0.95)');grad2.addColorStop(1,'rgba(6,14,20,0.97)');
    ctx.fillStyle=grad2;oct(x,y,56,8);ctx.fill();
    ctx.strokeStyle=sum.cd>0?'#5a657a':'#7fd8e8';ctx.lineWidth=1.8;oct(x,y,56,8);ctx.stroke();
    ctx.save();ctx.translate(x+28,y+26);
    if(s==='D'){
      ctx.strokeStyle='#7fd8e8';ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-9,9);ctx.lineTo(10,-10);ctx.moveTo(2,-10);ctx.lineTo(10,-10);ctx.lineTo(10,-2);ctx.stroke();
    }else{
      ctx.fillStyle='#7dff9a';
      ctx.fillRect(-3.5,-11,7,22);ctx.fillRect(-11,-3.5,22,7);
    }
    ctx.restore();
    if(sum.cd>0){
      ctx.save();oct(x,y,56,8);ctx.clip();
      ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(x,y+56*(1-sum.cd/sum.max),56,56*(sum.cd/sum.max));
      ctx.restore();
      ctx.fillStyle='#fff';ctx.font=FONT.num(16);ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(Math.ceil(sum.cd),x+28,y+29);ctx.textBaseline='alphabetic';
    }
    /* key chip (LoL-style hotkey badge, top-left) */
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(x+1,y-11,15,12);
    ctx.strokeStyle='rgba(204,237,229,0.25)';ctx.lineWidth=1;ctx.strokeRect(x+1,y-11,15,12);
    ctx.fillStyle='#eef4ff';ctx.font=FONT.num(9);ctx.textAlign='center';ctx.fillText(s,x+8.5,y-2);
    ctx.fillStyle='#9fb4cc';ctx.font=FONT.num(8);ctx.textAlign='center';ctx.fillText(s==='D'?'FLASH':'HEAL',x+28,y+51);
  });
  /* ---- items (left of ability bar) ---- */
  const narrow=(W<1150);
  const itCols=narrow?6:3,itRows=narrow?1:2;
  const itX=narrow?330:abx-3*38-16;
  const itY=narrow?aby-46:aby-64;
  ctx.fillStyle='#8fa2bb';ctx.font=FONT.disp(9,600);ctx.textAlign='left';ctx.fillText('ITEMS',itX,itY-4);
  for(let i=0;i<6;i++){
    const x=itX+(i%itCols)*38,y=itY+Math.floor(i/itCols)*38;
    ctx.fillStyle='rgba(10,15,26,0.88)';oct(x,y,34,6);ctx.fill();
    ctx.strokeStyle='rgba(204,237,229,0.16)';ctx.lineWidth=1;oct(x,y,34,6);ctx.stroke();
    const it=p.items[i];
    if(it){
      ctx.save();ctx.translate(x+17,y+17);
      const ic=it.cat==='attack'?'#ff8a5a':it.cat==='magic'?'#b98cff':'#7dc8e8';
      if(it.cat==='attack'){
        ctx.strokeStyle=ic;ctx.lineWidth=2.6;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-7,7);ctx.lineTo(7,-7);ctx.moveTo(-2,-7);ctx.lineTo(7,-7);ctx.lineTo(7,2);ctx.stroke();
        ctx.strokeStyle='#d8c98a';ctx.beginPath();ctx.moveTo(-6,2);ctx.lineTo(-2,6);ctx.stroke();
      }else if(it.cat==='magic'){
        ctx.fillStyle=ic;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(-2,-2,2.2,0,Math.PI*2);ctx.fill();
      }else{
        ctx.fillStyle=ic;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,-4);ctx.lineTo(7,2);
        ctx.quadraticCurveTo(7,8,0,10);ctx.quadraticCurveTo(-7,8,-7,2);ctx.lineTo(-7,-4);ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }
    ctx.fillStyle='rgba(230,240,255,0.55)';ctx.font=FONT.num(8);ctx.textAlign='left';
    ctx.fillText(String(i+1),x+4,y+11);
  }

  /* ---- announcements -> handled by drawKillFeed3D ---- */
  drawMinimap3D();
  if(GAME&&GAME.surrenderOffer&&state===STATES.PLAYING)drawSurrenderOffer3D();
  if(shopOpen)drawShopR9();
  if(scoreboardOpen)drawScoreboard3D();
  if(!player.alive)drawDeathOverlay3D();
  /* ---- ranged-attack range preview: player's own attack range ring when
     right mouse held on a target (reads engagement distance) ---- */
  if(p.attacking&&p.target&&p.target.alive&&p.target.team!==p.team){
    ctx.strokeStyle='rgba(255,120,109,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.arc(p.target.x*0+cx,H*0.5,0,0,0);ctx.stroke();ctx.setLineDash([]);
  }
}

/* ---- S5b-0. R9 shop overlay (fixes real-M2 'Ninja Tabi1100g' overlap) ----
   The base drawShop3D tile is 162px wide with the item name starting at +46
   and the price right-aligned at +152 — any name longer than ~13 glyphs at
   12px bold runs UNDER the price (real screenshot: 'Ninja Tabi1100g').
   This redraw: 186px tiles, two text columns (name 130px measured+clipped
   with ellipsis, price 44px right), stats line below, buy-state colors,
   and category tabs kept from base. */
function drawShopR9(){
  const pw=Math.min(660,W*0.92),ph=Math.min(470,H*0.84);
  const px=Math.round(W/2-pw/2),py=Math.round(H/2-ph/2);
  ctx.fillStyle='rgba(6,10,18,0.95)';roundRectH(px,py,pw,ph,14);ctx.fill();
  ctx.strokeStyle='#3a4a6a';ctx.lineWidth=2;roundRectH(px,py,pw,ph,14);ctx.stroke();
  ctx.fillStyle='#ffd76b';ctx.font=FONT.disp(19,700);ctx.textAlign='center';
  ctx.fillText('SHOP',W/2,py+30);
  ctx.fillStyle='#9fb4cc';ctx.font=FONT.num(11);
  ctx.fillText(Math.floor(player.gold)+' G  ·  P to close',W/2,py+46);
  const cats=[['attack','ATTACK'],['magic','MAGIC'],['defense','DEFENSE']];
  cats.forEach((c,i)=>{
    const tx=px+22+i*130,ty=py+58;
    ctx.fillStyle=shopCat===c[0]?'rgba(255,215,107,0.22)':'rgba(255,255,255,0.06)';
    roundRectH(tx,ty,122,28,7);ctx.fill();
    ctx.strokeStyle=shopCat===c[0]?'#ffd76b':'rgba(120,140,170,0.4)';ctx.lineWidth=1.4;roundRectH(tx,ty,122,28,7);ctx.stroke();
    ctx.fillStyle=shopCat===c[0]?'#ffd76b':'#9fb4cc';ctx.font=FONT.disp(12,700);
    ctx.fillText(c[1],tx+61,ty+18);
  });
  const items=ITEMS.filter(i=>i.cat===shopCat);
  /* 186x54 tiles, 3 per row — measured columns, no free-run text */
  const tileW=186,tileH=54,gapX=12,gapY=10;
  const cols=Math.max(1,Math.floor((pw-44)/tileW));
  let ix=px+22,iy=py+100;
  items.forEach((it,row)=>{
    if(ix+tileW>px+pw-22){ix=px+22;iy+=tileH+gapY;}
    const afford=player.gold>=it.cost;
    const owned=(player.items||[]).some(o=>o.id===it.id);
    ctx.fillStyle=!afford?'rgba(120,120,120,0.05)':owned?'rgba(255,215,107,0.10)':'rgba(255,255,255,0.07)';
    roundRectH(ix,iy,tileW,tileH,8);ctx.fill();
    ctx.strokeStyle=!afford?'rgba(120,120,120,0.3)':owned?'rgba(255,215,107,0.55)':'rgba(140,170,220,0.55)';
    ctx.lineWidth=1.2;roundRectH(ix,iy,tileW,tileH,8);ctx.stroke();
    /* icon */
    ctx.fillStyle=it.cat==='attack'?'#ff8a5a':it.cat==='magic'?'#b98cff':'#7dc8e8';
    ctx.beginPath();ctx.arc(ix+25,iy+27,11,0,Math.PI*2);ctx.fill();
    /* NAME: clip to its own 128px column, ellipsis on overflow */
    const nameX=ix+43,nameW=128;
    ctx.save();
    ctx.beginPath();ctx.rect(nameX,iy+4,nameW,18);ctx.clip();
    ctx.fillStyle=afford?(owned?'#ffd76b':'#e8eef8'):'#8a92a2';
    ctx.font=FONT.disp(12,700);ctx.textAlign='left';
    let nm=it.name;
    while(ctx.measureText(nm).width>nameW-10&&nm.length>3)nm=nm.slice(0,-2);
    if(nm!==it.name)nm+='…';
    ctx.fillText(nm,nameX,iy+17);
    ctx.restore();
    /* PRICE: own column, right edge of tile, vertically same line */
    ctx.fillStyle=afford?'#ffd76b':'#6f7787';
    ctx.font=FONT.num(12,700);ctx.textAlign='right';
    ctx.fillText(it.cost+'g',ix+tileW-8,iy+17);
    /* stats line under BOTH (never collides) */
    const stats=[];
    if(it.ad)stats.push(it.ad+' AD');if(it.ap)stats.push(it.ap+' AP');
    if(it.hp)stats.push(it.hp+' HP');if(it.ms)stats.push(it.ms+' MS');
    if(it.armor)stats.push(it.armor+' AR');if(it.mr)stats.push(it.mr+' MR');
    ctx.fillStyle='#8fa2bb';ctx.font=FONT.num(10);ctx.textAlign='left';
    ctx.fillText(stats.join(' · '),nameX,iy+34);
    if(owned){ctx.fillStyle='#6fdc8c';ctx.font=FONT.num(9,700);ctx.fillText('OWNED',nameX,iy+46);}
    ix+=tileW+gapX;
  });
  ctx.textAlign='center';ctx.fillStyle='#7d8ca0';ctx.font=FONT.num(11);
  ctx.fillText('Click an item to buy · gold from minions, kills and passive income',W/2,py+ph-14);
}

/* ---- S5b. minimap v2: region fills + camps + gold edges ---- */
function drawMinimap3D(){
  const S=W<1150?150:210,pad=18;
  const mx=W-S-pad,my=H-S-pad;
  ctx.save();
  ctx.fillStyle='rgba(5,10,16,0.92)';
  ctx.beginPath();ctx.moveTo(mx-6+12,my-6);ctx.lineTo(mx+S+6-12,my-6);ctx.lineTo(mx+S+6,my-6+12);ctx.lineTo(mx+S+6,my+S+6-12);ctx.lineTo(mx+S+6-12,my+S+6);ctx.lineTo(mx-6+12,my+S+6);ctx.lineTo(mx-6,my+S+6-12);ctx.lineTo(mx-6,my-6+12);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(204,237,229,0.2)';ctx.lineWidth=1.2;ctx.stroke();
  const sc=S/MAPW;
  /* terrain: jungle quadrants (dark green) */
  ctx.fillStyle='rgba(24,44,30,0.9)';
  ctx.beginPath();
  ctx.moveTo(mx,my);ctx.lineTo(mx+S*0.42,my);ctx.lineTo(mx+S*0.42,my+S*0.28);ctx.lineTo(mx+S*0.58,my+S*0.42);
  ctx.lineTo(mx+S*0.42,my+S*0.58);ctx.lineTo(mx+S*0.28,my+S*0.42);ctx.lineTo(mx,my+S*0.42);ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(mx+S,my+S);ctx.lineTo(mx+S*0.58,my+S);ctx.lineTo(mx+S*0.58,my+S*0.72);ctx.lineTo(mx+S*0.42,my+S*0.58);
  ctx.lineTo(mx+S*0.58,my+S*0.42);ctx.lineTo(mx+S*0.72,my+S*0.58);ctx.lineTo(mx+S,my+S*0.58);ctx.closePath();ctx.fill();
  /* lanes: 3-layer (dark base, sand, bright edge) */
  for(const lane of ['top','mid','bot']){
    const trace=(w,st)=>{ctx.strokeStyle=st;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
      LANES[lane].path.forEach((p,i)=>{const X=mx+p.x*sc,Y=my+p.y*sc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();};
    trace(5,'rgba(8,12,8,0.9)');trace(3.4,'rgba(150,130,88,0.85)');trace(1,'rgba(226,206,150,0.6)');
  }
  /* river */
  const riv=()=>{ctx.beginPath();
    ctx.moveTo(mx+MAPW*0.98*sc,my+MAPW*0.60*sc);
    ctx.quadraticCurveTo(mx+MAPW*0.52*sc,my+MAPW*0.48*sc,mx+MAPW*0.60*sc,my+MAPW*0.02*sc);
    ctx.moveTo(mx+MAPW*0.98*sc,my+MAPW*0.60*sc);
    ctx.quadraticCurveTo(mx+MAPW*0.48*sc,my+MAPW*0.52*sc,mx+MAPW*0.02*sc,my+MAPW*0.40*sc);};
  riv();ctx.strokeStyle='rgba(50,110,150,0.7)';ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();
  riv();ctx.strokeStyle='rgba(90,160,200,0.45)';ctx.lineWidth=2;ctx.stroke();
  /* jungle camps */
  if(typeof jungleCamps!=='undefined'){
    for(const c of jungleCamps){
      if(!c.alive)continue;
      ctx.fillStyle='#c9b458';
      ctx.beginPath();ctx.arc(mx+c.x*sc,my+c.y*sc,2.2,0,Math.PI*2);ctx.fill();
    }
  }
  /* base platforms with radial glow */
  for(const [bx,by,team] of [[2000,12820,0],[12820,2000,1]]){
    const g=ctx.createRadialGradient(mx+bx*sc,my+by*sc,2,mx+bx*sc,my+by*sc,14);
    g.addColorStop(0,team===BLUE?'rgba(70,140,220,0.75)':'rgba(220,80,65,0.75)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx+bx*sc,my+by*sc,14,0,Math.PI*2);ctx.fill();
  }
  /* units */
  for(const u of units){
    if(!u.alive)continue;
    const X=mx+u.x*sc,Y=my+u.y*sc;
    if(u instanceof Nexus){
      ctx.fillStyle=u.team===BLUE?'#4a9fe8':'#e05540';
      ctx.beginPath();ctx.arc(X,Y,6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;ctx.stroke();
    }
    else if(u instanceof Tower){
      ctx.fillStyle=u.team===BLUE?'#5ab0ff':'#ff7a6a';
      ctx.beginPath();ctx.moveTo(X,Y-4.2);ctx.lineTo(X+4.2,Y);ctx.lineTo(X,Y+4.2);ctx.lineTo(X-4.2,Y);ctx.closePath();ctx.fill();
    }
    else if(u instanceof Inhibitor){ctx.fillStyle=u.team===BLUE?'#8ad0ff':'#ffa08a';ctx.fillRect(X-2,Y-4,4,8);}
    else if(u instanceof Champion){
      if(u.isPlayer){
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,4.5,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#ffd76b';ctx.lineWidth=2;ctx.stroke();
      }
      else if(inPlayerVision(u)){
        ctx.fillStyle=u.team===player.team?'#3fd06a':'#ff5040';
        ctx.beginPath();ctx.arc(X,Y,3.5,0,Math.PI*2);ctx.fill();
        if(u.team!==player.team){ctx.strokeStyle='rgba(255,80,64,0.85)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(X,Y,5.5,0,Math.PI*2);ctx.stroke();}
      }
    }
    else if(u instanceof Minion&&inPlayerVision(u)){ctx.fillStyle=u.team===BLUE?'#3a7bd5':'#d0453a';ctx.fillRect(X-1.5,Y-1.5,3,3);}
    else if(u.isMonster&&inPlayerVision(u)){ctx.fillStyle='#c9b458';ctx.fillRect(X-2,Y-2,4,4);}
  }
  /* camera frustum */
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.strokeRect(mx+(camCtl.x-2600/camCtl.zoom)*sc,my+(camCtl.y-2000/camCtl.zoom)*sc,5200/camCtl.zoom*sc,4000/camCtl.zoom*sc);
  ctx.restore();
}

/* ---------------------------- S6. spatial audio --------------------------- */
/* Stereo pan + distance falloff on combat sounds (anchor: voidfall
   spatialMix — gain smoothstep over min 7/max 52 world meters, pan dx/30).
   Our map is 14820u (~180u per meter of voidfall scale), so distances scale
   x10. Wrap SFX.tone with a positioned variant used by combat hooks.       */
SFX.spatial=(x,y)=>{
  if(!SFX.ok()||typeof player==='undefined'||!player)return {gain:1,pan:0};
  const dx=x-player.x,dz=y-player.y;
  const d=Math.hypot(dx,dz);
  const minD=700,maxD=5200;
  if(d>=maxD)return null;
  const n=Math.max(0,Math.min(1,(d-minD)/(maxD-minD)));
  const smooth=n*n*(3-n*2);
  return {gain:1-smooth,pan:Math.max(-1,Math.min(1,dx/3000))};
};
SFX.ptone=(x,y,f,d,type,vol,slide)=>{
  if(!SFX.ok())return;
  const m=SFX.spatial(x,y);
  if(!m||m.gain<=0.02)return;
  if(!SFX.ctx.createStereoPanner){
    SFX.tone(f,d,type,vol*m.gain,slide);return;
  }
  try{
    const t=SFX.ctx.currentTime;
    const o=SFX.ctx.createOscillator(),g=SFX.ctx.createGain(),pan=SFX.ctx.createStereoPanner();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(vol*m.gain,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    pan.pan.setValueAtTime(m.pan,t);
    o.connect(g);g.connect(pan);pan.connect(SFX.ctx.destination);
    o.start(t);o.stop(t+d+0.02);
  }catch(e){}
};
/* variant hits: 2 variants per family with random pitch (anchor recipe) */
SFX.hitV=(x,y,kind,crit)=>{
  const p=1+(Math.random()-0.5)*0.05;
  if(kind==='magic')SFX.ptone(x,y,(crit?520:420)*p,0.09,'triangle',0.05,0.55);
  else if(kind==='true')SFX.ptone(x,y,660*p,0.08,'sine',0.05,0.6);
  else SFX.ptone(x,y,(crit?95:120)*p,0.07,'sawtooth',0.045,0.5);
};

/* ---------------------------- R5 integration ------------------------------ */
/* frame v3: previous loop + aiming step + grade step + vignette. */
function frame(now){
  requestAnimationFrame(frame);
  if(typeof window!=='undefined')window.__riftFrameAlive=true;   /* R40: single-chain marker */
  let dt=Math.min(0.05,(now-lastT3)/1000);
  lastT3=now;
  if(ART.hitStop>0){
    ART.hitStop-=dt;
    dt*=0.35;
  }
  update(dt);
  if(player&&state===STATES.PLAYING){
    camCtl.x+=(player.x-camCtl.x)*Math.min(1,dt*8);
    camCtl.y+=(player.y-camCtl.y)*Math.min(1,dt*8);
    const edge=26,panSpd=1500*dt/camCtl.zoom;
    if(mouse.x<edge)camCtl.x-=panSpd;
    if(mouse.x>W-edge)camCtl.x+=panSpd;
    if(mouse.y<edge)camCtl.y-=panSpd;
    if(mouse.y>H-edge)camCtl.y+=panSpd;
    if(keys['a'])camCtl.x-=panSpd;
    if(keys['d'])camCtl.y+=panSpd;
    if(keys['w'])camCtl.y-=panSpd*0.8;
    if(keys['s'])camCtl.y+=panSpd*0.8;
    camCtl.x=clamp(camCtl.x,300,MAPW-300);
    camCtl.y=clamp(camCtl.y,300,MAPW-300);
  }
  ART.applyGrade();
  ART.stepGrade(dt);
  ART.stepR6(now/1000);
  ART.stepR8(dt);
  updateCamera(dt);
  for(const u of units){unitMesh(u);}
  pruneMeshes();
  animateUnits(dt,now/1000);
  AIM.step(dt);
  if(AIM.slot&&AIM.group)AIM.group.visible=true;
  ART.stepR14(dt);
  ART.stepFountain(now/1000,dt);
  syncBars();
  syncProjectiles();
  syncParticles(dt);
  ART.stepDmgNums(dt);
  ART.stepTowerWarn(dt);
  ART.stepEndBeat();
  for(let i=vfxList.length-1;i>=0;i--){
    const v=vfxList[i];
    v.life-=dt;
    const m=v.mesh;
    if(v.spark){
      m.position.x+=(m.userData.vx||0)*dt;
      m.position.y+=(m.userData.vy||0)*dt;m.userData.vy-=900*dt;
      m.position.z+=(m.userData.vz||0)*dt;
      m.rotation.x+=dt*7;m.rotation.y+=dt*5;
      if(m.position.y<2)m.position.y=2;
    } else if(v.debris){
      m.position.x+=(m.userData.vx||0)*dt;
      m.position.y+=(m.userData.vy||0)*dt;m.userData.vy-=1500*dt;
      m.position.z+=(m.userData.vz||0)*dt;
      m.rotation.x+=(m.userData.spin||3)*dt;m.rotation.z+=(m.userData.spin||2)*dt;
      if(m.position.y<8){m.position.y=8;m.userData.vx*=0.3;m.userData.vz*=0.3;m.userData.vy=0;}
    } else if(v.flash){
      m.scale.setScalar(1+(0.4-v.life)*4);
    } else if(v.glow){
    } else {
      m.material.opacity=Math.max(0,v.life*1.6);
      m.scale.setScalar(1+(0.5-v.life)*1.6);
    }
    m.material.opacity=(v.spark||v.debris)?Math.max(0,v.life*1.4):Math.max(0,v.life*1.5);
    if(v.glow)m.material.opacity=Math.max(0,v.life*1.1);
    if(v.life<=0){scene.remove(m);vfxList.splice(i,1);}
  }
  if(moveMarker&&moveMarker.userData.t>0){moveMarker.userData.t-=dt;moveMarker.material.opacity=moveMarker.userData.t*1.4;}
  renderer.render(scene,camera);
  if(state===STATES.END){drawEndScreen3D();}
  else{
    renderHUD3D();
    drawKillFeed3D();
    ART.drawVignette();
  }
}

/* ---- castKick + spatial hooks: patch onto installCombatHooks' wrapped fns.
   We wrap castAbility AGAIN (it was already wrapped in r4) to add the
   weapon shiver + per-hero cast tone; and re-point hit sounds to spatial
   variants by replacing SFX.hit within the same object (r4 code calls
   SFX.hit(type,crit) — we keep that call signature working via spatial when
   player position known: r4 only plays sounds for player-relevant events
   anyway).                                                                   */
function installR5AudioHooks(){
  if(ART._r5audio)return;ART._r5audio=true;
  /* per-hero cast tones (anchor: every champion has a distinct cast sound) */
  const castTone={
    garen:(x,y)=>SFX.ptone(x,y,180,0.12,'sawtooth',0.05,1.4),
    ashe:(x,y)=>SFX.ptone(x,y,620,0.1,'triangle',0.045,1.6),
    annie:(x,y)=>{SFX.ptone(x,y,240,0.14,'square',0.04,1.9);SFX.ptone(x,y,480,0.1,'triangle',0.035,2.2);},
    lux:(x,y)=>{SFX.ptone(x,y,740,0.14,'sine',0.045,1.7);SFX.ptone(x,y,1110,0.1,'sine',0.03,1.5);},
    yi:(x,y)=>SFX.ptone(x,y,300,0.1,'sawtooth',0.04,1.3)
  };
  const prevCast=castAbility;
  castAbility=function(src,slot,targetPos){
    const ok=prevCast(src,slot,targetPos);
    if(ok){
      /* castKick on the mesh (node-hierarchy rig shiver) */
      if(typeof meshes!=='undefined'){
        const g=meshes.get(src);
        if(g&&g.userData&&g.userData.r5)g.userData.castKick=0.38;
      }
      if(castTone[src.key])castTone[src.key](src.x,src.y);
      if(src===player&&slot==='R'){SFX.ult();ART.addShake(0.4);}
    }
    return ok;
  };
  /* melee slash arc VFX on basic attack fire (anchor: createMeleeSlash) */
  const _r5td=Unit.prototype.takeDamage;
  Unit.prototype.takeDamage=function(dmg,src,type){
    const wasHp=this.hp;
    const final=_r5td.call(this,dmg,src,type);
    if(final>0&&src&&src instanceof Champion&&!(src.range>160)){
      /* slash arc at the victim facing the attacker */
      if(typeof scene!=='undefined'&&typeof vfxList!=='undefined'){
        const a=Math.atan2(src.y-this.y,src.x-this.x);
        const arc=new THREE.Mesh(new THREE.TorusGeometry(26,4,6,14,Math.PI*0.8),
          new THREE.MeshBasicMaterial({color:src.champColor,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
        arc.position.set(this.x,42,this.y);
        arc.rotation.z=a+Math.PI/2;arc.rotation.x=-Math.PI/2;
        scene.add(arc);vfxList.push({mesh:arc,life:0.22});
      }
    }
    return final;
  };
}

/* ============================================================================
   ROUND 6 — BATTLEFIELD MATURITY LAYER (2026-09-25, CC)
   Grounded in the REAL M2 WebGL photos (_meyo_feedback/final-5d-real/, real
   GPU, sandbox kept, 0 pageerror) + vision reads of those photos + the
   voidfall (MIT) dissected params in _research/worldclass_anchors.md §2.
   The photos said: roads repeat flat, bases are a plain disc, jungle is
   noise-spread lollipop trees, there is no 3D river and no mid-frequency
   detail — the WORLD still reads as a prototype even though heroes/towers
   improved. This layer rebuilds the world to one coherent grade:
   R6A terrain repaint  — lane-composed ground: stone-paved warm roads with
        cobbles+wheel ruts, authored jungle mottling, dirt aprons at camps,
        mossy river banks, paved base courts, NO uniform noise field.
   R6B 3D river — carved bed ribbon + translucent animated water sheet +
        twin glow edge ribbons + stepping stones (replaces texture-only river).
   R6C jungle clusters — ~42 authored groves (2-5 trees + rocks + shards +
        fallen logs) at lane-quad corners/camp flanks/river banks instead of
        uniform scatter; layered multi-lobe canopies with hue jitter.
   R6D base architecture — paved court + 8-column peristyle ring + fountain
        obelisk with crystal and pool (replaces flat glow-disc read).
   R6E lane spires — wayfinding rune obelisks along every lane (the rhythm
        elements LoL uses to make roads read as roads from game camera).
   R6F monster pits — 2 authored epic pits on the river (terraced dais, claw
        spires, rune ring, glowing core) giving the river its landmarks.
   R6G battlefield props — broken carts/rubble/standing stones at lane
        junctions (mid-frequency clutter; kept clear of lane corridors).
   Deterministic (mulberry32 seed) — headless renders stay comparable.
   ============================================================================ */
function R6R(a,b){return a+Math.random()*(b-a);}

/* ---------------------------- R6A. terrain repaint ------------------------ */
function groundTexture(){
  const S=2048;
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  /* rebuild-time painting only (no gameplay determinism required): direct
     Math.random avoids any cross-script scoping concern in the combined file */
  const rng=Math.random;
  const SC=v=>v/MAPW*S;
  const wx=sx=>sx/MAPW*S, wy=sy=>sy/MAPW*S;
  /* --- base meadow: diagonal tonal wash (never uniform) --- */
  const bg=g.createLinearGradient(0,0,S,S);
  bg.addColorStop(0,'#2b4423');bg.addColorStop(0.38,'#33502a');
  bg.addColorStop(0.62,'#2e4a26');bg.addColorStop(1,'#28411f');
  g.fillStyle=bg;g.fillRect(0,0,S,S);
  /* broad authored mottling (patchiness at 3 scales — kills flat-fill read) */
  for(let i=0;i<240;i++){
    const x=rng()*S,y=rng()*S,r=R6R(30,130);
    g.fillStyle=rng()<0.5?'rgba(20,36,14,'+R6R(0.05,0.13)+')':'rgba(84,108,52,'+R6R(0.04,0.10)+')';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  for(let i=0;i<700;i++){
    const x=rng()*S,y=rng()*S,r=R6R(8,34);
    g.fillStyle=rng()<0.6?'rgba(26,46,18,'+R6R(0.06,0.14)+')':'rgba(96,120,60,'+R6R(0.04,0.08)+')';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  /* dry warm-earth variance patches */
  for(let i=0;i<240;i++){
    const x=rng()*S,y=rng()*S,r=R6R(6,20);
    g.fillStyle='rgba(118,96,58,'+R6R(0.05,0.10)+')';
    g.beginPath();g.ellipse(x,y,r,r*0.62,rng()*3.14,0,Math.PI*2);g.fill();
  }
  /* grass blades: sparse clusters instead of uniform 26k noise */
  for(let cl=0;cl<900;cl++){
    const cx2=rng()*S,cy2=rng()*S,n=3+(rng()*6|0);
    for(let i=0;i<n;i++){
      const x=cx2+R6R(-14,14),y=cy2+R6R(-14,14),l=R6R(2.5,6.5),a=R6R(-0.5,0.5);
      g.strokeStyle=rng()<0.5?'rgba(40,66,30,0.5)':'rgba(96,128,64,0.42)';
      g.lineWidth=1.3;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(a)*l,y-Math.cos(a)*l);g.stroke();
    }
  }
  /* --- lane corridors: wide dirt apron then stone-paved road --- */
  const laneTrace=(lane,w,style,alpha)=>{
    const pts=LANES[lane].path;
    g.save();g.globalAlpha=alpha===undefined?1:alpha;
    g.strokeStyle=style;g.lineWidth=SC(w);g.lineCap='round';g.lineJoin='round';
    g.beginPath();pts.forEach((p,i)=>{const X=wx(p.x),Y=wy(p.y);i?g.lineTo(X,Y):g.moveTo(X,Y);});g.stroke();
    g.restore();
  };
  for(const lane of ['top','mid','bot']){
    laneTrace(lane,660,'rgba(24,36,16,0.55)');        // trampled dark apron
    laneTrace(lane,560,'rgba(118,98,62,0.85)');       // dirt bed
    laneTrace(lane,470,'rgba(150,130,90,0.92)');      // warm packed earth
    /* R8 (real-GPU fix): stone base was 178,160,122 — on the M2 it read as
       a blown-out cream band (~80% flat pale). Rebalanced to warm dark-tan
       (vision-checked: slate-dark read corrected toward #7A6F60-#8C785F). */
    laneTrace(lane,410,'rgba(152,132,98,0.95)');      // stone base (warm tan)
  }
  /* flagstone cobbles INSIDE the road band: LARGE slabs with dark joints so
     the paving reads at gameplay distance (a 60u slab = 8.3px on the 2048
     texture; at default zoom 1 world-unit ≈ 0.35 screen px → ~29px slab on
     screen: readable. Smaller stones were dissolving into gravel noise.) */
  /* R9 (real-GPU fix, final-c21 road.jpg): vision read the lane as "same
     cobble pattern repeats along the lane" — TRUE: slabs sat on a periodic
     64u grid with a FIXED 3-column layout (offsets -124/0/+124, row period
     constant). Human paving reads irregular: broken bond, staggered courses,
     missing stones, per-course tint drift. Rewrite as a running-bond paver
     field: march along the lane with VARIED course spacing (54-92u), each
     course gets its own column count (2-4), column offsets stagger by half a
     course when the last course had even count, stones jitter size/rotation
     hard, 8% cells are MISSING (dirt shows through = age), and a slow
     per-lane-progress hue drift makes distant stretches differ. */
  for(const lane of ['top','mid','bot']){
    const pts=LANES[lane].path;
    const laneLen=pts.reduce((acc,p,i)=>i?acc+Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y):0,0);
    let travelled=0, course=0, lastCols=3;
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      const segLen=Math.hypot(b.x-a.x,b.y-a.y);
      const nx=-(b.y-a.y)/(segLen||1),ny=(b.x-a.x)/(segLen||1);
      const dirA=Math.atan2(ny,nx);
      let sInSeg=0;
      while(sInSeg<segLen){
        /* course spacing varies per course — no fixed period anywhere */
        const courseGap=R6R(54,92);
        if(sInSeg+courseGap/2>segLen&&i<pts.length-2){break;}   /* continue in next seg */
        const cxu=a.x+(b.x-a.x)*(sInSeg/segLen), cyu=a.y+(b.y-a.y)*(sInSeg/segLen);
        /* macro variation between stretches: multi-octave value noise along
           travelled distance — no single period anywhere (the earlier
           sin(2*pi*prog) drift marched a faint chevron down the lane) */
        const prog=travelled/laneLen;
        const drift=(Math.sin(travelled*0.00093+lane.length*2.1)*6
                    +Math.sin(travelled*0.00031+lane.length*0.7)*8
                    +Math.sin(course*0.83)*5)|0;
        /* column count alternates; stagger half-cell when last was even */
        let cols=2+(R6R(0,2.4)|0);            /* 2..4 */
        const stagger=(lastCols%2===0)?R6R(28,52):0;
        lastCols=cols;
        const span=372;                        /* paved half-width ~ -186..+186 */
        for(let k2=0;k2<cols;k2++){
          if(R6R(0,1)<0.08)continue;          /* missing stone — dirt shows */
          const off=-span/2+ (k2+0.5)*(span/cols) + stagger*(k2%2?1:-1)*0.3 + R6R(-20,20);
          const X=wx(cxu+nx*off),Y=wy(cyu+ny*off);
          const rw=R6R(58,104)*(1+(cols===2?0.22:0)),rh=rw*R6R(0.58,0.88);
          const ang=dirA+R6R(-0.34,0.34);
          const shade=(R6R(-30,36)|0)+drift;
          const cr=162+shade,cg=146+shade,cb=118+(shade*0.75|0);
          g.fillStyle='rgb('+cr+','+cg+','+cb+')';
          g.beginPath();g.ellipse(X,Y,SC(rw),SC(rh),ang,0,Math.PI*2);g.fill();
          g.strokeStyle='rgba(52,42,26,0.85)';g.lineWidth=SC(8);
          g.beginPath();g.ellipse(X,Y,SC(rw),SC(rh),ang,0,Math.PI*2);g.stroke();
          g.fillStyle='rgba(214,196,156,0.30)';
          g.beginPath();g.ellipse(X-SC(rw*0.22),Y-SC(rh*0.28),SC(rw*0.5),SC(rh*0.44),ang,0,Math.PI*2);g.fill();
        }
        sInSeg+=courseGap;travelled+=courseGap;course++;
      }
    }
    /* patch the dirt through the 8% missing cells: dab darker earth so gaps
       don't read as holes in the geometry but as aged paving */
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      const segLen=Math.hypot(b.x-a.x,b.y-a.y);
      const nx=-(b.y-a.y)/(segLen||1),ny=(b.x-a.x)/(segLen||1);
      for(let m=0;m<segLen/80;m++){
        const t=R6R(0,1),off=R6R(-170,170);
        const X=wx(a.x+(b.x-a.x)*t+nx*off),Y=wy(a.y+(b.y-a.y)*t+ny*off);
        g.fillStyle='rgba(96,80,52,'+R6R(0.25,0.5).toFixed(2)+')';
        g.beginPath();g.ellipse(X,Y,SC(R6R(20,44)),SC(R6R(14,30)),R6R(0,3.14),0,Math.PI*2);g.fill();
      }
    }
  }
  /* twin wheel ruts along each lane (long-lived road wear) */
  for(const lane of ['top','mid','bot']){
    const pts=LANES[lane].path;
    for(const off of [-105,105]){
      g.save();g.globalAlpha=0.55;g.strokeStyle='#3e3218';g.lineWidth=SC(46);g.lineCap='round';g.lineJoin='round';
      g.beginPath();
      for(let i=0;i<pts.length-1;i++){
        const a=pts[i],b=pts[i+1];
        const segLen=Math.hypot(b.x-a.x,b.y-a.y);
        const nx=-(b.y-a.y)/(segLen||1),ny=(b.x-a.x)/(segLen||1);
        const X=wx(a.x+nx*off),Y=wy(a.y+ny*off);
        i?g.lineTo(X,Y):g.moveTo(X,Y);
      }
      g.stroke();g.restore();
    }
  }
  /* road-edge pebble spills */
  for(const lane of ['top','mid','bot']){
    const pts=LANES[lane].path;
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      const segLen=Math.hypot(b.x-a.x,b.y-a.y);
      const nx=-(b.y-a.y)/(segLen||1),ny=(b.x-a.x)/(segLen||1);
      for(let k2=0;k2<26;k2++){
        const t=rng();
        const side=rng()<0.5?-1:1;
        const off=side*R6R(210,290);
        const X=wx(a.x+(b.x-a.x)*t+nx*off),Y=wy(a.y+(b.y-a.y)*t+ny*off);
        g.fillStyle=rng()<0.5?'rgba(150,140,120,0.5)':'rgba(96,88,70,0.5)';
        g.beginPath();g.arc(X,Y,R6R(1,2.6),0,Math.PI*2);g.fill();
      }
    }
  }
  /* --- river bed: muddy bank aprons + wet bed (3D water sheet rides above) --- */
  const rivPts=[[14500,9000],[10400,7400],[7410,7410],[4400,4600],[300,5900]];
  const rivTrace=(w,style,alpha)=>{
    g.save();g.globalAlpha=alpha===undefined?1:alpha;
    g.strokeStyle=style;g.lineWidth=SC(w);g.lineCap='round';g.lineJoin='round';
    g.beginPath();rivPts.forEach((p,i)=>{const X=wx(p[0]),Y=wy(p[1]);i?g.lineTo(X,Y):g.moveTo(X,Y);});g.stroke();
    g.restore();
  };
  rivTrace(820,'rgba(30,44,22,0.55)');               // mossy outer bank
  rivTrace(640,'rgba(64,66,38,0.75)');               // mud apron
  rivTrace(470,'rgba(38,58,50,0.9)');                // wet bed
  rivTrace(380,'rgba(24,48,52,0.95)');               // deep center
  /* R14-C: wet-edge watermarks — dark moisture blotches hugging the banks
     (the "just-flooded" read that separates rivers from roads) */
  for(let i=0;i<260;i++){
    const t=rng(),ai=(rng()*(rivPts.length-1))|0;
    const a=rivPts[ai],b=rivPts[ai+1];
    const off=R6R(180,330)*(rng()<0.5?-1:1);
    const nx=-(b[1]-a[1]),ny=(b[0]-a[0]);
    const nl=Math.hypot(nx,ny)||1;
    const X=wx(a[0]+(b[0]-a[0])*t+nx/nl*off),Y=wy(a[1]+(b[1]-a[1])*t+ny/nl*off);
    g.fillStyle='rgba(22,34,30,'+R6R(0.18,0.4)+')';
    g.beginPath();g.ellipse(X,Y,R6R(6,26),R6R(3,10),rng()*3.14,0,Math.PI*2);g.fill();
  }
  /* R14-C: saturation mosaic — huge soft hue-shifted washes (the single
     biggest "real terrain" tell vs flat green paint) */
  for(let i=0;i<60;i++){
    const x=rng()*S,y=rng()*S,r=R6R(180,420);
    const warm=rng()<0.5;
    const gb=g.createRadialGradient(x,y,0,x,y,r);
    gb.addColorStop(0,warm?'rgba(96,116,48,0.16)':'rgba(30,54,30,0.16)');
    gb.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gb;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  /* --- camp clearings: dirt apron + ring --- */
  for(const camp of jungleCamps){
    const X=wx(camp.x),Y=wy(camp.y);
    const gb=g.createRadialGradient(X,Y,4,X,Y,SC(430));
    gb.addColorStop(0,'rgba(112,92,58,0.85)');gb.addColorStop(0.62,'rgba(84,70,44,0.5)');gb.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gb;g.beginPath();g.arc(X,Y,SC(430),0,Math.PI*2);g.fill();
    g.strokeStyle='rgba(180,160,110,0.30)';g.lineWidth=SC(14);
    g.beginPath();g.arc(X,Y,SC(330),0,Math.PI*2);g.stroke();
  }
  /* --- base courts: paved flagstone plazas (kills "flat blue disc" read) --- */
  for(const [bx,by,team] of [[2000,12820,0],[12820,2000,1]]){
    const X=wx(bx),Y=wy(by);
    /* R8: plaza brightened ~20 after the light re-budget (vision: slightly
       too dark) — still darker than roads so lanes stay the visual spine */
    g.fillStyle='rgba(52,57,68,0.90)';g.beginPath();g.arc(X,Y,SC(1500),0,Math.PI*2);g.fill();
    g.fillStyle='rgba(116,124,140,0.95)';g.beginPath();g.arc(X,Y,SC(1330),0,Math.PI*2);g.fill();
    g.fillStyle='rgba(132,140,156,0.95)';g.beginPath();g.arc(X,Y,SC(1080),0,Math.PI*2);g.fill();
    /* radial joints + concentric rings (paved court read) */
    /* R8: real flagstone slabs between the joint lines — wedge bodies with
       per-slab value jitter (same recipe as the road: dark joints + lighter
       slab tops). Vision pass 3 said flat fill + faint joints still read as
       low-contrast; slabs make the plaza paving read at gameplay distance. */
    g.strokeStyle='rgba(30,34,46,0.9)';g.lineWidth=SC(16);
    for(let r2=1;r2<=4;r2++){g.beginPath();g.arc(X,Y,SC(1080*r2/4.4),0,Math.PI*2);g.stroke();}
    for(let a2=0;a2<12;a2++){
      const an=a2/12*Math.PI*2;
      g.beginPath();g.moveTo(X+Math.cos(an)*SC(160),Y+Math.sin(an)*SC(160));
      g.lineTo(X+Math.cos(an)*SC(1070),Y+Math.sin(an)*SC(1070));g.stroke();
    }
    for(let r2=0;r2<4;r2++){
      const rIn=SC(1080*r2/4.4),rOut=SC(1080*(r2+1)/4.4);
      const ringStep=(r2%2)*14;            /* alternate rings step in value */
      for(let a2=0;a2<12;a2++){
        const an0=a2/12*Math.PI*2+R6R(0,0.06),an1=(a2+1)/12*Math.PI*2-R6R(0,0.06);
        const shade=(R6R(0,46)|0)+ringStep;
        g.fillStyle='rgba('+(132+shade)+','+(140+shade)+','+(158+(shade*0.8|0))+',0.62)';
        g.beginPath();
        g.arc(X,Y,rOut,an0,an1);
        g.arc(X,Y,rIn,an1,an0,true);
        g.closePath();g.fill();
      }
    }
    /* flagstone jitter inside court */
    for(let i=0;i<260;i++){
      const an=rng()*Math.PI*2,rr=Math.sqrt(rng())*SC(1020);
      g.fillStyle='rgba('+(130+(rng()*48|0))+','+(138+(rng()*44|0))+','+(156+(rng()*38|0))+',0.55)';
      g.beginPath();g.arc(X+Math.cos(an)*rr,Y+Math.sin(an)*rr,R6R(3,9),0,Math.PI*2);g.fill();
    }
    /* team-tinted inner seal */
    g.strokeStyle=team===0?'rgba(90,170,255,0.5)':'rgba(255,120,90,0.5)';
    g.lineWidth=SC(16);
    g.beginPath();g.arc(X,Y,SC(880),0,Math.PI*2);g.stroke();
    g.fillStyle=team===0?'rgba(64,130,220,0.16)':'rgba(220,90,60,0.16)';
    g.beginPath();g.arc(X,Y,SC(880),0,Math.PI*2);g.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=8;
  return t;
}

/* ---------------------------- R6B. 3D river ------------------------------- */
ART.buildRiver3D=()=>{
  if(ART._river3D||typeof world==='undefined'||!world)return;
  ART._river3D=true;
  const pts=[[14500,9000],[10400,7400],[7410,7410],[4400,4600],[300,5900]]
    .map(p=>new THREE.Vector3(p[0],0,p[1]));
  const curve=new THREE.CatmullRomCurve3(pts);
  /* riverbed ribbon (sunken dark bed under the water sheet) */
  const mkRibbon=(width,y,segs)=>{
    const pos=[],idx=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      const p=curve.getPoint(t);
      const tan=curve.getTangent(t);
      const nx=-tan.z,nz=tan.x;
      pos.push(p.x+nx*width/2,y,p.z+nz*width/2, p.x-nx*width/2,y,p.z-nz*width/2);
      if(i<segs){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  };
  const bed=new THREE.Mesh(mkRibbon(430,-4,72),
    new THREE.MeshStandardMaterial({color:0x1c3234,roughness:0.95,metalness:0}));
  bed.receiveShadow=true;world.add(bed);
  /* animated water sheet: flowing streak texture on a translucent sheet */
  const wc=document.createElement('canvas');wc.width=128;wc.height=512;
  const wg=wc.getContext('2d');
  wg.fillStyle='#3d86a8';wg.fillRect(0,0,128,512);
  for(let i=0;i<130;i++){
    const y=Math.random()*512,x=Math.random()*128,l=8+Math.random()*30;
    wg.strokeStyle='rgba(190,235,255,'+(0.06+Math.random()*0.16)+')';
    wg.lineWidth=1+Math.random()*2.4;
    wg.beginPath();wg.moveTo(x,y);wg.lineTo(x+(Math.random()-0.5)*8,y+l);wg.stroke();
  }
  const waterTex=new THREE.CanvasTexture(wc);
  waterTex.wrapS=waterTex.wrapT=THREE.RepeatWrapping;waterTex.repeat.set(1,7);
  /* R9: real-GPU read said the translucent sheet + specular reads as a
     'forcefield dome' at grazing angle. Reduce opacity/metalness (water
     reads as water by COLOR+FLOW, not mirror band), raise roughness, and
     soften the cyan edge so it reads as foam, not a containment field. */
  const water=new THREE.Mesh(mkRibbon(330,2.2,72),
    new THREE.MeshStandardMaterial({color:0xffffff,map:waterTex,transparent:true,opacity:0.60,roughness:0.55,metalness:0.12,emissive:0x0e2c38,emissiveIntensity:0.4,depthWrite:false}));
  water.renderOrder=2;world.add(water);
  ART._riverSheet=water;
  /* wet-sand shore band: dark damp ribbon on each bank so the water sheet
     visually sits IN the bed (kills the hovering-dome read) */
  for(const side of [-1,1]){
    const shore=new THREE.Mesh(mkRibbon(430,0.6,72),
      new THREE.MeshStandardMaterial({color:0x2c3a30,roughness:0.98,metalness:0,transparent:true,opacity:0.85}));
    shore.renderOrder=1;world.add(shore);
  }
  /* twin glow edges (the readability signature: river reads from across the map) */
  for(const side of [-1,1]){
    const epos=[],eidx=[];
    const segs=72,inner=150*side,outer=182*side;
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      const p=curve.getPoint(t);
      const tan=curve.getTangent(t);
      const nx=-tan.z,nz=tan.x;
      epos.push(p.x+nx*inner,3.4,p.z+nz*inner, p.x+nx*outer,3.4,p.z+nz*outer);
      if(i<segs){const a=i*2;eidx.push(a,a+1,a+2,a+1,a+3,a+2);}
    }
    const egeo=new THREE.BufferGeometry();
    egeo.setAttribute('position',new THREE.Float32BufferAttribute(epos,3));
    egeo.setIndex(eidx);
    const edge=new THREE.Mesh(egeo,
      new THREE.MeshBasicMaterial({color:0x9fe8f2,transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    edge.renderOrder=3;world.add(edge);
  }
  /* R9: stepping stones were 5 evenly spaced identical cylinders in a line —
     read as a 'uniform saw-tooth track'. Rewrite as a scattered natural ford:
     9-13 stones, irregular spacing (some clustered, gaps), varied size AND
     protrusion (some barely break the surface, some sit on the bank), slight
     tilt so they read as worn river stones. */
  const stoneM=ART.mat(0x6a7076,0.9,0.05,4);
  const stoneM2=ART.mat(0x59606a,0.9,0.05,4);
  for(const tCross of [0.26,0.72]){
    const p=curve.getPoint(tCross);
    const tan=curve.getTangent(tCross);
    const nx=-tan.z,nz=tan.x;
    const nStones=9+(R6R(0,5)|0);
    let along=R6R(-140,-60);
    for(let i=0;i<nStones;i++){
      const st=new THREE.Mesh(new THREE.CylinderGeometry(R6R(20,44),R6R(26,52),R6R(7,20),7),R6R(0,1)<0.5?stoneM:stoneM2);
      const cross=R6R(-120,120);
      const out=along+R6R(46,96);
      st.position.set(p.x+nx*cross+tan.x*out, R6R(1,5), p.z+nz*cross+tan.z*out);
      st.rotation.set(R6R(-0.12,0.12),R6R(0,3),R6R(-0.12,0.12));
      st.scale.x=R6R(0.8,1.35);
      st.castShadow=true;st.receiveShadow=true;
      world.add(st);
      along=out;
    }
  }
};

/* ---------------------------- R6C. jungle clusters ------------------------ */
ART.buildJungle6=()=>{
  if(ART._jungle6||typeof world==='undefined'||!world)return;
  ART._jungle6=true;
  const rng=rng6;
  /* authored grove anchors: lane-quad corners, camp flanks, river banks,
     base approaches — clustered, never inside lane corridors (distToLanes).
     Denser ring per grove + more groves = "chunked jungle masses" instead of
     scattered single trees (the #1 jungle read on the real photos). */
  const GROVES=[
    // blue top-side jungle
    [4300,11500,5],[3300,12100,4],[5300,12100,5],[2400,11300,4],
    [4200,10300,4],[3100,9700,5],[2300,8600,4],[1400,9900,4],
    [5000,11000,4],[6100,11500,4],
    // blue bottom-side jungle
    [4900,8600,4],[6300,9100,5],[7000,8200,4],[5700,6800,5],
    [6700,6300,4],[4600,6200,4],[3300,7000,4],[2200,6600,4],
    [5200,7600,4],[4100,5500,4],
    // red top-side jungle (mirror band)
    [9900,8200,5],[8900,8700,4],[8000,6600,4],[9100,6400,5],
    [10100,6800,4],[11300,7800,4],[12100,8400,4],[10800,9000,4],
    [9600,7400,4],[10600,7800,4],
    // red bottom-side jungle
    [10400,3300,5],[11500,2700,4],[9500,2700,5],[12400,3500,4],
    [10600,4500,4],[11700,5100,5],[12500,6200,4],[13400,4900,4],
    [9800,3900,4],[8800,3300,4],
    // river banks (visible from lanes — the silhouette line)
    // R7: pulled the groves that sat directly on the verified base-exit walk
    // ([5600,5600],[6600,5200],[4900,6000]) — they produced the screen-filling
    // blob cluster that hid the player on the real M2 photo. Banks keep their
    // silhouette line via the remaining groves + denser per-grove rings.
    [9200,9200,4],[8200,9600,3],
    [12500,8800,3],[2300,5400,3],[13800,8600,3],[1200,6100,3],
    [9900,8700,3],
    // base approaches
    [2400,13400,4],[13400,2400,4],[3600,13200,3],[13200,3600,3],
    [1400,13400,3],[13400,1400,3]
  ];
  /* geometries: authored low-poly tree = trunk + fork branch + 3-lobe canopy */
  const trunkG=new THREE.CylinderGeometry(11,19,110,6);
  const branchG=new THREE.CylinderGeometry(5,8,58,5);
  /* R7 v3: stochastically jittered blob — vertices pushed along their own
     direction with per-vertex hash noise, giving a lumpy "leaf-mass" surface
     instead of a mathematically perfect sphere (kills the bubble read). */
  const lobeG=new THREE.IcosahedronGeometry(1,2);
  {
    const p=lobeG.attributes.position;
    const h=(x,y,z)=>{const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return s-Math.floor(s);};
    for(let vi=0;vi<p.count;vi++){
      const vx=p.getX(vi),vy=p.getY(vi),vz=p.getZ(vi);
      const n=0.80+h(vx,vy,vz)*0.38;
      p.setXYZ(vi,vx*n,vy*n,vz*n);
    }
    lobeG.computeVertexNormals();
  }
  const trunkM=new THREE.MeshStandardMaterial({color:0x4a3626,roughness:1});
  const leafM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.94});
  /* R10c ghost assets: shared transparent materials + the real geometries,
     used by per-tree ghost groups while a crown blocks the player */
  ART._lobeGeoG=lobeG;ART._trunkGeoG=trunkG;ART._branchGeoG=branchG;
  /* R12 (vision round 4): ghost must inform, not decorate — desaturated
     grey-green so it stops competing with the champion's blue/gold, and
     target opacity 0.18 (was 0.34) so the character reads through it. */
  ART._ghostLeafM=new THREE.MeshStandardMaterial({color:0x49584e,roughness:0.94,
    transparent:true,opacity:0,depthWrite:false});
  ART._ghostWoodM=new THREE.MeshStandardMaterial({color:0x5a524a,roughness:1,
    transparent:true,opacity:0,depthWrite:false});
  ART._leafMat=leafM;                 /* R7: per-tree crown fade drives this */
  ART._lobeBase=[];                   /* R7: per-tree crown bounds {x,z,y,s} */
  const rockG=new THREE.DodecahedronGeometry(1,0);
  const rockM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.9});
  let treeN=0;for(const g2 of GROVES)treeN+=g2[2];
  const trunks=new THREE.InstancedMesh(trunkG,trunkM,treeN);
  const branches=new THREE.InstancedMesh(branchG,trunkM,treeN*2);
  const lobes=new THREE.InstancedMesh(lobeG,leafM,treeN*4);
  ART._lobesIM=lobes;                 /* R10: per-instance crown cull drives this */
  ART._trunksIM=trunks;ART._branchesIM=branches;  /* R10: cull shrinks the whole tree */
  const rocks=new THREE.InstancedMesh(rockG,rockM,treeN*2);
  trunks.castShadow=true;lobes.castShadow=true;rocks.castShadow=true;rocks.receiveShadow=true;
  const dummy=new THREE.Object3D();
  const leafCol=new THREE.Color(),rockCol=new THREE.Color();
  let ti=0,bi=0,li=0,ri=0,guard=0;
  const tryPlaceTree=(x,y)=>{
    if(distToLanes(x,y)<400)return false;
    if(Math.hypot(x-MAPW/2,y-MAPW/2)<1250)return false;
    for(const b of [{x:2000,y:12820},{x:12820,y:2000}])
      if(Math.hypot(x-b.x,y-b.y)<1750)return false;
    /* river corridor exclusion (the 3D river needs its banks clean) */
    for(const [rx,ry] of [[7410,7410],[10400,7400],[4400,4600]])
      if(Math.hypot(x-rx,y-ry)<560)return false;
    const s=R6R(0.75,1.55),rot=rng()*6.28;
    dummy.position.set(x,55*s,y);dummy.scale.setScalar(s);dummy.rotation.set(0,rot,0);
    dummy.updateMatrix();trunks.setMatrixAt(ti++,dummy.matrix);
    for(let b2=0;b2<2;b2++){
      const a=rot+b2*Math.PI+0.5;
      dummy.position.set(x+Math.cos(a)*30*s,(74+b2*18)*s,y+Math.sin(a)*30*s);
      dummy.scale.setScalar(s*(0.8+b2*0.2));
      dummy.rotation.set(0,-a,0.85);dummy.updateMatrix();
      branches.setMatrixAt(bi++,dummy.matrix);
    }
    /* R7 canopy (real-M2-photo fix): crowns lifted ABOVE the camera→player
       sight-line (~340u at 200-400u in front of the character, at default
       zoom) while KEEPING crown volume (wide, slightly flattened lobes) so
       trees still read as full canopies — clear air beneath, never a low
       blob at character height. The fade hook handles dead-on alignment.
       v2: a 4th filler lobe + wider irregular lateral offsets breaks the
       stacked-ball silhouette into a continuous irregular crown; hue shifted
       to forest green (lower lightness, wider jitter) — the "bright lime
       bubble" read on the render review. */
    const lobeDef=[[0,342,92,1.0],[30,398,66,0.85],[-28,450,50,0.7],[6,368,58,0.8]];
    for(let l=0;l<4;l++){
      const L=lobeDef[l];
      dummy.position.set(x+L[0]*s,L[1]*s,y+((l%2)?1:-1)*L[2]*(0.16+0.1*((l+1)%3))*s);
      dummy.scale.set(L[2]*s,L[2]*(l===3?0.5:0.5)*s,L[2]*s);
      dummy.rotation.set(0,rot+l*1.3,0);dummy.updateMatrix();
      lobes.setMatrixAt(li,dummy.matrix);
      leafCol.setHSL(0.26+rng()*0.09,0.36+rng()*0.18,0.115+l*0.038+rng()*0.04);
      lobes.setColorAt(li,leafCol);li++;
    }
    /* R7: remember this tree's top-crown bounds for the sight-line fade */
    if(ART._lobeBase)ART._lobeBase.push({x:x,z:y,y:342*s,s:88*s*1.25});
    return true;
  };
  for(const [gx,gy,n] of GROVES){
    for(let t2=0;t2<n;t2++){
      let placed=false;
      for(let att=0;att<14&&!placed;att++){
        const a=rng()*Math.PI*2,r=R6R(50,300);
        placed=tryPlaceTree(gx+Math.cos(a)*r,gy+Math.sin(a)*r);
      }
    }
    /* rocks + a fallen log per grove (ground-level mid-frequency detail) */
    const nRocks=1+(rng()*2|0);
    for(let k2=0;k2<nRocks&&ri<treeN*2;k2++){
      const a=rng()*Math.PI*2,r=R6R(40,260);
      const x=gx+Math.cos(a)*r,y=gy+Math.sin(a)*r;
      if(distToLanes(x,y)<330)continue;
      const s=R6R(16,44);
      dummy.position.set(x,s*0.55,y);dummy.scale.set(s,s*R6R(0.6,0.9),s*R6R(0.8,1.2));
      dummy.rotation.set(rng()*0.6,rng()*6.28,rng()*0.6);dummy.updateMatrix();
      rocks.setMatrixAt(ri,dummy.matrix);
      rockCol.setHSL(0.08+rng()*0.04,0.06+rng()*0.05,0.32+rng()*0.12);
      rocks.setColorAt(ri,rockCol);ri++;
    }
    if(rng()<0.55){
      const a=rng()*Math.PI*2,r=R6R(60,240);
      const x=gx+Math.cos(a)*r,y=gy+Math.sin(a)*r;
      if(distToLanes(x,y)>300){
        const logM2=trunkM.clone();logM2.transparent=true;
        const log=new THREE.Mesh(new THREE.CylinderGeometry(13,16,R6R(120,220),6),logM2);
        log.position.set(x,14,y);log.rotation.set(Math.PI/2,0,rng()*6.28);
        log.castShadow=true;log.receiveShadow=true;world.add(log);
        log.userData.groundClutter=1;
        const stM2=trunkM.clone();stM2.transparent=true;
        const stump=new THREE.Mesh(new THREE.CylinderGeometry(18,22,30,7),stM2);
        stump.position.set(x+R6R(-60,60),15,y+R6R(-60,60));
        stump.castShadow=true;world.add(stump);
        stump.userData.groundClutter=1;
      }
    }
    guard++;
  }
  trunks.count=ti;branches.count=bi;lobes.count=li;rocks.count=ri;
  if(lobes.instanceColor)lobes.instanceColor.needsUpdate=true;
  if(rocks.instanceColor)rocks.instanceColor.needsUpdate=true;
  world.add(trunks);world.add(branches);world.add(lobes);world.add(rocks);
};

ART.buildSpires6=()=>{
  if(ART._spires6||typeof world==='undefined'||!world)return;
  ART._spires6=true;
  const stone=ART.mat(0x4c5462,0.85,0.2,8);
  const goldM=new THREE.MeshStandardMaterial({color:0xc9a23f,metalness:0.78,roughness:0.34});
  /* R9: real-GPU read called these "evenly spaced identical wizard figures"
     — the killer was the FIXED i+=6 rhythm + identical size every time.
     Rewrite as an irregular wayside-shrine rhythm: skip ~40% of slots, vary
     height 0.7-1.3x, alternate sides irregularly, occasionally pair two
     shrines (gate feel) or make a single TALL one (1.6x landmark), and only
     SOME carry the emissive rune (dark weathered stones between). Reads as
     ancient roadside shrines, not traffic cones. */
  const stoneW=ART.mat(0x4a4f5c,0.9,0.15,6);
  for(const lane of ['top','mid','bot']){
    const path=LANES[lane].path;
    let side=1;
    for(let i=3;i<path.length-3;i+=6){
      if(R6R(0,1)<0.40)continue;                 /* irregular gaps */
      const p=path[i];
      const a=Math.atan2(path[i+1].y-p.y,path[i+1].x-p.x)+Math.PI/2;
      if(R6R(0,1)<0.6)side=-side;                /* irregular side flips */
      const off=470*side;
      const lx=p.x+Math.cos(a)*off,ly=p.y+Math.sin(a)*off;
      const team=((lane==='top'&&p.y>7410)||(lane==='bot'&&p.x<7410)||(lane==='mid'&&p.x+p.y>14820))?0:1;
      const col=team===0?0x3a8fe8:0xe0503a;
      const mk=(hs,glow)=>{
        const grp=new THREE.Group();
        const foot=new THREE.Mesh(new THREE.CylinderGeometry(26*hs,34*hs,18*hs,7),stoneW);
        foot.position.y=9*hs;foot.castShadow=true;
        const body=new THREE.Mesh(new THREE.CylinderGeometry(13*hs,22*hs,120*hs,6),stone);
        body.position.y=78*hs;body.castShadow=true;
        const cap=new THREE.Mesh(new THREE.ConeGeometry(15*hs,26*hs,6),stone);
        cap.position.y=151*hs;cap.castShadow=true;
        grp.add(foot,body,cap);
        if(glow){                                 /* only some shrines are lit */
          const rune=new THREE.Mesh(new THREE.CylinderGeometry(15*hs,15*hs,20*hs,6,1,true),
            new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.2,side:THREE.DoubleSide}));
          rune.position.y=104*hs;
          const ember=new THREE.Mesh(new THREE.OctahedronGeometry(8*hs,0),
            new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.5}));
          ember.position.y=176*hs;
          grp.add(rune,ember);
        }else{                                    /* weathered: gold band chip */
          const band=new THREE.Mesh(new THREE.TorusGeometry(16*hs,2.2*hs,5,8),goldM);
          band.rotation.x=Math.PI/2;band.position.y=118*hs;grp.add(band);
        }
        grp.rotation.y=R6R(0,6.28);
        grp.position.set(lx,0,ly);
        world.add(grp);
      };
      const tall=R6R(0,1)<0.14;                   /* rare 1.6x landmark */
      mk(tall?1.6:R6R(0.72,1.28), R6R(0,1)<0.55);
      if(!tall&&R6R(0,1)<0.22){                   /* occasional gate pair */
        const q=path[Math.min(path.length-4,i+1)];
        const a2=Math.atan2(path[i+2]?path[i+2].y-q.y:1,path[i+2]?path[i+2].x-q.x:0)+Math.PI/2;
        const lx2=q.x+Math.cos(a2)*(-off),ly2=q.y+Math.sin(a2)*(-off);
        const grp2=new THREE.Group();
        const b2=new THREE.Mesh(new THREE.CylinderGeometry(13,22,120,6),stone);
        b2.position.y=78;b2.castShadow=true;
        const c2=new THREE.Mesh(new THREE.ConeGeometry(15,26,6),stone);
        c2.position.y=151;c2.castShadow=true;
        const f2=new THREE.Mesh(new THREE.CylinderGeometry(26,34,18,7),stoneW);
        f2.position.y=9;f2.castShadow=true;
        grp2.add(f2,b2,c2);
        grp2.rotation.y=R6R(0,6.28);
        grp2.position.set(lx2,0,ly2);
        world.add(grp2);
      }
    }
  }
};
