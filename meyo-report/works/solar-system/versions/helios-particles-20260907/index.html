<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HELIOS / 科学太阳系航行图</title><link rel="stylesheet" href="style.css"></head><body>
<div id="loading"><div class="sun-loader"></div><b>正在建立科学太阳系航行图</b><small>HELIOS DEEP SPACE ENGINE</small></div>
<header><div class="brand"><strong>HELIOS <i>/ DEEP SPACE</i></strong><span>SOLAR SYSTEM · GALAXY · NEBULAE</span></div><div class="readout"><b id="clock">0000.00 SIM DAYS</b><span>真实周期数据 · 距离与尺寸视觉压缩</span></div></header>
<div id="status">READY · 3D SCENE</div><svg id="render-proof" width="2" height="2" aria-hidden="true"><rect width="2" height="2" fill="#091423"/></svg><div id="reticle"><span></span></div><div id="labels"></div>
<aside id="card" aria-live="polite"><button id="close" aria-label="关闭">×</button><div class="eyebrow">CELESTIAL OBJECT <span id="index"></span></div><h1 id="name"></h1><p id="desc"></p><div class="stats"><div><small>轨道周期</small><b id="orbit"></b></div><div><small>自转周期</small><b id="spin"></b></div><div><small>轨道位置</small><b id="au"></b></div><div><small>轴倾角 / 分类</small><b id="tilt"></b></div></div><button id="overview">← 返回太阳系全景</button></aside>
<nav><button id="pause">Ⅱ&nbsp; 暂停</button><label>时间倍率 <select id="speed"><option value="1">1 日 / 秒</option><option value="10" selected>10 日 / 秒</option><option value="50">50 日 / 秒</option><option value="200">200 日 / 秒</option></select></label><button id="home">⌂&nbsp; 全景</button></nav>
<div class="legend"><span><i class="major"></i>行星</span><span><i class="dwarf"></i>矮行星</span><span><i class="moon"></i>卫星</span></div><div class="hint">拖拽旋转 · 滚轮/双指缩放 · 点击天体聚焦</div><div class="vignette"></div><div class="grain"></div><script src="bundle.js"></script></body></html>
