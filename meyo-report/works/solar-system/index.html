<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>太阳系 · 轨道档案</title>
<style>
:root{color-scheme:dark;--line:rgba(155,195,255,.2);--glass:rgba(7,13,26,.72);--muted:#91a3bb;--bright:#f0f6ff;--accent:#8fbfff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a;color:var(--bright);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body:before{content:"";position:fixed;inset:-25%;background:radial-gradient(ellipse at 18% 30%,rgba(28,61,132,.2),transparent 34%),radial-gradient(ellipse at 80% 72%,rgba(91,30,88,.15),transparent 30%);pointer-events:none}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}button,select{font:inherit}button:focus-visible,select:focus-visible,.planet-nav button:focus-visible{outline:2px solid #9dc7ff;outline-offset:2px}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#91a5c2;font-size:12px;letter-spacing:.15em;transition:opacity .4s}.top{position:fixed;top:0;left:0;right:0;padding:26px 32px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand small{font-size:9px;letter-spacing:.42em;color:#7fa3d2}.brand h1{font-weight:300;letter-spacing:.13em;margin:7px 0;font-size:24px;text-shadow:0 2px 22px #000}.brand p{margin:0;color:#8497b2;font-size:11px}.tools{display:flex;gap:8px;pointer-events:auto;align-items:center}.tools button,.tools select{height:40px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);color:#dceaff;padding:0 15px;border-radius:22px;cursor:pointer;min-width:44px}.tools button:hover,.tools select:hover{border-color:rgba(166,206,255,.45);background:rgba(17,28,50,.82)}
.planet-nav{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border:1px solid rgba(150,190,245,.13);border-radius:28px;background:rgba(4,9,20,.6);backdrop-filter:blur(16px)}.planet-nav button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#8fa3be;cursor:pointer;font-size:11px}.planet-nav button:hover,.planet-nav button.active{background:rgba(111,160,226,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(144,190,252,.26)}
.hint{position:fixed;left:30px;bottom:28px;color:#7d8da5;font-size:10px;letter-spacing:.08em}.disclosure{position:fixed;left:30px;bottom:9px;color:#50627b;font-size:8px;letter-spacing:.03em}.card{position:fixed;z-index:4;right:26px;top:50%;width:350px;max-height:calc(100vh - 80px);overflow:auto;transform:translate(430px,-50%);opacity:0;visibility:hidden;transition:.45s cubic-bezier(.2,.8,.2,1);padding:27px;background:linear-gradient(145deg,rgba(16,27,50,.92),rgba(4,8,17,.9));border:1px solid rgba(159,196,255,.19);border-radius:20px;box-shadow:0 32px 90px rgba(0,0,0,.6);backdrop-filter:blur(24px)}.card.open{transform:translate(0,-50%);opacity:1;visibility:visible}.eyebrow{color:#7eafe7;font-size:9px;letter-spacing:.22em}.card h2{font-size:28px;font-weight:350;margin:14px 0 7px}.card .summary{color:#afbdd0;line-height:1.7;font-size:13px;margin:0}.close{position:absolute;right:14px;top:14px;width:40px;height:40px;padding:0;border:1px solid rgba(160,195,240,.17);border-radius:50%;background:rgba(9,15,28,.55);color:#d7e6f8;cursor:pointer}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.stats div{padding:13px;background:rgba(128,171,229,.055);border:1px solid rgba(145,188,243,.08);border-radius:10px}.stats b,.stats span{display:block}.stats b{font-size:13px;font-weight:500}.stats span{font-size:9px;color:#7186a3;margin-top:5px}.focus{width:100%;margin-top:15px;height:42px;border:1px solid rgba(147,193,255,.22);border-radius:22px;background:rgba(67,114,180,.12);color:#dcecff;cursor:pointer}.note{font-size:9px!important;color:#687b96!important;margin:15px 0 0!important;line-height:1.5!important}.fallback{display:none;position:fixed;inset:0;padding:40px;place-items:center;text-align:center;background:#030713}.fallback div{max-width:500px}.fallback h2{font-weight:400}.fallback p{color:#96a8c1;line-height:1.7}
body:after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 190px 45px rgba(0,0,0,.76);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.022'/%3E%3C/svg%3E")}
@media(max-width:760px){.top{padding:16px;display:block}.brand h1{font-size:20px}.brand p{display:none}.tools{margin-top:11px;gap:5px}.tools button,.tools select{height:44px;padding:0 12px;font-size:12px}.hint{display:none}.disclosure{left:15px;right:15px;bottom:65px;text-align:center;font-size:7px}.planet-nav{bottom:11px;max-width:calc(100vw - 20px);overflow-x:auto}.planet-nav button{min-width:36px}.card{top:auto;bottom:65px;left:10px;right:10px;width:auto;max-height:58vh;transform:translateY(120%);padding:21px}.card.open{transform:translateY(0)}.stats{grid-template-columns:repeat(3,1fr)}.stats div{padding:10px}.card h2{font-size:23px;margin:9px 0 5px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="可旋转、缩放并选择行星的三维太阳系"></canvas>
<div id="status" role="status">正在初始化星图…</div>
<header class="top"><div class="brand"><small>ORBITAL ARCHIVE / 01</small><h1>太阳系 · 轨道档案</h1><p>统一模拟时钟 · 真实相对周期与运动方向</p></div><div class="tools"><select id="speed" aria-label="模拟时间倍率"><option value="3">0.25×</option><option value="12" selected>1× · 12日/秒</option><option value="60">5×</option><option value="240">20×</option></select><button id="pause" aria-pressed="false">暂停</button><button id="reset">重置视角</button></div></header>
<nav class="planet-nav" aria-label="选择行星" id="planet-nav"></nav>
<div class="hint">拖拽旋转 · 滚轮/双指缩放 · 点击行星探索</div>
<div class="disclosure">距离与天体尺寸经视觉压缩 · 周期及运动方向保持真实相对关系 · 初始相位非真实历元</div>
<aside class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="name" aria-live="polite"><button class="close" id="close" aria-label="关闭信息卡">×</button><div class="eyebrow">天体档案 / CELESTIAL PROFILE</div><h2 id="name"></h2><p class="summary" id="summary"></p><div class="stats" id="stats"></div><button class="focus" id="focus">平滑聚焦此行星</button><p class="note">数据为展示用平均值，不构成当前日期的精密星历。</p></aside>
<div class="fallback" id="fallback"><div><h2>无法启动 3D 星图</h2><p>当前浏览器未提供可用的 WebGL。请使用最新版 Chrome、Edge、Firefox 或 Safari，并确认硬件加速已启用。</p></div></div>
<script src="app.bundle.js"></script>
</body></html>
